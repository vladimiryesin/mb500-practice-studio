etter precision.", "correct": false}, {"text": "Refactor the existing queries to use set-based operations instead of row-by-row processing.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Query paging is a technique that helps in managing large datasets by retrieving only a subset of records at a time, which can improve performance. Caching can significantly reduce the number of database calls by storing frequently accessed data in memory. Set-based operations are more efficient than row-by-row processing as they leverage the database's ability to handle data in bulk. Increasing timeout settings does not improve performance and may lead to longer wait times for users. Retrieving all records into memory can cause out-of-memory exceptions and does not scale well. Cursor-based processing is less efficient than set-based operations and can lead to poor performance.\n\nUse X++ to write SQL statements ypes - Training | Microsoft Learn X++ variables - Training | Microsoft Learn", "references": [{"title": "Use X++ to write SQL statements ypes - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/get-started-xpp-finance-operations/4-sql"}, {"title": "X++ variables - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-ref/xpp-variables-data-types"}]}]}, {"id": "29fb970556569322fd3236f735d17654160027cda69a0a3544a96764fb051ba3", "stem": "You are migrating data from a legacy system to the Dynamics 365 finance and operations apps.\n\nYou need to ensure that the data migration process is efficient and that any import errors can be quickly identified and fixed.\n\nWhich three features should you use? Each correct answer presents a complete solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Disable the use of staging tables", "correct": false}, {"text": "Import all entities regardless of their relevance to the migration", "correct": false}, {"text": "Skip selected records and proceed with the import using only the good data", "correct": true}, {"text": "Select only the entities you need to migrate", "correct": true}, {"text": "Schedule data imports using a batch", "correct": true}, {"text": "Stop the entire import process if an error occurs", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The data management framework in Dynamics 365 finance and operations appsallows you to select only the entities you need to migrate, which makes the process more efficient. If an import error occurs, you can skip selected records and proceed with the import using only the good data, which allows you to quickly identify and fix the bad data. Data imports can also be easily scheduled using a batch. Disabling the use of staging tables is not recommended as they allow you to verify, clean up, or convert data before you move it. Importing all entities regardless of their relevance to the migration would make the process less efficient. Stopping the entire import process if an error occurs would not be efficient as it would require restarting the entire process.\n\nExport, import, and copy data into a legal entity - Training | Microsoft Learn\nData management overview - Training | Microsoft Learn", "references": [{"title": "Export, import, and copy data into a legal entity - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/work-data-management-finance-operations/7-export-import-copy-data"}, {"title": "Data management overview - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/data-entities/data-entities-data-packages"}]}]}, {"id": "1f32a67a870a7e33d8108bf47cadac89bc6dd17a75112f0455d1430446678ba2", "stem": "Your company is experiencing delays in sales order processing because of inefficient data management in its Microsoft Dynamics 365 finance and operations apps.\n\nYou need to optimize the data management process to improve the performance of sales order processing.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Disable change tracking on sales order entities to speed up data management.", "correct": false}, {"text": "Schedule a nightly restart of the finance and operations apps to clear temporary data.", "correct": false}, {"text": "Design entity sequencing to prioritize critical sales order entities during data import and export.", "correct": true}, {"text": "Increase the batch size for all data entities to the maximum limit.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct answer is to design entity sequencing to prioritize critical sales order entities during data import and export. This can improve the performance of sales order processing. Disabling change tracking could lead to data inconsistency and does not address the performance issue. Increasing the batch size indiscriminately or scheduling a nightly restart of the app does not directly optimize the data management process and could potentially degrade performance or lead to downtime.\n\nMonitor status and availability of entities - Training | Microsoft Learn Data import and export jobs overview - Training | Microsoft Learn", "references": [{"title": "Monitor status and availability of entities - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/data-integrations-finance-operations/monitor-status-entities"}, {"title": "Data import and export jobs overview - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/fin-ops/data-entities/data-import-export-job"}]}]}, {"id": "e0e34090d70dd4ce8ec26e9c5fa4057218389703b6e2363bf4e3f6a5cee32b45", "stem": "You are tasked with adding a new form that follows a specific template to a project.\n\nYou need to apply a form pattern to ensure consistency with the existing application design.\n\nWhat is the correct way to accomplish this?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Set the Pattern property in the form's Properties window.", "correct": false}, {"text": "Drag and drop the pattern from the Solution Explorer onto the form.", "correct": false}, {"text": "Select the form and click the 'Apply Template' button in the toolbar.", "correct": false}, {"text": "Right-click the Design node and select Apply pattern.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct way to apply a form pattern is to right-click the Design node and select Apply pattern. The other options are not standard methods for applying form patterns in Dynamics 365.\n\nAdd grids, fields, and groups to a form - Training | Microsoft Learn\nCreate and extend menus - Training | Microsoft Learn\nLab - Create a form - Training | Microsoft Learn", "references": [{"title": "Add grids, fields, and groups to a form - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-forms-optimize-finance-operations/4-grids"}, {"title": "Create and extend menus - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-forms-optimize-finance-operations/create-menus"}, {"title": "Lab - Create a form - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-forms-optimize-finance-operations/9-exercise"}]}]}, {"id": "cd8ee40ece26decf11a14dd76788201654155d80c6084a8fc8433ce83ebc42db", "stem": "You have a class named Class1 that has a method named Method1. Method1 is a protected method.\n\nYou create a class named Class2 that extends Class1. Class2 has a public method named Method2.\n\nYou declare a Class2 variable named var1.\n\nYou need to call Method1 from Method2.\n\nWhich keyword should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Class1", "correct": false}, {"text": "Class2", "correct": false}, {"text": "this", "correct": true}, {"text": "var1", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Using var1 is incorrect because it is simply a variable reference to an instance of Class2; it cannot be used to directly invoke a protected method from within the class context. Using this is correct because protected methods are accessible within a derived class, and this refers to the current instance of Class2, which inherits Method1 from Class1. Referring to Class1 is incorrect because protected methods cannot be invoked statically on a base class. Referring to Class2 is also incorrect because the class name itself cannot be used to call inherited instance methods; you must use the current object context.\n\nhttps://docs.microsoft.com/en-us/dynamics365/unified-operations/dev-itpro/dev-tools/class-extension-implementations", "references": [{"title": "https://docs.microsoft.com/en-us/dynamics365/unified-operations/dev-itpro/dev-tools/class-extension-implementations", "url": "https://docs.microsoft.com/en-us/dynamics365/unified-operations/dev-itpro/dev-tools/class-extension-implementations"}]}]}, {"id": "d5adbaaf1cc3b541ddcb47ed6a5eeae6919682a3fd8e599fda2cceeacf39c76a", "stem": "You are integrating Microsoft Dynamics 365 finance and operations apps with an external system. You need to integrate data from the external system into Dynamics 365. Which integration pattern should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Embedding", "correct": true}, {"text": "Push", "correct": false}, {"text": "One-way sync", "correct": false}, {"text": "Pull", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Embedding integration pattern is used when information from one system is seamlessly integrated into the UI of another system. Push, Pull, and One-way sync are different types of integration patterns and do not specifically deal with UI integration.\n\nChoose the right pattern for your Dynamics 365 apps integration strategy - Training | Microsoft Learn Prepare data for migration to finance and operations apps - Training | Microsoft Learn", "references": [{"title": "Choose the right pattern for your Dynamics 365 apps integration strategy - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/integrate-other-solutions-choose-pattern"}, {"title": "Prepare data for migration to finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/prepare-data-migration-finance-operations/"}]}]}, {"id": "d2e8e160f084bf7bc4048c7bd38f5442dd3e812d89f33e954fe9bb56ca43aed5", "stem": "Your company uses a third-party application hosted on-premises to define and configure its products. When a product is defined or changed in the on-premises application, the same change should be reflected in real-time in the finance and operations apps.\n\nYou need to implement an integration solution that allows real-time data transfer from the on-premises application to the finance and operations apps with minimal coding effort.\n\nWhich integration pattern should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Custom service development", "correct": false}, {"text": "Batch data API", "correct": false}, {"text": "Consume external web services", "correct": false}, {"text": "OData service endpoints", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The OData service endpoints are best suited for this scenario as they allow real-time data transfer. Batch data API is used for asynchronous data transfer and is not suitable for real-time requirements. Custom service development would require more coding effort. Consuming external web services is typically used when the application needs to call out to an external web service.\n\nIntegrate finance and operations apps with Microsoft Excel - Training | Microsoft Learn Integration between finance and operations apps and third-party services - Training | Microsoft Learn", "references": [{"title": "Integrate finance and operations apps with Microsoft Excel - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/integration-concepts-finance-operations/6-excel"}, {"title": "Integration between finance and operations apps and third-party services - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/data-entities/integration-overview"}]}]}, {"id": "56fc06d745a0ba1e31e4f9ca496b09f2c248c91a9541dfe824ad02cf59f1f52c", "stem": "The development team is working on a Microsoft Dynamics 365 finance and operations apps implementation. They need to implement a custom business logic that will be triggered whenever a sales order is updated.\n\nYou need to ensure that the custom business logic can be executed without modifying the base SalesTable class.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Use a display method on the SalesTable form to invoke the custom business logic when the form is refreshed.", "correct": false}, {"text": "Directly modify the update method of the SalesTable class to include the custom business logic.", "correct": false}, {"text": "Create a new class that inherits from the SalesTable class and override the update method.", "correct": false}, {"text": "Create a class extension for the SalesTable class and add a post-event handler for the update method.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct answer is to create a class extension and add an event handler, which allows custom code to be executed without altering the original class, adhering to best practices for extensibility. Modifying the base class directly is not recommended as it can lead to issues during updates and maintenance. Creating a new class that inherits from the SalesTable class is unnecessary for this scenario and could complicate the system. Using a display method on the form is not appropriate for executing business logic tied to data updates.\n\nManage metadata by using the Application Explorer - Training | Microsoft Learn", "references": [{"title": "Manage metadata by using the Application Explorer - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/training/modules/customize-visual-studio-finance-operations/3-metadata"}]}]}, {"id": "f6c6f48c57495cdb8c1076e2a5fef027323bcaf29eeba8b68589df4e7623170e", "stem": "Your company is experiencing slow data entity operations in Microsoft Dynamics 365 finance and operations apps, which is affecting the efficiency of data imports and exports.\n\nYou need to enhance the performance of data entity operations to ensure smooth data movement.\n\nWhat should you do? Each correct answer presents a complete solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Increase the number of simultaneous data entity operations to process more data concurrently.", "correct": false}, {"text": "Disable all data entity triggers to speed up data transactions.", "correct": false}, {"text": "Review and optimize the underlying SQL queries used by the data entities.", "correct": true}, {"text": "Utilize the Data Import/Export Framework (DIXF) to manage data entities efficiently.", "correct": true}, {"text": "Implement priority-based batch scheduling for data entity operations..", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Options C, D, and E are correct because utilizing DIXF helps manage data entities more efficiently, implementing priority-based batch scheduling can distribute the workload, and optimizing SQL queries can reduce execution time. Option B is incorrect as disabling triggers may lead to data integrity issues. Option A is incorrect because increasing the number of operations without addressing the root cause of the performance issue could lead to further system strain.\n\nDiagnose issues and analyze performance by using Trace parser - Training | Microsoft Learn Diagnose and optimize client performance - Training | Microsoft Learn", "references": [{"title": "Diagnose issues and analyze performance by using Trace parser - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/perf-test/trace-parser"}, {"title": "Diagnose and optimize client performance - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-forms-optimize-finance-operations/7-optimize"}]}]}, {"id": "65f8d567f5537734dcc86edbe0afd5f1a591b53cf3fdefb18867a9ec043ded94", "stem": "You have been asked to develop a report. This report must let users interact with data by selecting visuals to see cause and effect. It must also let users perform simple what-if operations without leaving the workspace.\n\nYou need to choose a reporting tool that provides a highly visual, interactive experience.\n\nWhich reporting tool should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "SSRS reporting", "correct": false}, {"text": "Electronic Reporting", "correct": false}, {"text": "Power BI", "correct": true}, {"text": "Financial Reporting", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Power BI delivers interactive reports that are seamlessly integrated into application workspaces and provide a highly visual, interactive experience. SSRS reporting is used for back-office document management capabilities. Financial Reporting is used for creating custom financial reports. Electronic Reporting is used to configure electronic document formats.\n\nInformation access and reporting - Training | Microsoft Learn Reporting capabilities - Training | Microsoft Learn", "references": [{"title": "Information access and reporting - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/analytics/information-access-reporting"}, {"title": "Reporting capabilities - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-ecosystem-main-components-finance-operations/5-reporting"}]}]}, {"id": "0933b096d66366a4ec779a7b6b5b3d38db1ac707af1cd65867f6badae412aaae", "stem": "Your company needs to provide its sales team with interactive financial reports that can be accessed from Dynamics 365 finance and operations apps.\n\nYou need to create a solution that allows the sales team to analyze financial data interactively within the Dynamics 365 environment.\n\nWhat should you recommend?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Develop custom interactive pages using JavaScript within the Dynamics 365 environment.", "correct": false}, {"text": "Instruct the sales team to use the native Dynamics 365 report export functionality for interactive analysis.", "correct": false}, {"text": "Create and integrate Power BI reports within the Dynamics 365 finance and operations apps.", "correct": true}, {"text": "Implement an external reporting tool and link it to Dynamics 365 via OData.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Creating and integrating Power BI reports within the Dynamics 365 finance and operations apps provides interactive financial reporting capabilities directly in the Dynamics 365 environment. Developing custom pages is beyond the scope of standard reporting features. Using the native export functionality does not provide interactive capabilities. Implementing an external tool is unnecessary when Power BI integration is available.\n\nReporting capabilities - Training | Microsoft Learn Create reporting solutions - Training | Microsoft Learn", "references": [{"title": "Reporting capabilities - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-ecosystem-main-components-finance-operations/5-reporting"}, {"title": "Create reporting solutions - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/analytics/create-nextgen-reporting-solutions"}]}]}, {"id": "5765c6ebabf03c14db2582d1221938545148a6bbbac6e75d9a2279c9ec267059", "stem": "You are developing a form that supports drill-down navigation.\n\nYou need to ensure that the form’s data source table is always updated, regardless of how the form is invoked.\n\nTo which method should you add the update code?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "close", "correct": false}, {"text": "init", "correct": true}, {"text": "initValue", "correct": false}, {"text": "run", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The Close method is not correct because it only executes when the form is closing. While useful for persisting state, it runs too late in the lifecycle to ensure updates are applied at form initialization. The Init method is correct because it always executes when the form is created, regardless of how it is opened. This makes it the best place to guarantee consistent updates to the data source table. The InitValue method is not correct because it only executes when a new record is being created in the data source; it does not cover all situations where the form is opened. The Run method is not correct because it executes after the form has been initialized and displayed, which is too late to reliably enforce updates that must be applied as soon as the form opens.\n\nImplement built-in KPIs, charts, and other reporting components - Training | Microsoft Learn", "references": [{"title": "Implement built-in KPIs, charts, and other reporting components - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/training/modules/build-workspaces-finance-operations/4-built-in-kpi"}]}]}, {"id": "ed970e051fa2ca497171b5720f9b751c6e8ce2a3a7f042f4cc54eac73c3e825e", "stem": "You have a Microsoft Visual Studio solution that contains a Finance and Operations project. The project includes custom objects.\n\nYou discover that one object is unnecessary.\n\nYou need to remove the object. The solution must minimize administrative effort.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Remove the code from Application Explorer.", "correct": false}, {"text": "Remove the code from the metadata of the extension model.", "correct": false}, {"text": "Remove the code from the model.", "correct": false}, {"text": "Remove the code from the project.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Removing an object from Application Explorer is not a valid action — Application Explorer is where you browse and add objects to a project, not remove them. Removing the object from the model itself is too heavy-handed, since models are logical containers of many elements; this would impact all projects tied to that model and increase administrative effort. The correct action is to remove the object from the project. This removes it from the solution in Visual Studio without affecting the underlying metadata or other projects that may reference it, which is the simplest and least disruptive approach. Removing the object from the extension model metadata is not a supported or recommended way to manage elements and would create unnecessary maintenance issues.\n\nApplication Explorer - Training | Microsoft Learn\nDevelopment tools in Visual Studio - Training | Microsoft Learn\nFinance and operations project type in Visual Studio - Training | Microsoft Learn", "references": [{"title": "Application Explorer - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-tools/application-explorer"}, {"title": "Development tools in Visual Studio - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-tools/development-tools-overview"}, {"title": "Finance and operations project type in Visual Studio - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-tools/projects"}]}]}, {"id": "41132d7936663588c224b680650000b481049c2516c29fbc7becf7093fbe6fbc", "stem": "You are integrating a legacy system that uses SOAP web services.\n\nYou need to ensure the integration is seamless and aligns with modern cloud-based practices.\n\nYou need to consume the legacy SOAP web services.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Use Azure Logic Apps to replace the legacy system's functionality.", "correct": false}, {"text": "Create a custom service that acts as a bridge between the SOAP web services and Dynamics 365.", "correct": true}, {"text": "Ignore the legacy system and create new data entities from scratch in Dynamics 365.", "correct": false}, {"text": "Directly modify the legacy system to support RESTful API standards.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The optimal solution for integrating a legacy system that uses SOAP web services with Dynamics 365 is to create a custom service. This service will act as a bridge between the SOAP web services and Dynamics 365, ensuring seamless integration without altering the legacy system. Other options that suggest modifying the legacy system, replacing it, or creating new data entities from scratch in Dynamics 365 do not address the need for integration and may not be feasible.\n\nIntegration architecture design - Training | Microsoft Learn Optimize data entities to achieve better performance - Training | Microsoft Learn", "references": [{"title": "Integration architecture design - Training | Microsoft Learn", "url": "https://learn.microsoft.com/azure/architecture/integration/integration-start-here"}, {"title": "Optimize data entities to achieve better performance - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/external-data-sources-finance-operations/4-performance"}]}]}, {"id": "50ed0d6cef7c849d9e72acb6643625c3c2bcd2f2b3097518dc4864ea76684311", "stem": "A multinational corporation requires seamless integration between its finance and operations apps and customer engagement apps to share common entities, such as customers and products, in real time.\n\nYou need to set up an integration that allows instant reflection of changes in one system to the other.\n\nWhich integration option should you configure?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Implement dual-write for synchronous, real-time integration between the apps.", "correct": true}, {"text": "Use the OData protocol to periodically synchronize data entities.", "correct": false}, {"text": "Establish a virtual table in Dataverse for the finance and operations apps.", "correct": false}, {"text": "Create a custom Power Automate flow to transfer data between the apps.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Dual-write provides synchronous, real-time integration, which is necessary for the corporation's requirement of instant data reflection. The OData protocol is typically used for asynchronous data exchange. A custom Power Automate flow would not inherently provide real-time synchronization. A virtual table in Dataverse is for pulling data from external sources on demand, not for real-time integration between Dynamics 365 apps.\n\nExplore data integration concepts in finance and operations apps - Training | Microsoft Learn Integrate Dynamics 365 apps with other systems - Training | Microsoft Learn", "references": [{"title": "Explore data integration concepts in finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/integration-patterns-finance-operations/4-scenarios"}, {"title": "Integrate Dynamics 365 apps with other systems - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/integrate-other-solutions-guidance-product"}]}]}, {"id": "f5b708ed583e1af382af5196d35c765a17e5d37fd3a4a7154a2d094bacc046c1", "stem": "A developer is working on Microsoft Dynamics 365 finance and operations apps. The application is experiencing performance issues due to large batch jobs running during peak business hours.\n\nYou need to ensure that the batch jobs do not impact the application's performance during peak business hours.\n\nWhat should you do? Each correct answer presents a complete solution. Choose two.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Implement the batch framework to schedule batch jobs during off-peak hours.", "correct": true}, {"text": "Implement the SysOperation framework to handle the batch jobs.", "correct": false}, {"text": "Disable the batch jobs during peak hours.", "correct": false}, {"text": "Optimize the batch jobs by breaking them into smaller tasks that can run concurrently.", "correct": true}, {"text": "Increase the server capacity to handle the load during peak hours.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Implementing the batch framework allows for scheduling of batch jobs during off-peak hours, reducing the load on the server during peak business hours. Optimizing the batch jobs by breaking them into smaller tasks that can run concurrently can also improve performance. Increasing server capacity might not solve the problem if the batch jobs are not optimized. Disabling the batch jobs during peak hours could disrupt business operations. The SysOperation framework is not specifically designed to handle batch jobs.\n\nFinance and operations apps frameworks - Training | Microsoft Learn Finance and operations application documentation - Training | Microsoft Learn", "references": [{"title": "Finance and operations apps frameworks - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/design-deployment-finance-operations/8-frameworks"}, {"title": "Finance and operations application documentation - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/fin-ops/"}]}]}, {"id": "5b4b8e6cf980fd0587a58dfe1ca61a263431b4dc6cc128cf582a974664385874", "stem": "You are working on a finance and operations app. You have a custom table called ContosoBankCheque with two fields BankAccount and CheckNo.\n\nYou need to run a user interface-driven process to add 100 new check numbers, starting from 10000, by using the sandbox framework without freezing or timing out the web client. What should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Run the process in synchronous mode in the web client.", "correct": false}, {"text": "Use SysOperationSandbox to run two client sessions in parallel.", "correct": true}, {"text": "Create a new form and add a button without using SysOperationSandbox.", "correct": false}, {"text": "Use batch processes to perform the task.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Option B is correct because the SysOperationSandbox framework allows you to run two client sessions in parallel, keeping the user interface live without allowing a timeout. Option A is incorrect because running the process in synchronous mode in the web client will freeze the web browser until the process completes. Option C is incorrect because batch processes are used for lengthy tasks that are implemented on the batch servers, not for user interface-driven processes. Option D is incorrect because simply creating a new form and adding a button will not solve the problem of the web client freezing.\n\nImplement the SysOperationSandbox framework - Training | Microsoft Learn The user interface - Training | Microsoft Learn Use X++ runtime functions for common tasks - Training | Microsoft Learn", "references": [{"title": "Implement the SysOperationSandbox framework - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-extensions-framework-finance-operations/sysoperationsandbox-framework"}, {"title": "The user interface - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-ecosystem-main-components-finance-operations/4-ui"}, {"title": "Use X++ runtime functions for common tasks - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/get-started-xpp-finance-operations/8-runtime"}]}]}, {"id": "2ca7be855a809dcd917910dbb86db275b639a4efb2d3ffeacbf31957bbde725e", "stem": "The development team needs to optimize data retrieval for a frequently accessed product table containing many records in Microsoft Dynamics 365 finance and operations apps. You need to improve retrieval without modifying the table structure. What should you do? Each correct answer presents a complete solution. Choose two.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Implement a caching strategy for the product table to improve read performance.", "correct": true}, {"text": "Create a summary table that aggregates frequently accessed data from the product table.", "correct": false}, {"text": "Create an index on the product table for the most frequently queried fields.", "correct": true}, {"text": "Regularly defragment the product table’s reference tables.", "correct": false}, {"text": "Increase the database server's memory to enhance the product table’s performance.", "correct": false}, {"text": "Split the product table into multiple smaller tables based on product categories.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Implementing a caching strategy for the product table is an effective way to improve read performance, hence option A is correct. Creating an index on the product table for the most frequently queried fields can significantly enhance data retrieval times, making option C also correct. However, option B is incorrect as creating a summary table isn't optimizing the existing structure but rather creating a new one. Increasing the server's memory (option E) won't directly optimize data retrieval for a specific table. Splitting the table (option F) could potentially lead to data integrity issues and complicate the data model. Lastly, regular defragmentation (option D) is a general maintenance task and does not specifically optimize data retrieval for a particular table.\n\nAdd fields to tables through extension - Training | Microsoft Learn Create tables and table fields - Training | Microsoft Learn", "references": [{"title": "Add fields to tables through extension - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/add-field-extension"}, {"title": "Create tables and table fields - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-tables-finance-operations/1-create"}]}]}, {"id": "f419e48f72ac21cefe41179f4a5b4bbb3778383d012f64149f914e903f97814b", "stem": "A packaging company needs to provide real-time stock availability in their third-party SaaS system used by customer service representatives taking orders.\n\nYou need to enable the third-party system to retrieve inventory information from the finance and operations apps in real time.\n\nWhich integration approach should you recommend?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Embed a Power BI report to display inventory levels.", "correct": false}, {"text": "Utilize the Recurring Data Management Integration REST API for inventory checks.", "correct": false}, {"text": "Configure a virtual table to pull inventory data on demand.", "correct": false}, {"text": "Create a custom service in finance and operations apps to calculate physical on-hand inventory.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "A custom service allows for real-time calls and can be tailored to provide specific inventory information, which is needed in this scenario. The Recurring Data Management Integration REST API is for scheduled, not real-time, integrations. Virtual tables are used to access data from external sources in real time but are not suitable for pushing data to third-party systems. Embedding a Power BI report provides visual representation but does not facilitate real-time data retrieval for transactional purposes.\n\nExplore data integration concepts in finance and operations apps - Training | Microsoft Learn Integrate Dynamics 365 apps with other systems - Training | Microsoft Learn", "references": [{"title": "Explore data integration concepts in finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/integration-patterns-finance-operations/4-scenarios"}, {"title": "Integrate Dynamics 365 apps with other systems - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/integrate-other-solutions-guidance-product"}]}]}, {"id": "ec10f32545588cdae36533f1f17ff44f3678fd51faf02004e97a3f6e967f1d87", "stem": "You are working on Microsoft Dynamics 365 finance and operations apps. You have been tasked with developing a new feature that requires the use of object-oriented programming.\n\nYou need to implement a solution that adheres to the principles of inheritance and abstraction, while ensuring optimal performance.\n\nWhat three actions should you perform? Each correct answer presents a complete solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Use global variables to share data between classes.", "correct": false}, {"text": "Use direct database queries instead of the QueryBuilder class for all database operations.", "correct": false}, {"text": "Optimize the code by using the QueryBuilder class for database operations.", "correct": true}, {"text": "Implement all methods in a single class to simplify the code structure.", "correct": false}, {"text": "Create a base class with common properties and methods, and derive other classes from this base class.", "correct": true}, {"text": "Use abstract classes and interfaces to define common methods and properties.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Inheritance and abstraction are key principles of object-oriented programming. Creating a base class and deriving other classes from it, as well as using abstract classes and interfaces, allows for code reuse and abstraction. The QueryBuilder class provides an efficient way to perform database operations. Global variables can lead to data inconsistency and should be avoided. Implementing all methods in a single class does not adhere to the principles of object-oriented programming. Direct database queries are less efficient than using the QueryBuilder class.\n\nIdentify relevant business concepts - Training | Microsoft Learn Events and delegates - Training | Microsoft Learn", "references": [{"title": "Identify relevant business concepts - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/design-deployment-finance-operations/2-business"}, {"title": "Events and delegates - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/dev-ref/xpp-events"}]}]}, {"id": "8b83f285470ec5a28918744a7a11a150fd2103c4fd7725df2401c7689cd448c8", "stem": "You are working on a Microsoft Dynamics 365 finance and operations apps implementation. You need to add string manipulation functionality. Which X++ global functions should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Use the strAdd(), strRemove(), and strChange() global functions.", "correct": false}, {"text": "Use the strInsert(), strDelete(), and strModify() global functions.", "correct": false}, {"text": "Use the strLen(), strFind(), and strReplace() global functions.", "correct": true}, {"text": "Use the strAppend(), strErase(), and strAlter() global functions.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct answer is to use the strLen(), strFind(), and strReplace() global functions for string manipulation in X++. The strAdd(), strRemove(), and strChange() functions, the strInsert(), strDelete(), and strModify() functions, and the strAppend(), strErase(), and strAlter() functions are not valid global functions for string manipulation in X++.\n\nUse X++ runtime functions for common tasks - Training | Microsoft Learn X++ operators - Training | Microsoft Learn", "references": [{"title": "Use X++ runtime functions for common tasks - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/get-started-xpp-finance-operations/8-runtime"}, {"title": "X++ operators - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/dev-ref/xpp-operators"}]}]}, {"id": "d0d322eec98c75a3c7d9d659654f75b8702f701da53977ea8acdb7054f47b345", "stem": "A financial institution uses finance and operations apps and needs to consume real-time currency exchange rates from a third-party service. You need to configure the apps to consume the external service and update rates as they change. What should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Import currency rates using the Data Management Framework REST Package API.", "correct": false}, {"text": "Consume the external web service by adding a service reference in X++.", "correct": true}, {"text": "Embed an IFrame that displays the third-party service's currency rates.", "correct": false}, {"text": "Schedule a recurring integration using the Recurring Data Management Integration REST API.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Adding a service reference in X++ allows the finance and operations apps to consume external web services in real time, which is required for currency rate updates. The Data Management Framework REST Package API is for batched data transfers, not real-time updates. The Recurring Data Management Integration REST API is for scheduled file and package integrations, not for real-time services. An IFrame would only display the rates but would not integrate them into the system for transactional use.\n\nExplore data integration concepts in finance and operations apps - Training | Microsoft Learn Integrate Dynamics 365 apps with other systems - Training | Microsoft Learn", "references": [{"title": "Explore data integration concepts in finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/integration-patterns-finance-operations/4-scenarios"}, {"title": "Integrate Dynamics 365 apps with other systems - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/integrate-other-solutions-guidance-product"}]}]}, {"id": "c85d7c9f4db7c0cea353c481cea419140c8828c28047cbdfae76f84fa488c397", "stem": "Your company has implemented Microsoft Dynamics 365 finance and operations apps and is looking to enhance their customer engagement by leveraging the Microsoft Power Platform.\n\nYou need to design a solution that allows sales representatives to quickly access customer order history and inventory levels while on client sites.\n\nWhat should you recommend?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Advise sales representatives to access the Dynamics 365 desktop application remotely via a VPN connection.", "correct": false}, {"text": "Recommend the use of Microsoft Excel to download and carry offline copies of customer order history and inventory levels.", "correct": false}, {"text": "Suggest setting up email notifications for sales representatives with daily summaries of customer data.", "correct": false}, {"text": "Integrate Power Apps with Dynamics 365 to create a mobile app that provides real-time access to customer order history and inventory data.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct answer is to integrate Power Apps with Dynamics 365 to create a mobile app that provides real-time access to customer order history and inventory data. This solution would offer the necessary real-time data access for sales representatives while on client sites. Accessing the Dynamics 365 desktop application remotely via a VPN, carrying offline copies of data, or setting up email notifications do not provide immediate, real-time access to detailed customer data when needed and can be impractical or inefficient.\n\nMicrosoft Power Platform integration with finance and operations apps - Training | Microsoft Learn Develop and integrate Microsoft Power Platform - Training | Microsoft Learn", "references": [{"title": "Microsoft Power Platform integration with finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/power-platform/overview"}, {"title": "Develop and integrate Microsoft Power Platform - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/integrate-azure-finance-operations/3-power"}]}]}, {"id": "2f15b83dad66fb8a19df1ce988ffc234180edc0b8878f4fa0c5fecfc8d8e8b49", "stem": "You have a Dynamics 365 Finance environment that contains a product table.\n\nYou must integrate the environment with a new line-of-business (LOB) application by using the Data management package REST API.\n\nYou need to identify which integration pattern the API supports.\n\nWhich pattern should you identify?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "asynchronous", "correct": true}, {"text": "batch data API", "correct": false}, {"text": "custom web service", "correct": false}, {"text": "synchronous", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The Data management package REST API in Dynamics 365 Finance and Supply Chain Management is designed for large-volume integrations and supports only asynchronous operations. When you submit a package execution request through the API, the system schedules the data project for processing, and results can be retrieved later by checking the execution status. It is not a synchronous or real-time API, so you cannot get immediate results in the same call. Batch data API and custom web service are not valid integration patterns in this context — the API is a standard out-of-the-box asynchronous integration mechanism.\n\nTechTalk: Integration patterns for Dynamics 365 finance and operations applications - Training | Microsoft Learn Integrate Dynamics 365 apps with other systems - Training | Microsoft Learn Integration between finance and operations apps and third-party services - Training | Microsoft Learn Choose the right pattern for your Dynamics 365 apps integration strategy - Training | Microsoft Learn TechTalk: General guidance for integrating Dynamics 365 apps - Training | Microsoft Learn Best practices for getting the best performance with Dataflow Gen2 - Training | Microsoft Learn", "references": [{"title": "TechTalk: Integration patterns for Dynamics 365 finance and operations applications - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/guidance/techtalks/integrate-finance-operations-overview"}, {"title": "Integrate Dynamics 365 apps with other systems - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/guidance/implementation-guide/integrate-other-solutions-guidance-product"}, {"title": "Integration between finance and operations apps and third-party services - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/data-entities/integration-overview"}, {"title": "Choose the right pattern for your Dynamics 365 apps integration strategy - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/guidance/implementation-guide/integrate-other-solutions-choose-pattern"}, {"title": "TechTalk: General guidance for integrating Dynamics 365 apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/guidance/techtalks/integrate-general-guidance"}, {"title": "Best practices for getting the best performance with Dataflow Gen2 - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-gen2-performance-best-practices"}]}]}, {"id": "3113121e43636a782259894f995801a854bb4d9e47ffbb55e55fc804bd6e131f", "stem": "You are managing data import and export jobs using the Data management workspace.\n\nYou need to speed up the import of data by enabling parallel processing of importing a file.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Configure the parallel import for an entity in the Framework parameters.", "correct": true}, {"text": "Configure the parallel import for an entity in the Data sources setup.", "correct": false}, {"text": "Configure the parallel import for an entity in the Entity settings.", "correct": false}, {"text": "Configure the parallel import for an entity in the Job history cleanup.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The parallel import for an entity should be configured in the Framework parameters to speed up the import of data. The other options are incorrect because they do not provide the necessary configuration for parallel import.\n\nData import and export jobs overview - Training | Microsoft Learn Monitor status and availability of entities - Training | Microsoft Learn", "references": [{"title": "Data import and export jobs overview - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/fin-ops/data-entities/data-import-export-job"}, {"title": "Monitor status and availability of entities - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/data-integrations-finance-operations/monitor-status-entities"}]}]}, {"id": "0998585a36c791c771260bef82b7f76c5ea4a5cf3a92095931b4a31690d1ab8a", "stem": "Your company needs to integrate its Microsoft Dynamics 365 finance and operations apps with multiple external systems.\n\nYou need to ensure that the integration is reliable and the data across systems is consistent.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Use a file-based approach for data transfer without monitoring entity status.", "correct": false}, {"text": "Create a single data project for all integrations to manage them centrally.", "correct": false}, {"text": "Perform full data imports and exports for each integration point daily.", "correct": false}, {"text": "Enable change tracking for entities involved in the integration.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct answer is to enable change tracking for entities involved in the integration. This ensures that only modified data is synchronized, which maintains reliability and consistency across systems. Performing full data imports and exports daily, using a file-based approach without monitoring, or creating a single data project for all integrations are not efficient strategies and could lead to performance issues or complicate management and troubleshooting.\n\nMonitor status and availability of entities - Training | Microsoft Learn Data import and export jobs overview - Training | Microsoft Learn", "references": [{"title": "Monitor status and availability of entities - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/data-integrations-finance-operations/monitor-status-entities"}, {"title": "Data import and export jobs overview - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/fin-ops/data-entities/data-import-export-job"}]}]}, {"id": "cf2057d1a019852ed7b918ed7e3b5b7434bbf40e9c809332fc490b6f42e332d9", "stem": "Your company uses Microsoft Dynamics 365 finance and operations apps. The company has a requirement to restrict access to certain data in shared tables.\n\nYou need to secure data in such a way that users will have access to only the part of the table that is allowed by the enforced policy.\n\nYou need to identify the first step in the workflow for an Extensible Data Security (XDS) policy. What should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Define the context for the rule.", "correct": false}, {"text": "Define the filters or limits that should be placed on the primary table or tables.", "correct": true}, {"text": "Define the list of constrained tables.", "correct": false}, {"text": "Create a security policy that links to the query and primary table for which you want to restrict data access.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The first step in the flow for an XDS policy is to start with a query to define the filters or limits that should be placed on the primary table or tables. The other options are subsequent steps in the process.\n\nSecure finance and operations apps - Training | Microsoft Learn Extensible data security framework - Training | Microsoft Learn", "references": [{"title": "Secure finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/security-strategy-product-oa"}, {"title": "Extensible data security framework - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/role-security-finance-operations/4-xds"}]}]}, {"id": "c841f1765d544c84da3892baa674588f39360e8c53fd0507bbd7c48e4e17097d", "stem": "You have an X++ batch class that processes multiple SalesLine records and calls a discount calculation method for each record.\n\nAn incorrect discount occurs only for sales order SO-1001 when LineAmount is less than zero. The affected record occurs at a different iteration each time the batch runs.\n\nYou need to pause execution at the discount calculation method only when the affected record is processed.\n\nWhich breakpoint configuration should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Set a hit-count breakpoint for a specific iteration.", "correct": false}, {"text": "Set a conditional breakpoint for sales order SO-1001 only.", "correct": false}, {"text": "Set a tracepoint for sales order SO-1001 and a negative LineAmount.", "correct": false}, {"text": "Set a conditional breakpoint for sales order SO-1001 and a negative LineAmount.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Objective:\n\n2.1 Customize finance and operations apps by using Visual Studio\n\nWhat This Item Tests:\n\nPerform debugging activities\n\nAdditional Reading:\n\nDebug X++ code by using the debugger in Visual Studio\n\nRationale:\n\nThe correct answer is to use a conditional breakpoint that checks both the sales order and the negative LineAmount. A conditional breakpoint pauses execution only when the specified condition is satisfied, which isolates the affected record regardless of its position in the iteration. Checking only the sales order can stop execution for unaffected lines in the same sales order, while a hit-count breakpoint is unsuitable because the affected record occurs at a different iteration between runs. A tracepoint can evaluate the same conditions and record information but does not pause execution for debugging.", "references": [{"title": "Debug X++ code by using the debugger in Visual Studio", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/dev-tools/debug-xpp"}]}]}, {"id": "25d2a586d31c0016495c7e86afd52b04b98cb4140f84f58d30465248cb8e435f", "stem": "You have a Dynamics 365 finance and operations development environment. A Task recorder XML file captures a business process, and a Visual Studio X++ test project already exists.\n\nYou need to automate the recorded process in the existing test project. The solution must run from Test Explorer and minimize manually authored page-interaction code.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Import the Task recorder XML to generate an X++ test.", "correct": true}, {"text": "Play back the Task recorder XML in the finance and operations client.", "correct": false}, {"text": "Use Discover Related Tests for the forms used by the recorded process.", "correct": false}, {"text": "Add an X++ unit test and implement the page interactions by using FormAdaptors.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Objective:\n\n4.4 Perform testing\n\nWhat This Item Tests:\n\nCreate unit tests by using the SysTest framework and Task recorder\n\nAdditional Reading:\n\nTest projects in Visual Studio\n\nRationale:\n\nThe correct answer is to import the Task recorder XML to generate an X++ test. Visual Studio can generate test code from a Task Recorder recording by using the SysTest framework and FormAdaptors, which provide strongly typed APIs for page interactions, and the resulting X++ tests can be run from Test Explorer after the project is built. Manually creating an X++ test and calling FormAdaptors requires implementing the recorded interactions in custom code. Task recorder playback replays the recorded process but does not add a generated SysTest test to the project. Discover Related Tests finds existing tests that reference an object rather than generating a new test from a recording.", "references": [{"title": "Test projects in Visual Studio", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/perf-test/testing-support"}]}]}, {"id": "128493bb0b8fe2c1ceb1b33591bdd30e285c7a6d10d31938d750e4c1642bf1ab", "stem": "You have a Dynamics 365 finance and operations development environment.\n\nA module named Module1 contains a model named Model1 and other models.\n\nBest practice warnings in Model1 have been corrected.\n\nYou need to validate the corrections during a nightly build. The solution must meet the following requirements:\n\nRun the checks across the entire Model1 model only.\n\nGenerate XML and text log files.\n\nWhich command should you run?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "xppbp -module:Module1 -all -xmllog=BP.xml -log=BP.txt", "correct": false}, {"text": "xppbp -module:Module1 -model:Model1 -all -xmllog=BP.xml -log=BP.txt", "correct": true}, {"text": "xppbp -module:Module1 -model:Model1 class:* -xmllog=BP.xml -log=BP.txt", "correct": false}, {"text": "xppbp -module:Module1 -model:Model1 form:* -xmllog=BP.xml -log=BP.txt", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Objective:\n\n4.1 Develop X++ code\n\n\n\nWhat This Item Tests:\n\nResolve best practice warnings\n\n\n\nAdditional Reading:\n\nWrite best practice rules\n\n\n\nRationale:\n\nThe correct answer uses -module:Module1 -model:Model1 -all to run best practice checks on all items in Model1 only and uses -xmllog and -log to generate XML and text log files. Omitting -model:Model1 checks all models in Module1, while class:* limits the checks to classes and form:* limits them to forms, so neither checks all element types in Model1. Microsoft documents xppbp.exe as a command-line tool intended mainly for nightly best practice checks and provides these model, element, and logging options.", "references": [{"title": "Write best practice rules", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/dev-tools/author-best-practice-rules"}]}]}, {"id": "a650192df26acdf3260e180f82ed0e5fe04d68e38b9db1e377726ac099a8accb", "stem": "You have an on-premises deployment of Microsoft Dynamics 365 Finance.\n\nYou plan to provide business analysts with Power BI reports that use Finance application data.\n\nYou need to select a supported reporting design while keeping the Finance deployment on-premises.\n\nWhich design should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Use analytical workspaces to surface Power BI reports in Finance.", "correct": false}, {"text": "Use Finance OData endpoints to author Power BI reports in Power BI Desktop.", "correct": false}, {"text": "Use PowerBI.com pinning to display reports, tiles, and dashboards in Finance.", "correct": false}, {"text": "Author Power BI reports from Entity Store and distribute them through PowerBI.com.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Objective:\n\n1.1 Plan for the major components of finance and operations apps\n\nWhat This Item Tests:\n\nDifferentiate between the cloud and on-premises versions of finance and operations apps\n\nAdditional Reading:\n\nPowerBI.com integration with on-premises environments - Finance & Operations | Dynamics 365 | Microsoft Learn Comparison of cloud and on-premises features - Finance & Operations | Dynamics 365 | Microsoft Learn\n\nRationale:\n\nThe correct answer is to author Power BI reports from Entity Store and distribute them through PowerBI.com. On-premises Finance supports Entity Store as a source for application data, and reports that use Entity Store can be distributed through PowerBI.com. Analytical workspaces and pinning PowerBI.com reports, tiles, or dashboards into the Finance client are not implemented for on-premises deployments. Authoring Power BI reports from Finance data by using OData in Power BI Desktop is supported for cloud deployments but not for the on-premises version.", "references": [{"title": "PowerBI.com integration with on-premises environments - Finance & Operations | Dynamics 365 | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/analytics/entity-store-on-prem"}, {"title": "Comparison of cloud and on-premises features - Finance & Operations | Dynamics 365 | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/get-started/cloud-prem-comparison"}]}]}, {"id": "4c4fe1a51c2166857212e94ca5da461ef1d65b91bab4827d507b4a6980540001", "stem": "You have a finance and operations app extension stored in an Azure Repos Git repository named Repo1. A YAML pipeline named Pipeline1 compiles the extension and runs automated tests when manually queued. A release pipeline named Release1 deploys the Pipeline1 artifact to a test environment.\n\nYou need to meet the following requirements:\n\nRun Pipeline1 after every change is merged into the main branch.\n\nKeep Release1 manually initiated.\n\nWhich action should you perform?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Configure a scheduled trigger for main in Pipeline1.", "correct": false}, {"text": "Enable the continuous deployment trigger in Release1.", "correct": false}, {"text": "Configure a build validation branch policy for main in Repo1.", "correct": false}, {"text": "Configure a continuous integration trigger for main in Pipeline1.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Objective:\n\n2.2 Manage source code and artifacts by using Microsoft Azure DevOps version control\n\nWhat This Item Tests:\n\nImplement continuous integration and continuous delivery (CI/CD)\n\nAdditional Reading:\n\nBuild Azure Repos Git repositories - Azure Pipelines | Microsoft Learn\n\nRationale:\n\nThe correct answer is to configure a continuous integration trigger for main in Pipeline1. A CI trigger runs the YAML pipeline when an update is pushed to the specified branch, which runs the build and tests after changes are merged into main without changing Release1. A scheduled trigger runs Pipeline1 at defined times rather than in response to every change. Enabling the continuous deployment trigger in Release1 would automate release creation when a new artifact becomes available, which violates the requirement to keep releases manually initiated. A build validation branch policy validates changes during the pull request process rather than triggering the required build after the changes are merged into main.", "references": [{"title": "Build Azure Repos Git repositories - Azure Pipelines | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git?view=azure-devops&tabs=yaml"}]}]}, {"id": "621846582603e197733770e90497e24c814b4d3c36985de35c7df1a70a89e760", "stem": "You have a Dynamics 365 finance and operations environment that receives data from an external system named System1. The required data entities are available through OData and data management.\n\nSystem1 sends 500,000 records each hour. Real-time processing is not required.\n\nYou need to select an integration API that can process the hourly data volume efficiently.\n\nWhich integration API should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Batch OData API", "correct": false}, {"text": "Custom service", "correct": false}, {"text": "Data management package REST API", "correct": true}, {"text": "OData service", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Objective:\n\n6.1 Evaluate data integration patterns and scenarios\n\nWhat This Item Tests:\n\nSelect an appropriate data integration API\n\nAdditional Reading:\n\nIntegration between finance and operations apps and third-party services\n\nRationale:\n\nThe correct answer is the Data management package REST API because batch data APIs provide asynchronous, batch-based processing for large-volume imports. Microsoft recommends batch data APIs as a rule of thumb when volumes exceed a few hundred thousand records. OData and custom services run business logic immediately and are synchronous integration patterns, making them less appropriate for this high-volume, non-real-time import. The Batch OData API manages finance and operations batch jobs, such as requeuing failed jobs, rather than importing entity data from an external system.", "references": [{"title": "Integration between finance and operations apps and third-party services", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/data-entities/integration-overview"}]}]}, {"id": "cb588fc8e411d02f4f025358d2388dcd834bb4bca0693e0a30c8161f5ff2b661", "stem": "You are developing finance and operations apps in X++. You have created a class and you want to add a method to it.\n\nYou want to add a method that can only be called from methods within the same class and cannot be overridden in a subclass.\n\nYou need to add an accessor keyword to that method.\n\nWhich keyword should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "static", "correct": false}, {"text": "private", "correct": true}, {"text": "public", "correct": false}, {"text": "protected", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Objective:\n\nThe 'private' keyword allows a method to be called only from methods within the same class and cannot be overridden in a subclass. 'public' methods can be called from anywhere the class is accessible and can be overridden by a subclass. 'protected' methods can only be called from methods in the same class or methods in a subclass of that class. 'static' is not an accessor keyword, it is used to declare a method that belongs to a class, not an instance of the class.\n\nCommon type system - Training | Microsoft Learn Add code and methods to meet business requirements - Training | Microsoft Learn", "references": [{"title": "Common type system - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dotnet/standard/base-types/common-type-system"}, {"title": "Add code and methods to meet business requirements - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/create-classes-finance-operations/3-code"}]}]}, {"id": "8ea31f621412895e34a4695d5c0505787203a5a6d92d55eb5ec47d0953d58123", "stem": "You have a Dynamics 365 finance and operations app that contains a SysTest unit test. The test uses the main database connection and a user connection.\n\nYou need to complete the test to meet the following requirements:\n\nRoll back changes from both connections as part of a single test transaction, without explicit cleanup or ttsAbort.\n\nPass only when validateField() rejects a negative CountedQty value.\n\nHow should you complete the test class? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.", "question_code": "[SysTestTransaction([first missing value])]\nclass Test1 extends SysTestCase\n{\n    [SysTestMethod]\n    public void testNegativeQty()\n    {\n        Table1 record1;\n        boolean accepted;\n\n        record1.CountedQty = -2;\n        accepted = record1.validateField(fieldNum(Table1, CountedQty));\n        [second missing value];\n    }\n}", "question_table": null, "variants": [{"options": [{"text": "the first missing value: TestTransactionMode::AutoRollback", "correct": true}, {"text": "the first missing value: TestTransactionMode::LegacyRollback", "correct": false}, {"text": "the first missing value: TestTransactionMode::LegacyRollbackWithUpdateTracking", "correct": false}, {"text": "the first missing value: TestTransactionMode::None", "correct": false}, {"text": "the second missing value: this.assertEquals(-2, record1.CountedQty)", "correct": false}, {"text": "the second missing value: this.assertFalse(accepted)", "correct": true}, {"text": "the second missing value: this.assertTrue(accepted)", "correct": false}], "type": "dropdown", "response_groups": [{"label": "the first missing value", "choices": [{"text": "TestTransactionMode::AutoRollback", "value": "1"}, {"text": "TestTransactionMode::LegacyRollback", "value": "2"}, {"text": "TestTransactionMode::LegacyRollbackWithUpdateTracking", "value": "3"}, {"text": "TestTransactionMode::None", "value": "4"}], "correct_choice": "TestTransactionMode::AutoRollback"}, {"label": "the second missing value", "choices": [{"text": "this.assertEquals(-2, record1.CountedQty)", "value": "1"}, {"text": "this.assertFalse(accepted)", "value": "2"}, {"text": "this.assertTrue(accepted)", "value": "3"}], "correct_choice": "this.assertFalse(accepted)"}], "allow_reuse": false, "explanation": "Objective:\n\n4.4 Perform testing\n\n\n\nWhat This Item Tests:\n\nCreate unit tests by using the SysTest framework and Task recorder\n\n\n\nAdditional Reading:\n\nTesting and validations - Finance & Operations | Dynamics 365 | Microsoft Learn\n\n\n\nRationale:\n\nThe correct configuration uses TestTransactionMode::AutoRollback and this.assertFalse(accepted). AutoRollback uses SQL save points, routes database statements from user connections to the main connection, and persists no data, so changes through both connections are rolled back without explicit cleanup or ttsAbort. LegacyRollback requires each test method to use ttsBegin and ttsAbort, LegacyRollbackWithUpdateTracking reverts tracked database changes during cleanup rather than routing both connections through one transaction, and None provides no isolation. Because validateField() returns false when the negative value is rejected, assertFalse verifies the required behavior; assertTrue expects acceptance, while assertEquals checks the field value rather than the validation result.", "references": [{"title": "Testing and validations - Finance & Operations | Dynamics 365 | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/perf-test/testing-validation"}]}]}, {"id": "1e15bfa4f5095f2f9ea26fc7a5581626ffeae3a3cf400e6ea5487623106fd315", "stem": "You have a Dynamics 365 finance and operations app that contains an X++ class named Class1 in a model named Model1. An extension model named Model2 references Model1. You cannot modify Model1.\n\nThe extension class declaration for Class1 in Model2 is already configured.\n\nYou need to extend Class1 to meet the following requirements:\n\nEach Class1 object must retain its own surcharge amount.\n\nCallers must invoke the calculation method on an existing Class1 object.\n\nHow should you implement the surcharge storage and the calculation method? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Surcharge storage: Instance field", "correct": true}, {"text": "Surcharge storage: Method-local variable", "correct": false}, {"text": "Surcharge storage: Static field", "correct": false}, {"text": "Calculation method: Private instance method", "correct": false}, {"text": "Calculation method: Public instance method", "correct": true}, {"text": "Calculation method: Public static method", "correct": false}], "type": "dropdown", "response_groups": [{"label": "Surcharge storage", "choices": [{"text": "Instance field", "value": "1"}, {"text": "Method-local variable", "value": "2"}, {"text": "Static field", "value": "3"}], "correct_choice": "Instance field"}, {"label": "Calculation method", "choices": [{"text": "Private instance method", "value": "1"}, {"text": "Public instance method", "value": "2"}, {"text": "Public static method", "value": "3"}], "correct_choice": "Public instance method"}], "allow_reuse": false, "explanation": "Objective:\n\n3.3 Create classes and extend AOT elements\n\nWhat This Item Tests:\n\nCreate and extend classes\n\nAdditional Reading:\n\nClass extension model in X++\n\nRationale:\n\nThe correct configuration uses an instance field for the surcharge and a public instance method for the calculation. Instance state pertains to a particular Class1 object, which allows each object to retain its own surcharge amount. A static field applies to the type rather than individual objects, while a method-local variable does not retain object state between method calls. A public instance method added by a class extension is available on the augmented Class1 object. A private instance method is not exposed as a member of the effective class, while a public static method is available on the type rather than on an existing Class1 object.", "references": [{"title": "Class extension model in X++", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/class-extensions"}]}]}, {"id": "d2cc4b51e8664238815b9153d25c38323093144a05c4364c2495cd524afb0c6f", "stem": "You have Dynamics 365 Finance linked to a Microsoft Power Platform environment that includes Dataverse. You also use Dynamics 365 Customer Service.\n\nYou plan to provide a canvas app for product lookup and a customer address process that spans Finance and Customer Service.\n\nYou need to select integration technologies that meet the following requirements:\n\nThe canvas app must query product data in Finance without copying the data to Dataverse.\n\nExisting business logic in Finance and Customer Service must continue to use locally stored customer records, and address changes made in either app must synchronize in near real time.\n\nWhich integration technology should you use for each data flow? To answer, drag the appropriate integration technologies to the correct data flows. Each integration technology may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content.\n\nNOTE: Each correct selection is worth one point.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Product data access: Business events", "correct": false}, {"text": "Product data access: Data events", "correct": false}, {"text": "Product data access: Dual-write", "correct": false}, {"text": "Product data access: Virtual entities", "correct": true}, {"text": "Customer address synchronization: Business events", "correct": false}, {"text": "Customer address synchronization: Data events", "correct": false}, {"text": "Customer address synchronization: Dual-write", "correct": true}, {"text": "Customer address synchronization: Virtual entities", "correct": false}], "type": "ordering", "response_groups": [{"label": "Product data access", "choices": [{"text": "Business events"}, {"text": "Data events"}, {"text": "Dual-write"}, {"text": "Virtual entities"}], "correct_choice": "Virtual entities"}, {"label": "Customer address synchronization", "choices": [{"text": "Business events"}, {"text": "Data events"}, {"text": "Dual-write"}, {"text": "Virtual entities"}], "correct_choice": "Dual-write"}], "allow_reuse": false, "explanation": "Objective:\n\n1.1 Plan for the major components of finance and operations apps\n\nWhat This Item Tests:\n\nExtend the functionality of finance and operations apps into the Microsoft ecosystem\n\nAdditional Reading:\n\nMicrosoft Power Platform integration with finance and operations apps\n\nRationale:\n\nThe correct choices are Virtual entities for product data access and Dual-write for customer address synchronization. Virtual entities allow Power Platform and Dataverse apps to access finance and operations data without copying the data between systems, which enables the canvas app to query product data while Finance remains the data store. Dual-write provides near-real-time synchronization for overlapping records that must reside locally in both finance and operations apps and Dataverse apps, allowing existing business logic in Finance and Customer Service to continue operating against local customer records while address changes remain synchronized. Business events allow Power Platform logic to respond when business processes run but do not provide direct data access or record synchronization, while data events notify external applications of record changes but do not themselves keep locally stored records synchronized.", "references": [{"title": "Microsoft Power Platform integration with finance and operations apps", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/power-platform/overview"}]}]}, {"id": "eb151d25a4ca61c2e6f0cd07ca60a5c9ebd65603803d354818314d9d2fa3f9c9", "stem": "You have an Azure DevOps Releases pipeline named Pipeline1 for a Dynamics 365 finance and operations app.\n\nPipeline1 contains a Dynamics Lifecycle Services Asset Upload task that has the reference name Task1. Task1 uploads a software deployable package to the Lifecycle Services Asset library. The target is a self-service user acceptance testing (UAT) environment named Environment1.\n\nThe Lifecycle Services connection, project ID, Environment1 ID, asset type, and update name are already configured.\n\nYou need to configure the Dynamics Lifecycle Services Asset Deployment task to meet the following requirements:\n\nUse the minimum supported task version for Environment1.\n\nDeploy the
