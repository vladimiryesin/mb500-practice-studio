 maximum number of users.", "correct": false}, {"text": "Perform testing using the Acceptance Test Library (ATL) tool to simulate real-world usage and validate the feature within the application's ecosystem.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "To validate the custom feature's functionality within the context of the entire application and identify potential performance issues, it is recommended to implement unit/component testing using the SysTest framework (Option B). This allows for testing of the feature's performance and logic in isolation. Additionally, performing testing using the Acceptance Test Library (ATL) tool (Option E) helps simulate real-world usage and validate the feature within the application's ecosystem.\n\nOption A is incorrect as it suggests a post-deployment feedback approach rather than a pre-deployment testing strategy. Using the Task recorder to capture the financial calculations and replay them for testing purposes (Option C) is not the correct approach, as Task recorder is used for documentation and training, not for performance testing. Conducting performance testing by measuring the response time of the feature when accessed by the maximum number of users (Option D) describes load testing, not functional or unit testing.\n\nConfigure the testing environment and prepare data - Training | Microsoft Learn Regression suite automation tool (RSAT) - Training | Microsoft Learn", "references": [{"title": "Configure the testing environment and prepare data - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-test-framework-tools-finance-operations/07-configure"}, {"title": "Regression suite automation tool (RSAT) - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/perf-test/rsat/rsat-overview"}]}]}, {"id": "f2cdf4e8cff9a8b95bd5e5ec4afa0c81bf7e33faa30c6c217d7da7a283992107", "stem": "You are automating regression tests using RSAT. Your task involves ensuring that test cases are reliable and maintainable.\n\nYou need to author task recordings for RSAT that will be used across multiple test cases.\n\nYou are trying to determine how to begin each task recording to ensure consistency.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Initiate recordings from the most frequently used module in the application.", "correct": false}, {"text": "Start recordings on a random page to test navigation capabilities.", "correct": false}, {"text": "Begin each recording at the last accessed page from the previous session.", "correct": false}, {"text": "Start all recordings on the main dashboard.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Starting all recordings on the main dashboard is a best practice for authoring task recordings for RSAT, as it ensures a consistent starting point for each test case. Beginning recordings at the last accessed page, starting on a random page, or initiating from the most frequently used module are not recommended practices and can lead to inconsistencies.\n\nPlan the build, test, and quality control processes - Training | Microsoft Learn Regression suite automation tool best practices - Training | Microsoft Learn", "references": [{"title": "Plan the build, test, and quality control processes - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/application-lifecycle-finance-operations/03-plan"}, {"title": "Regression suite automation tool best practices - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/perf-test/rsat/rsat-best-practices"}]}]}, {"id": "b59d7378fb27cfde5806518c4f55b1b09035c27feec6ba3e283ce80f0058ed6e", "stem": "Your company is planning to implement custom services in their finance and operations apps.\n\nYou need to identify the component of the Application platform model that enables the development of custom services.\n\nWhich component should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Workflow and services", "correct": true}, {"text": "Client and Presentation", "correct": false}, {"text": "SSRS reporting", "correct": false}, {"text": "Runtime and Data access", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The 'Workflow and services' component of the Application platform model enables users to develop custom services, making it the correct choice. 'Runtime and Data access' is related to the communication with the kernel, not services. 'Client and Presentation' deals with the user interface, not services. 'SSRS reporting' is used for developing reports, not services.\n\nApplication components and architecture - Training | Microsoft Learn", "references": [{"title": "Application components and architecture - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/training/modules/explore-technical-architecture-finance-operations/application-components-architecture"}]}]}, {"id": "07d154fcb395c1b66aa92b29fc8f4440c508423649e08c74addb10bfc3300da7", "stem": "You have a Dynamics 365 Finance development environment.\n\nYou need to identify which model represents the application stack for the environment.\n\nWhat should you identify?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "ApplicationCommon", "correct": false}, {"text": "ApplicationFoundation", "correct": false}, {"text": "ApplicationPlatform", "correct": false}, {"text": "ApplicationSuite", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "ApplicationSuite is the correct answer because it represents the top layer of the application stack in Dynamics 365 Finance, containing industry-specific and vertical solutions. ApplicationPlatform is the lowest layer, providing base platform functionality. ApplicationFoundation sits above Platform and provides core business concepts. ApplicationCommon is a shared model for common objects but is not formally part of the application stack.\n\nApplication stack and server architecture - Training | Microsoft Learn", "references": [{"title": "Application stack and server architecture - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-tools/application-stack-server-architecture"}]}]}, {"id": "aa9736f3037f7b9e4432c1c5887ed3bf75428d1d615da9244b77aa5e4c7a403c", "stem": "Recently, your company has been experiencing issues with their application's performance.\n\nYou need to identify the root cause of the performance issues with minimal impact on the production environment.\n\nWhich tool should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Issue Search within Lifecycle Services", "correct": false}, {"text": "Asset Library within Lifecycle Services", "correct": false}, {"text": "Environment Monitoring Tool within Lifecycle Services", "correct": true}, {"text": "Deployment packages within Lifecycle Services", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The Environment Monitoring Tool within Lifecycle Services is designed to monitor and diagnose performance issues in Dynamics 365 applications. Asset Library is used for managing assets and not for diagnosing performance issues. Issue Search is used for researching and resolving issues but not specifically for performance monitoring. Deployment packages are used for deploying changes between environments and not for performance monitoring.\n\nPerform support tasks - Training | Microsoft Learn Best practices for ALM in Dynamics 365 applications - Training | Microsoft Learn", "references": [{"title": "Perform support tasks - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/training/modules/manage-lifecycle-services-finance-operations/02-support"}, {"title": "Best practices for ALM in Dynamics 365 applications - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/guidance/implementation-guide/application-lifecycle-management-product"}]}]}, {"id": "8c134af2fb23b13c49018071ac9e5a23b9c907e27c91a564cbdbeb85e58cf07f", "stem": "Your company has multiple environments for development, testing, and production.\n\nYou need to implement an Application Lifecycle Management (ALM) strategy that allows for controlled promotion of changes across these environments with minimal downtime.\n\nWhat should you do? Each correct answer presents a complete solution. Choose two.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Deploy changes directly to the production environment to speed up the update process.", "correct": false}, {"text": "Create deployment packages in LCS to group and deploy customizations across environments.", "correct": true}, {"text": "Rely solely on the built-in version control of the development environment for tracking changes.", "correct": false}, {"text": "Manually copy customizations from one environment to another using file transfer.", "correct": false}, {"text": "Use the Environment Monitoring Tool within LCS to monitor the performance and usage of each environment.", "correct": false}, {"text": "Utilize Microsoft Dynamics Lifecycle Services (LCS) to manage the application lifecycle and track customizations.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct actions to implement an Application Lifecycle Management (ALM) strategy are to create deployment packages in LCS to group and deploy customizations across environments, use the Environment Monitoring Tool within LCS to monitor the performance and usage of each environment, and utilize Microsoft Dynamics Lifecycle Services (LCS) to manage the application lifecycle and track customizations. These actions allow for controlled promotion of changes, systematic deployment, and crucial health and performance monitoring of environments. Deploying changes directly to the production environment, manually copying customizations using file transfers, or relying solely on the built-in version control of the development environment do not provide the necessary control, tracking, or comprehensive ALM capabilities.\n\nOverview of Lifecycle Services - Training | Microsoft Learn Checklist for application lifecycle management - Training | Microsoft Learn", "references": [{"title": "Overview of Lifecycle Services - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-technical-architecture-finance-operations/6-lcs"}, {"title": "Checklist for application lifecycle management - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/application-lifecycle-management-checklist"}]}]}, {"id": "8df4a42d15e15ec517068607d3f6f795e534b264e1cb9e41a001ea870f1080f0", "stem": "As an administrator of a Microsoft Dynamics 365 finance and operations apps implementation, you are tasked with maintaining the security of sensitive data.\n\nYou need to restrict access to financial reports to authorized users only.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Configure security roles and assign them to authorized users", "correct": true}, {"text": "Create a shared user account for report access", "correct": false}, {"text": "Encrypt financial reports with a single-use password", "correct": false}, {"text": "Implement field-level security on financial data fields", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Configuring security roles and assigning them to authorized users is the best practice for controlling access to sensitive information such as financial reports. Field-level security is more granular and does not directly control report access. Shared user accounts and single-use passwords are not secure methods for managing access to sensitive data.\n\nExtend Dynamics 365 finance and operations apps - Training | Microsoft Learn Finance and operations apps and associated apps - Training | Microsoft Learn", "references": [{"title": "Extend Dynamics 365 finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/extend-your-solution-guidance-product-fo"}, {"title": "Finance and operations apps and associated apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-ecosystem-main-components-finance-operations/1-apps"}]}]}, {"id": "b5afbddffbbee9885ca72c538e4c92d1041ba1ca05d42a4748f4624d1a4a80a5", "stem": "At your company, the finance and operations apps are experiencing slow performance during peak business hours, which is impacting user productivity.\n\nYou need to ensure consistent availability and performance for your solution without overusing resources.\n\nWhich two features should you configure first? Each correct answer presents a complete solution. Choose two.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Increase the number of batch threads beyond recommended limits", "correct": false}, {"text": "Turn on change tracking for all data entities", "correct": false}, {"text": "Priority-based throttling introducing service protection settings", "correct": true}, {"text": "Optimization advisor workspace", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Priority-based throttling introducing service protection settings helps prevent overuse of resources and ensures consistent availability and performance, which is suitable for the given scenario. The Optimization advisor workspace is used for identifying business processes that need improvement but does not directly control resource usage. Turning on change tracking for all data entities can actually slow down the system, and increasing the number of batch threads beyond recommended limits can lead to system instability.\n\nProduct-specific guidance for optimizing performance - Training | Microsoft Learn Query optimization principles - Training | Microsoft Learn", "references": [{"title": "Product-specific guidance for optimizing performance - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/performing-solution-product-specific-guidance"}, {"title": "Query optimization principles - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/apply-basic-performance-optimization-finance-operations/5-queries"}]}]}, {"id": "6d8f9f2128d51b18e693df7e3cb1deb00745c4976f8cae5cfaaac753eb43609f", "stem": "Your company has been experiencing performance issues with its Tier-1 environment during data migration processes, which involve large datasets.\n\nYou need to optimize the data migration process to handle large volumes of data more efficiently and reduce the overall migration time.\n\nWhat should you do? Each correct answer presents a complete solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Enable set-based processing on the Data entity page to allow bulk operations to the database.", "correct": true}, {"text": "Increase the number of batch threads beyond 16 without conducting full performance testing.", "correct": false}, {"text": "Turn off change tracking to improve performance during the data migration process.", "correct": true}, {"text": "Create a data migration batch group to run jobs when system activity is low.", "correct": true}, {"text": "Use OData for importing and exporting large datasets.", "correct": false}, {"text": "Implement continuous number sequences with preallocation for all data entities.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Turning off change tracking helps improve performance during data migrations as it is not needed for full data imports and slows down the process. Enabling set-based processing allows for bulk operations instead of single record operations, which is more efficient for large datasets. Creating a data migration batch group ensures that migration jobs run during periods of low system activity, reducing the risk of performance bottlenecks. Increasing the number of batch threads beyond 16 without performance testing may negatively impact system performance and is not recommended. Using OData for large dataset migration is not advised due to its limitations in handling large volumes. Continuous number sequences with preallocation can cause locking issues and are not related to data migration performance.\n\nQuery optimization principles - Training | Microsoft Learn Product-specific guidance for optimizing performance - Training | Microsoft Learn", "references": [{"title": "Query optimization principles - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/apply-basic-performance-optimization-finance-operations/5-queries"}, {"title": "Product-specific guidance for optimizing performance - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/performing-solution-product-specific-guidance"}]}]}, {"id": "9fb1b6472645a93ffa321dabbc515fcf6e3af7c25acf95313b1939a1fddbb994", "stem": "You are responsible for optimizing the performance of the finance and operations apps.\n\nYou need to reduce the number of queries and fetched records to improve performance.\n\nWhat approach should you use to achieve this goal?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Use the FILTER function instead of the WHERE function", "correct": true}, {"text": "Use a single-threaded approach for all data retrievals", "correct": false}, {"text": "Manually optimize SQL queries in the report designer", "correct": false}, {"text": "Increase the timeout settings for the database connections", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Using the FILTER function instead of the WHERE function reduces the number of fetched records by processing data on the SQL Server side. Increasing timeout settings does not address the root cause of slow queries. A single-threaded approach could lead to bottlenecks, and manually optimizing SQL queries in the report designer is not a scalable or maintainable solution.\n\nTroubleshooting performance issues in ER configurations - Training | Microsoft Learn Diagnose performance issues by using Trace parser - Training | Microsoft Learn", "references": [{"title": "Troubleshooting performance issues in ER configurations - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/analytics/er-troubleshoot-perf-issues-in-configurations"}, {"title": "Diagnose performance issues by using Trace parser - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/performance-monitoring-finance-operations/2-trace-parser"}]}]}, {"id": "c7e94daa7118f0b164c8cb111fb7040be6745ffd849102efd7febaab8eea8106", "stem": "You are optimizing the performance of Microsoft Dynamics 365 finance and operations apps. Users have reported slow response times when interacting with certain forms within the application.\n\nYou need to diagnose potential issues and optimize the client performance using available tools without affecting the current live environment.\n\nWhat should you do? Each correct answer presents a complete solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Increase the server's memory allocation to improve form response times.", "correct": false}, {"text": "Manually inspect the form's code line by line to find inefficient loops or queries.", "correct": false}, {"text": "Record a scenario using Chrome Developer tools' Performance tab to analyze time spent loading, scripting, and rendering the page.", "correct": true}, {"text": "Advise users to clear their browser cache to improve the form's performance.", "correct": false}, {"text": "Use Fiddler to capture and analyze the network traffic generated by the form to identify any bottlenecks.", "correct": true}, {"text": "Set the form as a startup object and preview it in a browser window to test its performance.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Option Fis correct because testing the form's performance in a controlled environment can help identify issues without impacting live operations. Option E is correct as Fiddler can diagnose authentication and network-related issues that may affect form performance. Option C is correct because Chrome Developer tools can provide detailed insights into client-side performance issues. Option A is incorrect because increasing server memory does not directly address client-side performance issues. Option B is incorrect as it is not an efficient method for diagnosing performance issues and does not utilize the tools mentioned in the training content. Option D is incorrect because clearing browser cache is a general troubleshooting step and does not specifically diagnose or optimize performance issues.\n\nDiagnose and optimize client performance - Training | Microsoft Learn Diagnose issues and analyze performance by using Trace parser - Training | Microsoft Learn", "references": [{"title": "Diagnose and optimize client performance - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-forms-optimize-finance-operations/7-optimize"}, {"title": "Diagnose issues and analyze performance by using Trace parser - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/perf-test/trace-parser"}]}]}, {"id": "bd7c9e59917f139e4ef34ff5b32256072eff51e9b48d7c78094e9f40ae32efd2", "stem": "You are integrating data from an external system into your Microsoft Dynamics 365 finance and operations apps. The external system provides data in CSV, XML, and tab-delimited formats.\n\nYou need to import this data with high volume and the ability to do high-volume file parsing, transformation, and some validations.\n\nWhat two integration patterns should you use? Each correct answer presents a complete solution. Choose two.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Excel integration", "correct": false}, {"text": "OData", "correct": false}, {"text": "Batch data API", "correct": true}, {"text": "Data management", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Batch data API and Data management are the correct choices because they support data import scenarios with high throughput and provide intermediary storage for high-volume file parsing, transformation, and some validations. OData is incorrect because it is used for creating and consuming data using RESTful web services but does not specifically support high throughput data import. Excel integration is incorrect because it is used for changing and analyzing data within Excel, not for high throughput data import.\n\nData management and integration by using data entities overview - Training | Microsoft Learn", "references": [{"title": "Data management and integration by using data entities overview - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/data-entities/data-management-integration-data-entity"}]}]}, {"id": "83d92645ff9eabf87417b540389132c0d2b998b24b6e78cb67170c6a71613f19", "stem": "You are optimizing data entity design for performance.\n\nYou need to ensure that the data entity design promotes performance and easy maintenance.\n\nHow should you design your data entities?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Expose all underlying tables directly to maximize transparency.", "correct": false}, {"text": "Encapsulate the underlying tables and provide a single consumable contract.", "correct": true}, {"text": "Avoid encapsulation to reduce the complexity of the data model.", "correct": false}, {"text": "Create separate data entities for each table to simplify the design.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct answer is to encapsulate the underlying tables and provide a single consumable contract. This approach promotes improved performance and easier maintenance. Exposing all tables directly, creating separate entities for each table, or avoiding encapsulation can lead to performance issues, increase complexity, and complicate maintenance.\n\nIntegration architecture design - Training | Microsoft Learn Optimize data entities to achieve better performance - Training | Microsoft Learn", "references": [{"title": "Integration architecture design - Training | Microsoft Learn", "url": "https://learn.microsoft.com/azure/architecture/integration/integration-start-here"}, {"title": "Optimize data entities to achieve better performance - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/external-data-sources-finance-operations/4-performance"}]}]}, {"id": "218f4db0f2f2e6b0e90f723b40c98b76e1d3874a4c44d14947455d3ea17ae67a", "stem": "You are optimizing the data import and export process.\n\nYou need to select the correct data format for the job to ensure successful data transfer.\n\nWhich combination of settings should you define?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Use a specific code page instead of Unicode to import or export data.", "correct": false}, {"text": "Choose XML-Element as the XML Style for the delimited file format.", "correct": false}, {"text": "Select Excel as the Row/Column delimiter for the delimited file format.", "correct": false}, {"text": "Set the Row delimiter and Column delimiter appropriately for the delimited file format.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "For a delimited file format, it is important to set the Row delimiter and Column delimiter appropriately. Choosing XML-Element as the XML Style, selecting Excel as the delimiter, or using a specific code page instead of Unicode are incorrect for a delimited file format.\n\nData import and export jobs overview - Training | Microsoft Learn Monitor status and availability of entities - Training | Microsoft Learn", "references": [{"title": "Data import and export jobs overview - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/fin-ops/data-entities/data-import-export-job"}, {"title": "Monitor status and availability of entities - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/data-integrations-finance-operations/monitor-status-entities"}]}]}, {"id": "d1d7cb14816177c24af340c2fa7ea0b840f68ab56848595cde2d1a2254c3a76c", "stem": "You are integrating finance and operations apps with Microsoft Power Platform to enhance business processes.\n\nYou need to ensure that sales representatives can update customer credit limits without accessing the finance and operations apps directly.\n\nWhich integration approach should you implement?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Dual-write", "correct": true}, {"text": "Business events", "correct": false}, {"text": "Virtual entities", "correct": false}, {"text": "Power Automate connectors", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Dual-write is the correct choice because it enables near-real-time synchronous copying of data between Dynamics 365 Sales and finance and operations apps, which is necessary for updating customer credit limits. Power Automate connectors are used for automating workflows, not for direct data synchronization. Virtual entities are used for data access without copying, not for data updates. Business events are for responding to application business logic events, not for data synchronization.\n\nMicrosoft Power Platform integration with finance and operations apps - Training | Microsoft Learn Develop and integrate Microsoft Power Platform - Training | Microsoft Learn", "references": [{"title": "Microsoft Power Platform integration with finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/power-platform/overview"}, {"title": "Develop and integrate Microsoft Power Platform - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/integrate-azure-finance-operations/3-power"}]}]}, {"id": "cf90ed587c23eee48cd85a9f4177d89be23e4c50c31a9032a87b3b7c4007691c", "stem": "You are setting up a new Azure DevOps project for the Fleet Management model in Microsoft Dynamics 365 finance and operations apps. The project will host the source code and track changes made by various developers.\n\nYou need to ensure that the project is configured correctly for source control using Team Foundation Version Control (TFVC) as the default option.\n\nWhat should you do? Each correct answer presents part of the solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Configure Visual Studio to use a third-party version control system and map the Metadata folder to an external repository.", "correct": false}, {"text": "Use the automated code upgrade tool in Microsoft Dynamics Lifecycle Services to create the Azure DevOps project and bypass manual setup.", "correct": false}, {"text": "Create a local Git repository on your development machine and manually synchronize changes with the Azure DevOps project.", "correct": false}, {"text": "Check in the Fleet Management model descriptor file to Azure DevOps source control after adding the solution and its model elements.", "correct": true}, {"text": "Sign up for Azure DevOps, create an organization, select a URL, and configure Visual Studio to connect to the Azure DevOps team project.", "correct": true}, {"text": "Create a new project in Azure DevOps, map the Metadata folder to the model store root folder, and add the Fleet Management solution to source control.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Option D is correct as it instructs to check-in the Fleet Management model descriptor file to Azure DevOps source control after adding the solution and its model elements, which is crucial for setting up the project. Option E is also correct as it details the initial steps needed to set up Azure DevOps for source control, including signing up, creating an organization, selecting a URL, and configuring Visual Studio. Option F is correct because it outlines the steps to create a new project in Azure DevOps, map the Metadata folder to the model store root folder, and add the Fleet Management solution to source control. Option A is incorrect as it suggests using a third-party version control system, which is not the requirement here. Option B is incorrect as it proposes to bypass manual setup using an automated tool, which might not ensure proper setup. Option C is incorrect as it suggests creating a local Git repository, which is not the default option as per the question.\n\nSource control processes - Training | Microsoft Learn Version control, metadata search, and navigation - Training | Microsoft Learn", "references": [{"title": "Source control processes - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-technical-architecture-finance-operations/4-source-control"}, {"title": "Version control, metadata search, and navigation - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/dev-tools/version-control-metadata-navigation"}]}, {"options": [{"text": "Configure Visual Studio to use a third-party version control system and map the Metadata folder to an external repository.", "correct": false}, {"text": "Use the automated code upgrade tool in Power Platform admin center (PPAC) to create the Azure DevOps project and bypass manual setup.", "correct": false}, {"text": "Create a local Git repository on your development machine and manually synchronize changes with the Azure DevOps project.", "correct": false}, {"text": "Check in the Fleet Management model descriptor file to Azure DevOps source control after adding the solution and its model elements.", "correct": true}, {"text": "Sign up for Azure DevOps, create an organization, select a URL, and configure Visual Studio to connect to the Azure DevOps team project.", "correct": true}, {"text": "Create a new project in Azure DevOps, map the Metadata folder to the model store root folder, and add the Fleet Management solution to source control.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Option D is correct as it instructs to check-in the Fleet Management model descriptor file to Azure DevOps source control after adding the solution and its model elements, which is crucial for setting up the project. Option E is also correct as it details the initial steps needed to set up Azure DevOps for source control, including signing up, creating an organization, selecting a URL, and configuring Visual Studio. Option F is correct because it outlines the steps to create a new project in Azure DevOps, map the Metadata folder to the model store root folder, and add the Fleet Management solution to source control. Option A is incorrect as it suggests using a third-party version control system, which is not the requirement here. Option B is incorrect as it proposes to bypass manual setup using an automated tool, which might not ensure proper setup. Option C is incorrect as it suggests creating a local Git repository, which is not the default option as per the question.\n\nSource control processes - Training | Microsoft Learn Version control, metadata search, and navigation - Training | Microsoft Learn", "references": [{"title": "Source control processes - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-technical-architecture-finance-operations/4-source-control"}, {"title": "Version control, metadata search, and navigation - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/dev-tools/version-control-metadata-navigation"}]}]}, {"id": "506e6a1762522244da884666788e0befe60093c011d0446f671b8bb3d6406b0f", "stem": "You are tasked with managing source code and artifacts using Azure DevOps version control.\n\nYou need to ensure that the latest changes from other developers are included in your local version before making further modifications.\n\nWhat action should you perform?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Check out the code for editing to force an update to the latest version.", "correct": false}, {"text": "Use the 'Get Latest Version' option in Source Control Explorer to fetch the most recent changes.", "correct": true}, {"text": "Perform a force push to overwrite the local changes with the server version.", "correct": false}, {"text": "Create a new workspace to download the latest version of the code.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Option B is correct because using the 'Get Latest Version' option in Source Control Explorer is the standard method to synchronize the local codebase with the latest changes from the server. Option A is incorrect as checking out the code does not guarantee an update to the latest version. Option D is incorrect because creating a new workspace is unnecessary and does not address the need to update the existing local codebase. Option C is incorrect as performing a force push would overwrite the server version with local changes, rather than updating the local version.\n\nSet up Azure DevOps code sharing and create a build pipeline - Training | Microsoft Learn Working in Visual Studio - Training | Microsoft Learn", "references": [{"title": "Set up Azure DevOps code sharing and create a build pipeline - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/commerce/e-commerce-extensibility/set-up-code-sharing-build-pipeline"}, {"title": "Working in Visual Studio - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/manage-source-code-version-control-finance-operations/03-visual-studio"}]}]}, {"id": "0bac5946ca5e55c90778f238c879b4d9b0eab5e75eee1faa9a98361759e8c1b5", "stem": "You are using Azure DevOps for source control in your finance and operations apps development project.\n\nYou need to deploy a package to a nonproduction environment.\n\nWhat three steps should you perform? Each correct answer presents part of the solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Manually copy the package to the nonproduction environment.", "correct": false}, {"text": "Create a new Azure DevOps project and add the package to it.", "correct": false}, {"text": "Select Maintain > Apply updates.", "correct": true}, {"text": "Open the Environment details view for the desired environment.", "correct": true}, {"text": "Use the filter to select the package to apply and then click Apply.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct steps to deploy a package to a nonproduction environment are to open the Environment details view for the desired environment, select Maintain &gt; Apply updates, and use the filter to select the package to apply and then click Apply. Creating a new Azure DevOps project and adding the package to it or manually copying the package to the nonproduction environment are not the correct methods to deploy a package to a nonproduction environment.\n\nVersion control, metadata search, and navigation - Training | Microsoft Learn\nSource Control Processes - Training | Microsoft Learn", "references": [{"title": "Version control, metadata search, and navigation - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/dev-tools/version-control-metadata-navigation"}, {"title": "Source Control Processes - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-technical-architecture-finance-operations/4-source-control"}]}]}, {"id": "021281a97519da9c66a41adae4f1de0a136d6b0258d3bc6724bebd917088f918", "stem": "You are working on a Microsoft Dynamics 365 finance and operations application. You need to implement functionality that allows the application to perform create, read, update, delete (CRUD) operations on the data.\n\nYou need to identify the appropriate X++ code that will allow the application to perform these operations with the least amount of coding effort.\n\nWhich X++ code should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Use the get(), set(), and remove() methods for CRUD operations.", "correct": false}, {"text": "Use the insert(), update(), and delete() methods for CRUD operations.", "correct": true}, {"text": "Use the add(), modify(), and remove() methods for CRUD operations.", "correct": false}, {"text": "Use the select(), insert(), and delete() methods for CRUD operations.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct answer is to use the insert(), update(), and delete() methods for CRUD operations in X++. The select() method is not used for CRUD operations. The get(), set(), and remove() methods, and the add(), modify(), and remove() methods are not valid methods for CRUD operations in X++.\n\nUse X++ runtime functions for common tasks - Training | Microsoft Learn\nX++ operators - Training | Microsoft Learn", "references": [{"title": "Use X++ runtime functions for common tasks - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/get-started-xpp-finance-operations/8-runtime"}, {"title": "X++ operators - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/dev-ref/xpp-operators"}]}]}, {"id": "af7dc3901c3af1420b5b4ce1284618033e559b75e865c0b8abc14fb38354f12e", "stem": "You have a custom X++ job that loops through CustTable records and sets a custom field named MySalesRegionId. The job selects records with update intent and updates thousands of customers in one run.\n\nCurrently, the code changes buffer fields inside the loop but does NOT persist the changes to the database.\n\nYou need to ensure that each modified CustTable record is saved correctly.\n\nWhich X++ statement should you add inside the loop after setting MySalesRegionId?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "custTable.delete();", "correct": false}, {"text": "custTable.doUpdate();", "correct": false}, {"text": "custTable.insert();", "correct": false}, {"text": "custTable.update();", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Objective:\n\n4.1 Develop X++ code\n\nWhat This Item Tests:\n\nCreate, read, update, and delete (CRUD) data\n\nAdditional Reading:\n\nInspect variables and return values in the Visual Studio debugger\n\nRationale:\n\nCalling update() persists the modified buffer to the database, while executing standard validation and business logic, which is the correct approach when updating existing records selected with update intent. doUpdate() bypasses validation and should be used only in special scenarios. insert() creates new records rather than updating existing ones, and delete() removes records instead of persisting changes.", "references": [{"title": "Inspect variables and return values in the Visual Studio debugger", "url": "https://learn.microsoft.com/en-us/visualstudio/debugger/autos-and-locals-windows?view=visualstudio"}]}]}, {"id": "56807716ab764549cef4e049b8b966e3146be6223d691b8e1a96e186414457d1", "stem": "You are developing a Dynamics 365 finance and operations apps extension that includes an X++ class named SalesOrderCleanup.\n\nDuring best practice validation, Microsoft Visual Studio reports a warning indicating that a SalesTable record is being updated without being selected for update inside a transaction.\n\nThe code includes logic that updates SalesTable records and commits the changes by using ttscommit.\n\nYou need to resolve the best practice warning, while ensuring data consistency and correct transactional behavior.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Add a forUpdate clause when selecting the SalesTable record before updating the record.", "correct": true}, {"text": "Disable best practice validation for the project.", "correct": false}, {"text": "Replace the update logic with update_recordset outside of a ttsbegin / ttscommit block.", "correct": false}, {"text": "Suppress the warning by adding a BP suppression attribute to the class.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Objective:\n\n4.1 Develop X++ code\n\nWhat This Item Tests:\n\nResolve best practice warnings\n\nAdditional Reading:\n\nInspect variables and return values in the Visual Studio debugger\n\nUse the right type of breakpoint\n\nRationale:\n\nSelecting a record by using the forUpdate keyword before modifying the record ensures that the record is properly locked, and the update occurs within a valid transactional scope, which resolves the best practice warning and prevents concurrency issues. Disabling best practice validation or suppressing the warning does not address the underlying data integrity risk. Performing updates outside of a transaction violates transactional best practices and can introduce inconsistent data states.", "references": [{"title": "Inspect variables and return values in the Visual Studio debugger", "url": "https://learn.microsoft.com/en-us/visualstudio/debugger/autos-and-locals-windows?view=visualstudio"}, {"title": "Use the right type of breakpoint", "url": "https://learn.microsoft.com/en-us/visualstudio/debugger/using-breakpoints?view=visualstudio&pivots=programming-language-dotnet"}]}]}, {"id": "e27add478716874881170e476f91b4776f40174b40630d49999e013cac4ea6c0", "stem": "You are enhancing a Microsoft Dynamics 365 finance and operations apps implementation by adding new attributes to certain entities without modifying the existing codebase.\n\nYou need to extend the functionality of these entities in a way that is upgrade-safe and adheres to best practices.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Implement attribute classes to add metadata to the entity classes.", "correct": true}, {"text": "Use SQL triggers to add attributes to the database tables associated with the entities.", "correct": false}, {"text": "Create new entity classes that duplicate the existing ones with additional attributes.", "correct": false}, {"text": "Directly modify the entity classes to include the new attributes.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Option A is correct because attribute classes allow you to add metadata to entities without modifying the existing code, which is upgrade-safe. Option B is incorrect as it involves modifying the base code, which is not recommended. Option C is incorrect because it leads to code duplication and maintenance issues. Option D is incorrect as SQL triggers are not a part of X++ development and do not align with best practices for extending entities.\n\nImplement Chain of Command - Training | Microsoft Learn Class extension - Method wrapping and Chain of Command - Training | Microsoft Learn", "references": [{"title": "Implement Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/develop-object-oriented-code-finance-operations/4-chain-command"}, {"title": "Class extension - Method wrapping and Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/method-wrapping-coc"}]}]}, {"id": "0a190c2b48062edc885dec1cc8e637e092a8ded427a883f3de3bdb9123baba9a", "stem": "You are working on the company's Dynamics 365 finance and operations apps implementation. You need to extend the functionality of a base class method without modifying the base code.\n\nYou need to implement a solution that allows you to add custom logic before and after the base method execution.\n\nWhich approach should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Implement Chain of Command (CoC) in an extension class", "correct": true}, {"text": "Use event handlers only", "correct": false}, {"text": "Create a new class with the same method", "correct": false}, {"text": "Modify the base class method directly", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Chain of Command (CoC) allows you to wrap X++ code around methods that are defined in the base class. This allows you to add custom logic that will run before and/or after the standard code runs. Modifying the base class method directly is not recommended as it can lead to issues during updates. Creating a new class with the same method does not extend the base class functionality. Using event handlers only does not allow adding custom logic before and after the base method execution.\n\nClass extension - Method wrapping and Chain of Command - Training | Microsoft Learn Implement Chain of Command - Training | Microsoft Learn", "references": [{"title": "Class extension - Method wrapping and Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/method-wrapping-coc"}, {"title": "Implement Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/develop-object-oriented-code-finance-operations/4-chain-command"}]}]}, {"id": "ff30ff5d49c75214f89758b7d8554cb551c8787cd2f5ec70898f8e7de2e06f8c", "stem": "You are working on a Dynamics 365 application. You have extended a base class method using Chain of Command (CoC).\n\nYou need to ensure that the next method in the chain and the original implementation are always called.\n\nYou need to determine which keyword to use in your extension method.\n\nWhich should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "next", "correct": true}, {"text": "base", "correct": false}, {"text": "this", "correct": false}, {"text": "super", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The 'next' keyword is used in a CoC extension method to invoke the next method in the chain, ensuring that the original implementation is always called. 'super', 'base', and 'this' keywords are not used for this purpose in CoC.\n\nClass extension - Method wrapping and Chain of Command - Training | Microsoft Learn Implement Chain of Command - Training | Microsoft Learn", "references": [{"title": "Class extension - Method wrapping and Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/method-wrapping-coc"}, {"title": "Implement Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/develop-object-oriented-code-finance-operations/4-chain-command"}]}]}, {"id": "aa735899b7c49bd621992800c408239223d0ec856b302e2cce25fd1633efed9c", "stem": "You are responsible for implementing a robust numbering system for master data records and transaction records within the finance and operations apps.\n\nYou need to configure the numbering system for an individual legal entity, shared legal entities, or an operating unit, and include the fiscal calendar period.\n\nWhich component should you configure to achieve this goal?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Application platform", "correct": false}, {"text": "Source document framework", "correct": false}, {"text": "Global address book", "correct": false}, {"text": "Number sequence", "correct": true}, {"text": "Organization structure", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The Number sequence component is used to generate readable, unique identifiers for master data and transaction records, which can be regulated based on the legal entity or operating unit and fiscal calendar period, making it the correct answer. The Global address book is for contact information storage, the Organization structure pertains to the setup of internal organizations, the Application platform is the core model for functionality implementation, and the Source document framework is for recording business events, none of which are directly related to the generation of unique identifiers.\n\nApplication components and architecture - Training | Microsoft Learn", "references": [{"title": "Application components and architecture - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-technical-architecture-finance-operations/application-components-architecture"}]}]}, {"id": "47115d5f6b7d90345a6e5f9f24dda3d362d1f2ac28802a0aa347bdcbd1736ffc", "stem": "You are developing a custom module for finance and operations apps that requires adding several new fields to an existing table without modifying the original table structure.\n\nYou need to ensure that the new fields are added following best practices and that CRUD (create, read, update, delete) operations are automated for the custom table.\n\nWhat should you do? Each correct answer presents part of the solution. Choose two.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create a new table with the additional fields and establish a foreign key relation to the standard table.", "correct": true}, {"text": "Directly add new fields to the standard table by modifying its structure.", "correct": false}, {"text": "Use the SysOperation framework to handle the CRUD operations for the new fields.", "correct": false}, {"text": "Utilize the SysExtensionSerializer framework to automate CRUD operations on the new table.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Creating a new table with additional fields and establishing a foreign key relation to the standard table is a best practice when more than 10 fields are added, as it avoids modifying the original table structure. Utilizing the SysExtensionSerializer framework allows for automated CRUD operations on the new table, aligning with best practices. Directly modifying the standard table structure is not recommended as it goes against best practices. The SysOperation framework is not used for CRUD operations on table fields but rather for batch processing and interactive operations.\n\nFinance and operations apps frameworks - Training | Microsoft Learn", "references": [{"title": "Finance and operations apps frameworks - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/design-deployment-finance-operations/8-frameworks"}]}]}, {"id": "1712994ca1b34fb54552f72f13f6ba41e7cca2a8b8b253c183364f1eb192d4d2", "stem": "You are tasked with ensuring that the Regression suite automation tool (RSAT) is properly configured for a non-administrator user to execute test cases.\n\nYou need to configure RSAT to allow the non-administrator user to perform test executions without compromising system security.\n\nWhat should you do? Each correct answer presents part of the solution. Choose two.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Disable all security roles for the non-administrator user to prevent unauthorized access during RSAT execution.", "correct": false}, {"text": "Configure RSAT to use User-Based authentication for the non-administrator user.", "correct": true}, {"text": "Instruct the non-administrator user to execute RSAT test cases manually without using the tool.", "correct": false}, {"text": "Grant the non-administrator user full administrative privileges temporarily during RSAT execution.", "correct": false}, {"text": "Assign the non-administrator user to a security role with the necessary permissions for RSAT execution.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Configuring RSAT to use User-Based authentication for the non-administrator user (Option B) is a correct approach, as it ensures secure and appropriate user authentication for test executions. Also, assigning the non-administrator user to a security role with the necessary permissions for RSAT execution (Option E) allows them to execute RSAT test cases without requiring full administrative privileges, making it another correct choice.\n\nOption A is incorrect, as disabling all security roles would restrict the non-administrator user from performing any actions in the system, including executing test cases. Instructing the non-administrator user to execute RSAT test cases manually without using the tool (Option C) is incorrect as it defeats the purpose of using the automation tool. Granting the non-administrator user full administrative privileges temporarily during RSAT execution (Option D) is not a secure practice and could compromise system security.\n\nRegression suite automation tool (RSAT) - Training | Microsoft Learn Configure the testing environment and prepare data - Training | Microsoft Learn", "references": [{"title": "Regression suite automation tool (RSAT) - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/perf-test/rsat/rsat-overview"}, {"title": "Configure the testing environment and prepare data - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-test-framework-tools-finance-operations/07-configure"}]}]}, {"id": "5096405c61a6cf5bbf26765084946246cb47820d6f6688c10b1824a2d24b8f30", "stem": "Your company needs to publish a series of financial reports from its Microsoft Dynamics 365 finance and operations apps to be consumed by different departments with varying levels of access.\n\nYou need to publish these reports while ensuring that each department only sees data relevant to their operations.\n\nWhich approach should you recommend?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create and publish role-based reports in Dynamics 365 and configure the appropriate security roles for each department.", "correct": true}, {"text": "Use Azure Data Lake for storing reports and manage access through Microsoft Entra ID.", "correct": false}, {"text": "Publish all reports to a shared folder and manually distribute access links to each department.", "correct": false}, {"text": "Generate a single comprehensive report and instruct departments to filter data as needed.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct approach is creating and publishing role-based reports in Dynamics 365, configuring appropriate security roles for each department. Other options either don't enforce data security, allow access to irrelevant data, or unnecessarily complicate the process. Hence, the role-based report approach ensures department-specific data access and maintains data security.\n\nReporting capabilities - Training | Microsoft Learn Information access and reporting - Training | Microsoft Learn", "references": [{"title": "Reporting capabilities - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-ecosystem-main-components-finance-operations/5-reporting"}, {"title": "Information access and reporting - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/analytics/information-access-reporting"}]}]}, {"id": "9f4f22b5e5f260c4b6811079a0662b225199e146c0146cf226fc273d44f996c6", "stem": "You have a Dynamics 365 finance and operations environment that contains a Microsoft Power BI dataset. The dataset is stored in the Entity store.\n\nYou discover that data updates are NOT reflected in the Power BI dataset.\n\nYou need to ensure that the Power BI dataset is updated when changes are made to the environment.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Configure an Entity store export job to run when changes are made in the environment.", "correct": true}, {"text": "Configure an incremental export of the data entities to Entity store.", "correct": false}, {"text": "Enable change tracking for the data entities loaded to Entity store.", "correct": false}, {"text": "Enable change tracking for the data entities loaded to the BYOD database.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Enabling change tracking for the data entities in Entity store is incorrect because change tracking is used for Bring Your Own Database (BYOD) scenarios, not for Entity store reporting. Configuring incremental export to Entity store is also incorrect, as incremental exports are supported only for BYOD. The correct answer is to configure an Entity store export job to run when changes occur in the environment, which refreshes the Entity store and ensures that Power BI reflects the latest data. Enabling change tracking for the BYOD database is irrelevant here because the dataset uses Entity store, not BYOD.\n\nBring your own database (BYOD) - Training | Microsoft Learn", "references": [{"title": "Bring your own database (BYOD) - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/analytics/export-entities-to-your-own-database"}]}]}, {"id": "494ff7281756465bc84ad1fda8bf69b3d57f6be2af791229203b867844eca1eb", "stem": "You are responsible for optimizing the reporting process for financial data within the Dynamics 365 finance and operations apps. The company requires a solution that allows for the creation of financial reports that can be customized and maintained with ease.\n\nYou need to enable the finance team to generate income statements and balance sheets without extensive technical support.\n\nWhich three features should you recommend? Each correct answer presents a complete solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Leverage the Electronic reporting tool to configure financial report formats as required.", "correct": true}, {"text": "Recommend the use of SQL Server Reporting Services (SSRS) for ad-hoc financial report generation.", "correct": false}, {"text": "Advise the finance team to manually compile financial data using Microsoft Excel.", "correct": false}, {"text": "Implement Power BI integration to design interactive financial dashboards within Dynamics 365.", "correct": true}, {"text": "Utilize the Financial reporting feature in Dynamics 365 Finance to create and customize financial reports.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct features to recommend are the Electronic reporting tool, Power BI integration, and the Financial reporting feature in Dynamics 365 Finance. These tools enable the finance team to generate income statements and balance sheets without extensive technical support and allow for customization and maintenance of financial reports. The options suggesting the use of SQL Server Reporting Services for ad-hoc financial report generation or manual data compilation using Microsoft Excel are incorrect as they are either not specified as a requirement or inefficient and prone to errors.\n\nCreate a reporting and analytics strategy - Training | Microsoft Learn Create and modify reports by using Power BI - Training | Microsoft Learn", "references": [{"title": "Create a reporting and analytics strategy - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/business-intelligence-reporting-analytics-reporting-analytics-strategy"}, {"title": "Create and modify reports by using Power BI - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-reports-finance-operations/02-power-bi-reports"}]}]}, {"id": "cbf361df8022768d40a197c31630e87d3c752ba808d62e91cb0a5ae70cfcf1b0", "stem": "You are developing a form that requires a quick filter to help users narrow down data efficiently.\n\nYou need to add a quick filter to the form that can be applied to a group control.\n\nHow do you do this?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Apply a subpattern to the Group control that includes a quick filter.", "correct": true}, {"text": "Add a new Filter control from the Toolbox to the form.", "correct": false}, {"text": "Programmatically create a filter function in the form's class.", "correct": false}, {"text": "Configure the data source's properties to include a built-in filter.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Applying a subpattern to the Group control that includes a quick filter is the correct way to add a quick filter to a form. The other options are not standard practices for adding quick filters in Dynamics 365.\n\nAdd grids, fields, and groups to a form - Training | Microsoft Learn Create and extend menus - Training | Microsoft Learn Lab - Create a form - Training | Microsoft Learn", "references": [{"title": "Add grids, fields, and groups to a form - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-forms-optimize-finance-operations/4-grids"}, {"title": "Create and extend menus - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-forms-optimize-finance-operations/create-menus"}, {"title": "Lab - Create a form - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-forms-optimize-finance-operations/9-exercise"}]}]}, {"id": "1902972f4a9c361c3a9cce003c51084b54329124b5ffb630061781c442cff2df", "stem": "You have been asked to improve the user interface to enhance the productivity of the users.\n\nYou need to let users quickly perform actions whose names they know by using just a few keystrokes.\n\nWhich two features should you implement? Each correct answer presents a complete solution. Choose two.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "FactBox pane", "correct": false}, {"text": "User personalization", "correct": false}, {"text": "Action search", "correct": true}, {"text": "Navigation search", "correct": true}, {"text": "Filter pane", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The Action search functionality allows users to quickly and efficiently perform actions that they know the names of with just a few keystrokes. Navigation search is used to find any page in the product. User personalization is for changing the way the user interface is displayed. FactBox pane and Filter pane are not related to performing actions quickly.\n\nUser interface elements - Training | Microsoft Learn The user interface - Training | Microsoft Learn", "references": [{"title": "User interface elements - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/fin-ops/get-started/user-interface-elements"}, {"title": "The user interface - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-ecosystem-main-components-finance-operations/4-ui"}]}]}, {"id": "b43de9ff37b98ff0d38ec049eea3b15455766b70782c8f02917acda478fcfd6c", "stem": "You are customizing the finance and operations apps to enhance data visibility for users.\n\nYou need to ensure that users can view additional details about a record without opening a new page.\n\nWhich UI element should you add?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "FactBox", "correct": true}, {"text": "Tab", "correct": false}, {"text": "Navigation bar", "correct": false}, {"text": "Action Pane", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The FactBox is used to display additional details about a record within the same page, enhancing data visibility without requiring navigation to a new page. The Navigation bar is for top-level navigation, the Action Pane is for performing actions on records, and Tabs are used to organize data within the same form but do not inherently display additional details.\n\nUser interface elements - Training | Microsoft Learn Create and extend menus - Training | Microsoft Learn", "references": [{"title": "User interface elements - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/fin-ops/get-started/user-interface-elements"}, {"title": "Create and extend menus - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/training/modules/build-forms-optimize-finance-operations/create-menus"}]}]}, {"id": "aecb9e5c07ab1d0e71037acdcdadad8e15c37ec60b5400f3f4e59e0a674f94d2", "stem": "A developer needs to customize a Microsoft Dynamics 365 finance and operations apps implementation by adding a new menu item to an existing menu.\n\nYou need to add the menu item without modifying the original menu's source code.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Use a class extension to inject the new menu item into the original menu.", "correct": false}, {"text": "Directly modify the source code of the original menu to add the menu item.", "correct": false}, {"text": "Create a menu extension and add the new menu item.", "correct": true}, {"text": "Create a new menu that duplicates the original and add the menu item there.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct approach to add new menu items without altering the original menu's source code is by creating a menu extension, hence this option is correct. The choice suggesting direct modification of the original menu is incorrect, as such an approach isn't recommended. The option proposing the duplication of the menu is also incorrect as it does not extend the original menu and can lead to maintenance complications. Lastly, the option advising to use class extensions is incorrect, as these are typically utilized to add methods and variables, not to add menu items to menus.\n\nCustomize through extension and overlayering - Training | Microsoft Learn Create, manage, and extend views - Training | Microsoft Learn", "references": [{"title": "Customize through extension and overlayering - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/customization-overlayering-extensions"}, {"title": "Create, manage, and extend views - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-tables-finance-operations/create-manage-extend-views"}]}]}, {"id": "a43aba51e0a583ef2eb896ede88ceb4e36af9b2c466f43022aea0098d354819d", "stem": "You need to optimize the data model for a new feature that tracks international trade agreements.\n\nYou need to ensure that the table design supports efficient data retrieval and storage. It must still maintain referential integrity between trade agreements and participating countries.\n\nWhat should you do? Each correct answer presents part of the solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Add a relation to the trade agreements table that references the countries table with corresponding delete actions.", "correct": true}, {"text": "Remove all indices from the trade agreements table to reduce storage overhead.", "correct": false}, {"text": "Create an index on the trade agreements table to improve query performance on frequently accessed fields.", "correct": true}, {"text": "Increase the size of string fields in the countries table to accommodate longer country names.", "correct": false}, {"text": "Duplicate country data in both the trade agreements and countries tables for faster access.", "correct": false}, {"text": "Implement field groups in the trade agreements table to optimize data retrieval for forms and reports.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Adding a relation with delete actions ensures referential integrity and cascading deletes or updates where appropriate. Creating an index on frequently accessed fields improves query performance without unnecessary storage overhead. Implementing field groups optimizes data retrieval for user interfaces and reports. Increasing the size of string fields unnecessarily does not contribute to efficiency and may increase storage costs. Removing all indices would degrade performance. Duplicating data in multiple tables violates normalization principles and can lead to data inconsistencies.\n\nCreate tables and table fields - Training | Microsoft Learn Add fields to tables through extension - Training | Microsoft Learn", "references": [{"title": "Create tables and table fields - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-tables-finance-operations/1-create"}, {"title": "Add fields to tables through extension - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/add-field-extension"}]}]}, {"id": "923944be4ca52eff4f2f383ba1419e93310ab40e2d68b3d819bce7afff98f8d5", "stem": "A developer is working on a Microsoft Dynamics 365 finance and operations apps implementation and needs to add a new field to the CustTable to store additional customer information.\n\nYou need to add this field without modifying the original CustTable table.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Directly add the new field to the CustTable table.", "correct": false}, {"text": "Create a new table with the new field and associate it with the CustTable table.", "correct": false}, {"text": "Create an extension of the CustTable table and add the new field there.", "correct": true}, {"text": "Duplicate the CustTable table and add the new field to the duplicate.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct way to add a new field without modifying the original CustTable table is to create an extension of the CustTable table and add the new field there (Option C). Directly adding the new field to the CustTable table (Option A) is incorrect as it involves direct modification of the original table, which is not recommended. Creating a new table with the new field and associating it with the CustTable table (Option B) is not the correct approach because it adds unnecessary complexity to the data model. Duplicating the CustTable table and adding the new field to the duplicate (Option D) is also incorrect as this practice can lead to data integrity issues.\n\nCustomize through extension and overlayering - Training | Microsoft Learn Create, manage, and extend views - Training | Microsoft Learn", "references": [{"title": "Customize through extension and overlayering - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/customization-overlayering-extensions"}, {"title": "Create, manage, and extend views - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-tables-finance-operations/create-manage-extend-views"}]}]}, {"id": "16f6c347a400ad3735c56782804a6eb2a93b279433626eaa7f0d39e1a320455b", "stem": "You have been tasked with modifying an existing EDT for vehicle identification numbers to ensure that the string size accommodates VINs that are up to 17 characters long.\n\nYou need to extend the existing EDT without creating a new one, while adhering to the constraints of extending from another EDT.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Modify the base EDT directly to change the String size property to 17.", "correct": false}, {"text": "Create a new EDT derived from the existing one and set the String size property to 17.", "correct": false}, {"text": "Extend the existing EDT and set the String size property to 17.", "correct": true}, {"text": "Extend the existing EDT and set the String size property to a value less than the base EDT value.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct action is to extend the existing EDT and adjust the String size property to 17, as this is the only way to increase the size without creating a new EDT. Creating a new EDT (Option B) would not be extending the existing one. Modifying the base EDT directly (Option A) is not allowed as per best practices and could lead to conflicts with other models. Setting the String size to a value less than the base EDT value (Option D) is not possible when extending an EDT.\n\nLab - Create a project and add an element - Training | Microsoft Learn Modify extended data types (EDTs) through extension - Training | Microsoft Learn", "references": [{"title": "Lab - Create a project and add an element - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/customize-visual-studio-finance-operations/7-exercise"}, {"title": "Modify extended data types (EDTs) through extension - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/modify-edt"}]}]}, {"id": "aa9827c8c8faae6981de68d28486be7cb5d80b95d65583be8ac6752bdc2ddd8d", "stem": "Your company uses Microsoft Dynamics 365 finance and operations apps. The company wants to track specific types of changes to the tables and fields in finance and operations apps.\n\nYou need to configure a feature that provides a way to track specific types of changes including insert, update, delete, and rename key operations.\n\nWhich feature should you configure?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Auditing", "correct": false}, {"text": "System logs", "correct": false}, {"text": "Database logging", "correct": true}, {"text": "Event Viewer", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Database logging provides a way to track specific types of changes to the tables and fields in finance and operations apps. Auditing, Event Viewer, and System logs are incorrect because they do not provide the specific functionality to track changes to tables and fields in finance and operations apps.\n\nSecure finance and operations apps - Training | Microsoft Learn Extensible data security framework - Training | Microsoft Learn", "references": [{"title": "Secure finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/security-strategy-product-oa"}, {"title": "Extensible data security framework - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/role-security-finance-operations/4-xds"}]}]}, {"id": "affea67605939400ce2d97bbd23de1d66f0d88f8efecd16e6306a664aeeab5c6", "stem": "Your company is experiencing performance issues with its Dynamics 365 finance and operations apps. The system is not responding quickly to user requests, causing frustration and reducing productivity.\n\nYou need to improve the system's responsiveness without compromising its functionality or introducing additional complexity.\n\nWhat should you do? Each correct answer presents a complete solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Migrate all data to a new server located closer to the majority of users.", "correct": false}, {"text": "Design for aggressive caching in finance and operations apps where appropriate.", "correct": true}, {"text": "Consider whether to design for synchronous, asynchronous, or background (batch) processing.", "correct": true}, {"text": "Consider data growth over time and tune the system accordingly.", "correct": true}, {"text": "Upgrade all user devices to the latest hardware.", "correct": false}, {"text": "Increase the number of users who can access the data at the same time.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Designing for aggressive caching, considering the type of processing, and considering data growth over time are all recommended strategies for improving system responsiveness. Increasing user concurrency does not necessarily improve responsiveness and may even degrade it. Migrating all data to a new server or upgrading all user devices are drastic measures that
