<main class="main" id="main"></main><input class="sr-only" id="bank-file" type="file" accept=".json,application/json" aria-label="Import question bank"><input class="sr-only" id="progress-file" type="file" accept=".json,application/json" aria-label="Restore progress"><div id="toast" class="toast" role="status" aria-live="polite"></div><dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message"><form method="dialog"><div class="eyebrow">YOUR SESSION</div><h2 id="confirm-title">Ready to continue?</h2><p id="confirm-message"></p><div class="dialog-buttons"><button id="confirm-cancel" class="button secondary" value="cancel">Go back</button><button class="button primary" value="yes">Continue →</button></div></form></dialog><script id="seed" type="application/json">[{"id": "5f85379df390cf4c1de90303c28f9cb9f02b5cb314ee93379f6f9cf906a3a1a8", "stem": "Your company uses Microsoft Dynamics 365 finance and operations apps. The company wants to track changes to specific tables or fields that are important to its business processes.\n\nYou need to implement a solution that allows you to create an auditable record of changes to specific tables.\n\nWhich feature should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Database logging", "correct": true}, {"text": "Segregation of duties", "correct": false}, {"text": "Extensible Data Security (XDS) policies", "correct": false}, {"text": "Role-based security", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Database logging provides a way to track specific types of changes to the tables and fields in finance and operations apps. Role-based security is used to authorize access to individual elements of the apps. Extensible Data Security (XDS) policies are used to secure data in shared tables. Segregation of duties is used to reduce the risk of fraud, enforce internal control policies, and detect errors or irregularities.\n\nExtensible data security framework - Training | Microsoft Learn Secure finance and operations apps - Training | Microsoft Learn", "references": [{"title": "Extensible data security framework - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/role-security-finance-operations/4-xds"}, {"title": "Secure finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/security-strategy-product-oa"}]}]}, {"id": "5c42ffeef989b6185007348fec1621bcbcffb284d58e1b2677d6badfb4b27142", "stem": "You are optimizing the performance of finance and operations apps. You have noticed that some forms are performing poorly and slowing down the system.\n\nYou need to diagnose authentication issues and understand how the app is using your network without affecting the functionality of the forms.\n\nWhich tool should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Trace Parser", "correct": false}, {"text": "Azure Monitor", "correct": false}, {"text": "Google Chrome Developer Tools", "correct": false}, {"text": "Fiddler", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Fiddler is a free, browser-based debugger tool that is used to diagnose authentication issues. It also provides a timeline that shows the duration of a selected session so you can better understand how the app is using your network. Azure Monitor is used for collecting and analyzing data from your workload, not specifically for diagnosing authentication issues. Google Chrome Developer Tools can be used for performance analysis but not specifically for diagnosing authentication issues. Trace Parser is used to analyze performance issues but not specifically for diagnosing authentication issues.\n\nRecommendations for selecting the right services - Training | Microsoft Learn Diagnose and optimize client performance - Training | Microsoft Learn", "references": [{"title": "Recommendations for selecting the right services - Training | Microsoft Learn", "url": "https://learn.microsoft.com/azure/well-architected/scalability/optimize-cache"}, {"title": "Diagnose and optimize client performance - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-forms-optimize-finance-operations/7-optimize"}]}]}, {"id": "d3cd944cee9735651d9e80da185c4133c33428076ea8018cffd49fc4652bef2b", "stem": "Your company is planning to deploy its solution in the cloud.\n\nYou need to choose a datacenter location that minimizes latency and optimizes performance.\n\nWhat should you consider?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "The brand of the servers in the datacenter", "correct": false}, {"text": "Proximity to users and other components of your solution", "correct": true}, {"text": "The number of servers in the datacenter", "correct": false}, {"text": "The age of the datacenter infrastructure", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "To minimize latency, you should choose a datacenter location that's close to your users and other components of your solution. The number, age, or brand of servers in the datacenter are not key factors in minimizing latency.\n\nDiagnose and optimize client performance - Training | Microsoft Learn Improve performance with smart design choices - Training | Microsoft Learn", "references": [{"title": "Diagnose and optimize client performance - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-forms-optimize-finance-operations/7-optimize"}, {"title": "Improve performance with smart design choices - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/performing-solution-design-for-performance"}]}]}, {"id": "cc42b8c5a4a52f2db56d0f0770a5a80f68bd8333aa176475b503adfe2d13933b", "stem": "You have been optimizing the performance of a Microsoft Dynamics 365 finance and operations apps. The app currently experiences slow load times due to inefficient data retrieval methods.\n\nYou need to implement a caching strategy that optimizes data retrieval for frequently accessed tables without significantly increasing the memory footprint.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Enable single-record caching for all tables regardless of their size to optimize data retrieval.", "correct": false}, {"text": "Set the CacheLookup property of frequently accessed small tables to EntireTable to enable set-based caching.", "correct": true}, {"text": "Disable all caching mechanisms to force direct database queries for real-time data access.", "correct": false}, {"text": "Increase the server cache size settings in System administration to accommodate caching of large tables.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Option A is correct because set-based caching is suitable for small tables where the entire table can be cached efficiently. Option B is incorrect as single-record caching is not optimal for all tables, especially if they are not frequently accessed. Option D is incorrect because increasing the server cache size may not be efficient for large tables and could lead to disk-based searches which are slower. Option C is incorrect as disabling all caching would result in poor performance due to repeated database queries.\n\nIdentify and apply caching mechanisms - Training | Microsoft Learn", "references": [{"title": "Identify and apply caching mechanisms - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/apply-basic-performance-optimization-finance-operations/2-caching"}]}]}, {"id": "7c770d32a16f401c880f7428cb29eee22f1047f214c0f15624456eefc4d0bd09", "stem": "You are working on the Microsoft Dynamics 365 finance and operations apps. The company wants to improve navigation within the application.\n\nYou need to define navigation elements that allow users to easily access custom modules of the application by grouping similar objects together for navigation.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create references in the Application Object Tree.", "correct": false}, {"text": "Design a menu for each module.", "correct": true}, {"text": "Design a saved view for each module.", "correct": false}, {"text": "Design a form for each module.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Designing menus and menu items for each module is the correct approach as it improves navigation within the application. Workspaces are used to provide an overview of a module, not for navigation. Forms are used to display data, not for navigation. Saved views are used to save specific views of data, not for navigation.\n\nImplement built-in KPIs, charts, and other reporting components - Training | Microsoft Learn Navigation concepts - Training | Microsoft Learn", "references": [{"title": "Implement built-in KPIs, charts, and other reporting components - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/training/modules/build-workspaces-finance-operations/4-built-in-kpi"}, {"title": "Navigation concepts - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/user-interface/page-navigation"}]}]}, {"id": "d0636688cf99119d822e77dcc7a82fcc3a8e13e4ab1c4164519773012a25885b", "stem": "You are customizing the Microsoft Dynamics 365 finance and operations apps. The customization involves adding new business logic that will be triggered upon certain events in the application.\n\nYou need to ensure that the new business logic can be easily maintained and does not interfere with future updates to the core application.\n\nWhat three tasks should you do? Each correct answer presents part of the solution.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create a new table in the database to handle the business logic separately.", "correct": false}, {"text": "Modify the base class directly to include the new business logic.", "correct": false}, {"text": "Implement event handlers for the required events to inject custom business logic.", "correct": true}, {"text": "Use the Chain of Command (CoC) to extend the functionality of existing methods.", "correct": true}, {"text": "Create a new class extension to encapsulate the business logic.", "correct": true}, {"text": "Copy the existing method into a new class and add the custom business logic.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Creating a new class extension (E) allows for adding custom business logic without modifying the original base class, which aligns with best practices for maintainability and upgradeability. Using the Chain of Command (D) is a recommended approach to extend the functionality of existing methods without altering the original code. Implementing event handlers (C) is a non-intrusive way to add custom logic that responds to specific application events. Modifying the base class directly (B) is not recommended as it can lead to issues during updates. Copying an existing method into a new class (F) is not a best practice as it can create redundant code and maintenance challenges. Creating a new table in the database (A) is not related to adding business logic within the application code and could lead to unnecessary complexity.\n\nElements, models, and packages - Training | Microsoft Learn Development tools in Visual Studio - Training | Microsoft Learn", "references": [{"title": "Elements, models, and packages - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-technical-architecture-finance-operations/2-elem-model-pack"}, {"title": "Development tools in Visual Studio - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/dev-tools/development-tools-overview"}]}]}, {"id": "fd85f635358a7e9f3dff0b642ee307ddd67db7ee84c49f1cc95b24008be1d2d8", "stem": "You are working on a form in Microsoft Dynamics 365 finance and operations apps.\n\nYou need to ensure that the form matches the existing layouts and UI conventions in finance and operations apps.\n\nWhat should you do? Each correct answer presents part of the solution. Choose two.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Use the Pattern Designer to populate the pattern's requirements.", "correct": true}, {"text": "Right-click the form node in the Form Designer and select Apply Pattern.", "correct": true}, {"text": "Copy the layout from an existing form and apply it to the new form.", "correct": false}, {"text": "Modify the base form in the AOT to match the layout.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct way to match the existing form layouts and UI conventions in finance and operations apps is to right-click the form node in the Form Designer and select Apply Pattern. Then use the Pattern Designer to populate the pattern's requirements. Modifying the base form in the AOT or copying the layout from an existing form are not recommended practices as they can lead to issues with maintainability and upgrades.\n\nCreate new elements - Training | Microsoft Learn", "references": [{"title": "Create new elements - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/customize-visual-studio-finance-operations/6-element-design"}]}]}, {"id": "2c2306610e2a209c62a4a8eb93a97e43fa67a9d074fe0548be05f551c32e6688", "stem": "You have been tasked with extending the InventTable to include a new field for tracking inventory location.\n\nYou need to ensure that the new field is initialized with the default inventory location whenever a new record is inserted.\n\nWhat two methods should you use? Each correct answer presents part of the solution. Choose two.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Call the new method from an event handler for the Inserting data event.", "correct": true}, {"text": "Use a batch job to update the new field after the record has been inserted.", "correct": false}, {"text": "Modify the doInsert() method in the InventTable class.", "correct": false}, {"text": "Create a new method in the InventTable extension class to initialize the new field.", "correct": true}, {"text": "Create a trigger on the InventTable in the database to initialize the new field.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct methods involve creating a new method in the InventTable extension class and calling this method from an event handler for the Inserting data event. Modifying the doInsert() method is not recommended as it prevents data events from being raised. Creating a database trigger is outside the scope of AOT and not a best practice. Using a batch job would not ensure the field is initialized at the time of record insertion.\n\nWrite extensible tables - Training | Microsoft Learn Add a table extension to a project - Training | Microsoft Learn", "references": [{"title": "Write extensible tables - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/extensible-tables"}, {"title": "Add a table extension to a project - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/extend-elements-finance-operations/2-table"}]}]}, {"id": "e0c3dc4add7aafa5d3f8a341531beba95c08619f7c2bc21bd2123ce028d915c9", "stem": "You have extended the FMCustomer table to include a new AccountReferrer field.\n\nYou need to ensure that database searches involving the new field are optimized.\n\nWhat should you do? Each correct answer presents part of the solution. Choose two.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create a unique index on the AccountReferrer field.", "correct": false}, {"text": "Modify the existing indexes on the FMCustomer table to include the AccountReferrer field.", "correct": false}, {"text": "Create a new index on the FMCustomer extension table that includes the AccountReferrer field.", "correct": true}, {"text": "Ensure that the new index is not unique.", "correct": true}, {"text": "Create a view on the FMCustomer table that includes the AccountReferrer field.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Creating a new index on the extended table that includes the new field will optimize database searches. The index should not be unique as this is intrusive and not allowed in extensions. Modifying existing indexes or creating a view does not directly optimize searches on the new field.\n\nWrite extensible tables - Training | Microsoft Learn Add a table extension to a project - Training | Microsoft Learn", "references": [{"title": "Write extensible tables - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/extensible-tables"}, {"title": "Add a table extension to a project - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/extend-elements-finance-operations/2-table"}]}]}, {"id": "7074013ee1bd87d5b462d799ab599cf7b076b70515ea3e1d85f94fd309ece06e", "stem": "You are working on Microsoft Dynamics 365 finance and operations apps. You have been asked to create a view.\n\nYou need to create a view that includes fields from multiple tables.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create a new table that includes the necessary fields from the relevant tables.", "correct": false}, {"text": "Create a view and add the necessary fields from the relevant tables.", "correct": true}, {"text": "Modify an existing table to include the necessary fields from the relevant tables.", "correct": false}, {"text": "Create a map that includes the necessary fields from the relevant tables.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Creating a view and adding the necessary fields from the relevant tables is the correct approach as it allows for a consolidated view of data from multiple tables. Creating a new table, modifying an existing table, or creating a map would not be efficient and could lead to data inconsistency.\n\nCreate, manage, and extend views - Training | Microsoft Learn Customize through extension and overlayering - Training | Microsoft Learn", "references": [{"title": "Create, manage, and extend views - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-tables-finance-operations/create-manage-extend-views"}, {"title": "Customize through extension and overlayering - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/customization-overlayering-extensions"}]}]}, {"id": "3f26c30fdae97a37f656668b646e7adda4360daf9634f2477d8eddd847ad18fd", "stem": "A developer is tasked with enhancing a Microsoft Dynamics 365 finance and operations apps implementation by adding a new data entity to an existing view.\n\nYou need to add the data entity without modifying the original view's source code.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create a new view that duplicates the original and add the data entity there.", "correct": false}, {"text": "Create a view extension and add the new data entity.", "correct": true}, {"text": "Directly modify the source code of the original view to add the data entity.", "correct": false}, {"text": "Use a class extension to inject the new data entity into the original view.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct method for adding new data entities without changing the original view's source code is to create a view extension, making this option correct. The option suggesting direct modification of the original view is incorrect, as such an approach is not recommended. The suggestion to duplicate the view is also incorrect, as this action does not extend the original view and can result in maintenance issues. Finally, the option advising the use of class extensions is incorrect, as these are typically used for adding methods and variables, not for adding data entities to views.\n\nCustomize through extension and overlayering - Training | Microsoft Learn Create, manage, and extend views - Training | Microsoft Learn", "references": [{"title": "Customize through extension and overlayering - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/customization-overlayering-extensions"}, {"title": "Create, manage, and extend views - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-tables-finance-operations/create-manage-extend-views"}]}]}, {"id": "98044e5007e8cc3a605337f8d9707f093d13759be4185d08e3cd01d27aa990ff", "stem": "You are tasked with enhancing the data model for a custom module in Microsoft Dynamics 365 finance and operations apps. The module requires additional fields to capture international address formats.\n\nYou need to create a new Extended Data Type (EDT) that will be used across multiple tables without duplicating properties.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create a new table to store international address formats and reference it in other tables.", "correct": false}, {"text": "Duplicate the existing address EDTs and modify their properties for each table.", "correct": false}, {"text": "Add a new EDT to the project and set the StringSize property to accommodate the largest expected address format.", "correct": true}, {"text": "Modify the base Address EDT directly to support international formats.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct answer is to add a new EDT to the project and set the StringSize property appropriately, as this allows for reusability across multiple tables without duplication. Creating a new table (Option A) is unnecessary for this purpose and does not leverage the benefits of EDTs. Duplicating existing EDTs (Option B) would lead to redundancy and maintenance issues. Modifying the base Address EDT directly (Option D) is not advisable as it could affect existing functionality and does not promote reusability.\n\nExtension points for frameworks - Training | Microsoft Learn X++ extended data types - Training | Microsoft Learn", "references": [{"title": "Extension points for frameworks - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-extensions-framework-finance-operations/3-extension-points"}, {"title": "X++ extended data types - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/dev-ref/xpp-data-edt"}]}]}, {"id": "139096e0b771b2034b5d99ff1dc05021cd9affaa07fba49fe5d146eb8d9747fe", "stem": "You are tasked with enhancing the usability of Microsoft Dynamics 365 finance and operations apps. The system currently uses primitive data types, which makes the code hard to read and maintain.\n\nYou need to create user-friendly and consistent data types while ensuring that properties like labels and help text are standardized across the application.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Use class inheritance to create subclasses of the primitive data types with additional properties.", "correct": false}, {"text": "Directly modify the primitive data types to include additional properties such as labels and help text.", "correct": false}, {"text": "Create new Extended Data Types (EDTs) based on primitive data types and use them in variable and field declarations.", "correct": true}, {"text": "Create a series of macros that define standard labels and help text for use with primitive data types.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Creating new Extended Data Types (EDTs) based on primitive data types allows for more readable code and standardized properties across the application, which is the correct approach. Modifying primitive data types directly (Option B) is not a best practice as it can lead to maintenance issues. Using class inheritance (Option A) is not applicable to primitive data types. Creating macros (Option D) does not achieve the goal of creating user-friendly data types.\n\nExtension points for frameworks - Training | Microsoft Learn X++ extended data types - Training | Microsoft Learn", "references": [{"title": "Extension points for frameworks - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-extensions-framework-finance-operations/3-extension-points"}, {"title": "X++ extended data types - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/dev-ref/xpp-data-edt"}]}]}, {"id": "7884455973d93931f956d8081e911e1598cb4cd02bf6aa92a9127aa88e207d9e", "stem": "You have been asked to customize the application using Visual Studio.\n\nYou need to create an extension model that will allow for future updates without affecting the core codebase.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create a new model, set the model's 'Layer' property to 'ISV', and add the necessary elements.", "correct": false}, {"text": "Create a new model in the 'USR' layer and override the existing elements.", "correct": true}, {"text": "Copy the entire 'SYS' layer to a new 'ISV' layer and make changes there.", "correct": false}, {"text": "Modify the existing model directly in the 'SYS' layer.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The USR layer is specifically designated for customizations and extensions developed by customers or partners, ensuring they are isolated from the core application layers and remain upgrade-friendly.\n\nExtend Menus - Training | Microsoft Learn Develop and Customize Home Page - Training | Microsoft Learn", "references": [{"title": "Extend Menus - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/extend-elements-finance-operations/extend-menus"}, {"title": "Develop and Customize Home Page - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/dev-tools/developer-home-page"}]}]}, {"id": "2cbc5334702cb191509505ed88455a0f7d29fca3bde658f0da2c9243b200003e", "stem": "You have a model named HRX. You have a table named HRApp in a different model that stores employee contact information.\n\nYou need to create a table extension for HRApp that follows naming best practices.\n\nWhat should you name the table extension?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "HRApp.Extension", "correct": false}, {"text": "HRApp.HRX", "correct": true}, {"text": "HRApp.HRX.Extension", "correct": false}, {"text": "HRAppTable_HRX", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Naming the extension HRApp.Extension is incorrect because Microsoft recommends avoiding the generic .Extension suffix; this creates a high risk of naming collisions across models. Naming the extension HRApp.HRX is correct because the best practice pattern is &lt;ElementName&gt;.&lt;ModelOrPrefix&gt;. This ensures that the extension name is unique, traceable to the model, and avoids conflicts. Using HRAppTable_HRX is incorrect because underscores are not valid for extension naming in this context; extensions require a dot suffix. Naming the extension HRApp.HRX.Extension is incorrect because multiple suffixes are not allowed and Visual Studio will strip out the redundant .Extension, breaking consistency\n\nNaming guidelines for extensions - Training | Microsoft Learn", "references": [{"title": "Naming guidelines for extensions - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/extensibility/naming-guidelines-extensions"}]}]}, {"id": "9e9fb01efd121905080788f2a28685d2244e5824faa579821e49ef2ded97043e", "stem": "You have a Dynamics 365 Finance and Operations apps solution in a development environment.\n\nMicrosoft Visual Studio uses a project named ProjectA as the startup project. ProjectA references another project named ProjectB.\n\nFrom Application Explorer, you add a new element to ProjectA.\n\nYou need to identify in which model the new element will be created.\n\nWhat should you identify?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "the model referenced by ProjectA", "correct": true}, {"text": "the model referenced by ProjectB", "correct": false}, {"text": "the model referenced by the application object", "correct": false}, {"text": "the model referenced by the element", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "When you add a new element from Application Explorer to a project in Visual Studio, the element is always created in the model that the project belongs to, regardless of startup settings or project references. In this scenario, because you added the element to ProjectA, the element will be created in the model referenced by ProjectA, not ProjectB or any application object model.\n\nApplication Explorer - Training | Microsoft Learn Development tools in Visual Studio - Training | Microsoft Learn Finance and operations project type in Visual Studio - Training | Microsoft Learn", "references": [{"title": "Application Explorer - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-tools/application-explorer"}, {"title": "Development tools in Visual Studio - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-tools/development-tools-overview"}, {"title": "Finance and operations project type in Visual Studio - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-tools/projects"}]}]}, {"id": "116dfb7651d7982a1e57b590aa79b6504a84adb493f8b27942c2d45fc5906cd8", "stem": "Your team uses Azure DevOps for source control. You have been working on a new feature in a separate branch.\n\nYou need to merge your changes into the main branch without causing any conflicts.\n\nWhat three steps should you perform? Each correct answer presents part of the solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Commit your changes to your local repository.", "correct": true}, {"text": "Perform a 'Get latest' operation to update your local repository with the latest changes from the main branch.", "correct": true}, {"text": "Delete the main branch and replace it with your feature branch.", "correct": false}, {"text": "Resolve any conflicts that arise from the 'Get latest' operation.", "correct": true}, {"text": "Force push your changes to the main branch without performing a 'Get latest' operation.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Committing your changes ensures that they are saved in your local repository. Performing a 'Get latest' operation updates your local repository with the latest changes from the main branch, which helps prevent conflicts when merging. If any conflicts do arise, they should be resolved before the merge. Deleting the main branch or force pushing changes can lead to data loss and should be avoided.\n\nWhat is source control? - Training | Microsoft Learn Source control processes - Training | Microsoft Learn", "references": [{"title": "What is source control? - Training | Microsoft Learn", "url": "https://learn.microsoft.com/azure/devops/user-guide/source-control?view=azure-devops"}, {"title": "Source control processes - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-technical-architecture-finance-operations/4-source-control"}]}]}, {"id": "74fa2158bb926af690160468425e5dd7b981fc74c4be653af549d2c8fe0aecf9", "stem": "You are tasked with developing a report that allows users to monitor the company's assets.\n\nYou need to create a report that provides a static display of a list of inventory items with complex calculations.\n\nWhich reporting tool should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Financial Reporting", "correct": false}, {"text": "Power BI", "correct": false}, {"text": "SSRS reporting", "correct": true}, {"text": "Operational views", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "SSRS reporting is used for back-office document management capabilities, including email support, scheduled batch implementations, and print archive functionality, making it the correct choice for creating a static report displaying a list of inventory items with complex calculations. Power BI is used for interactive reports integrated into application workspaces. Financial Reporting is used for creating custom financial reports. Operational views are used for daily tasks.\n\nInformation access and reporting - Training | Microsoft Learn Reporting capabilities - Training | Microsoft Learn", "references": [{"title": "Information access and reporting - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/analytics/information-access-reporting"}, {"title": "Reporting capabilities - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-ecosystem-main-components-finance-operations/5-reporting"}]}]}, {"id": "80861e1911672260a3a9eb8102219d102a3990d3813256ba373efd057a5eb144", "stem": "You are working on Microsoft Dynamics 365 Finance. You have been asked to create a multidimensional report using a reporting tree.\n\nYou need to modify an existing default report, create a reporting tree, and add it to the report definition to produce a Cost Center/Divisional Income Statement. You need to create a multidimensional report.\n\nWhat should you do first?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Go to Financial reports under Inquiries and reports in General ledger and select the row for the report named Income Statement - Default.", "correct": true}, {"text": "Go directly to the Report Designer and open the Income Statement - Default report.", "correct": false}, {"text": "Start by creating a new report in the Report Designer.", "correct": false}, {"text": "Open the GL Detail - Default report.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct answer is to go to Financial reports under Inquiries and reports in General ledger and select the row for the report named Income Statement - Default. This is the first step in the process of creating a multidimensional report using a reporting tree as per the provided dataset. The other options are incorrect because they either skip this initial step or refer to the wrong report.\n\nView and design financial reports - Training | Microsoft Learn\nReporting capabilities - Training | Microsoft Learn", "references": [{"title": "View and design financial reports - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/fin-ops/analytics/design-financial-reports"}, {"title": "Reporting capabilities - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-ecosystem-main-components-finance-operations/5-reporting"}]}]}, {"id": "28039e02bde8f55a55d6151b2d04f4d07de945a701e415751d6923cae119e0e9", "stem": "You are creating a new report using Power BI Desktop to analyze the company's financial data.\n\nYou need to connect Power BI Desktop to the local Entity Store database in your development environment and create a report that can be migrated to the production environment.\n\nWhat three steps should you perform? Each correct answer presents part of the solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Start Power BI Desktop, select Get Data > SQL Server, enter '.' as the server name and 'AxDW' as the database name, and select the DirectQuery option.", "correct": true}, {"text": "Select the RetailCube aggregate measurement in the Entity Store page and select Refresh.", "correct": false}, {"text": "Use the Import option in the SQL Server Database dialog box.", "correct": false}, {"text": "In the SQL Server Database dialog box, select OK, then in the Navigator dialog box, select the RetailCube_RetailTransDetailsView table and select Load.", "correct": true}, {"text": "Create the report by dragging measures and fields to the canvas, and explore data and trends interactively.", "correct": true}, {"text": "Publish the report to Power BI and pin it to the client.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct steps to connect Power BI Desktop to the local Entity Store database and create a report are to start Power BI Desktop, select Get Data &gt; SQL Server, enter '.' as the server name and 'AxDW' as the database name, and select the DirectQuery option, then select OK in the SQL Server Database dialog box, select the RetailCube_RetailTransDetailsView table in the Navigator dialog box and select Load, and finally create the report by dragging measures and fields to the canvas, and explore data and trends interactively. The Import option in the SQL Server Database dialog box is not currently supported. Selecting the RetailCube aggregate measurement in the Entity Store page and selecting Refresh is not necessary for this task. Publishing the report to PowerBI.com and pinning it to the client is a step for integrating the report into a demo environment, not for creating a report in the development environment.\n\nDevelop and integrate Microsoft Power Platform - Training | Microsoft Learn\nCreate analytical reports by using Power BI Desktop - Training | Microsoft Learn", "references": [{"title": "Develop and integrate Microsoft Power Platform - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/integrate-azure-finance-operations/3-power"}, {"title": "Create analytical reports by using Power BI Desktop - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/analytics/author-distribute-power-bi-reports"}]}]}, {"id": "5349eb5668d2ba54e961b9173a5e2aaa54810bd3c25690171c362eaedddbcbf7", "stem": "You are working on Dynamics 365 finance and operations apps. You have been tasked with creating a report that will be used to monitor key performance metrics and surface trends in data.\n\nYou need to create a report that can be accessed internally and externally, supports transactional and aggregate data, and allows for free form design.\n\nWhich two tools should you use? Each correct answer presents a complete solution. Choose two.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Management Reporter", "correct": false}, {"text": "Embedded BI", "correct": false}, {"text": "SSRS Report", "correct": true}, {"text": "Excel Integration", "correct": false}, {"text": "Power BI", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "SSRS Report is the correct choice because it supports both transactional and aggregate data, can be accessed internally and externally, and allows for free form design. Power BI Integration also allows for internal and external access and supports aggregate data, but it does not support transactional data. Excel Integration, Embedded BI, and Management Reporter do not meet all the requirements.\n\nCreate reporting solutions - Training | Microsoft Learn Implement built-in KPIs, charts, and other reporting components - Training | Microsoft Learn", "references": [{"title": "Create reporting solutions - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/analytics/create-nextgen-reporting-solutions"}, {"title": "Implement built-in KPIs, charts, and other reporting components - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-workspaces-finance-operations/4-built-in-kpi"}]}]}, {"id": "7988dcd3a1e8537ca958d8926a465ff2ada2673689a3478aec683231a28f02f9", "stem": "Your company wants to create a key performance indicator (KPI) to monitor its sales performance.\n\nYou need to create a KPI that shows total sales and determine which measurement to use. Which property should you set?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Measure Group", "correct": false}, {"text": "Measurement", "correct": true}, {"text": "Measure", "correct": false}, {"text": "Goal Type", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The 'Measurement' property is used to select the measurement for the KPI. The other options like 'Goal Type', 'Measure', and 'Measure Group' are incorrect because they do not select the measurement for the KPI.\n\nNavigation concepts - Training | Microsoft Learn\nDesign KPIs - Training | Microsoft Learn", "references": [{"title": "Navigation concepts - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/user-interface/page-navigation"}, {"title": "Design KPIs - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-workspaces-finance-operations/1-kpi"}]}]}, {"id": "22ae0dfaeeb1d32b10322a3a02dea11d16039dd8b2f772ebe4fc541b2844d84c", "stem": "You are integrating Microsoft Dynamics 365 finance and operations apps with a third-party application.\n\nYou need to exchange data between the systems in a way that is robust, decoupled, and requires less manual intervention.\n\nWhich integration pattern should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Synchronous", "correct": false}, {"text": "Asynchronous", "correct": true}, {"text": "Embedding", "correct": false}, {"text": "Batching", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Asynchronous integration pattern is the most recommended as it allows for a robust, decoupled integration architecture with less manual intervention. Synchronous pattern is generally not a best practice due to the risk of processes getting stuck. Batching and Embedding are not integration patterns, they are techniques used within the patterns.\n\nChoose the right pattern for your Dynamics 365 apps integration strategy - Training | Microsoft Learn", "references": [{"title": "Choose the right pattern for your Dynamics 365 apps integration strategy - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/integrate-other-solutions-choose-pattern"}]}]}, {"id": "aee49800c3930dc8be1aa59624f51b9d5497579e0c3b233ca7e0ec8c2eb03626", "stem": "At your company, you are responsible for optimizing the data integration process for a high-volume e-commerce platform that interacts with Microsoft Dynamics 365 finance and operations apps. The platform experiences variable transaction loads, with peak times during sales events.\n\nYou need to select an integration pattern that can handle the current and future transaction loads efficiently, even when they exceed normal expectations.\n\nWhat integration pattern should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Embedding for UI integration", "correct": false}, {"text": "Real-time or synchronous for immediate data transfer", "correct": false}, {"text": "One-way sync for simple data transfer", "correct": false}, {"text": "Batching to group messages and reduce overhead", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Batching is the correct answer because it groups messages, which reduces overhead and can handle high and variable transaction loads efficiently. Real-time or synchronous is incorrect as it is not suitable for high-volume transactions and can lead to system dependency and sensitivity to delays. Embedding is incorrect as it is primarily for UI integration and does not address the need to manage high transaction loads. One-way sync is incorrect because it does not provide the scalability needed for variable transaction loads.\n\nChoose the right pattern for your Dynamics 365 apps integration strategy - Training | Microsoft Learn", "references": [{"title": "Choose the right pattern for your Dynamics 365 apps integration strategy - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/integrate-other-solutions-choose-pattern"}]}]}, {"id": "4c6e81fac9ed8232a203358608baea014913d535bd519fa44551106ab7908bab", "stem": "You have a finance and operations environment.\n\nYou need to provide business analysts with the ability to query F&O data in Microsoft Dataverse without physically storing the data.\n\nWhich integration tool should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "business events", "correct": false}, {"text": "custom services", "correct": false}, {"text": "OData", "correct": false}, {"text": "virtual entities", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct solution is virtual entities, because they enable Dataverse users to query finance and operations data in real time without replicating it into Dataverse. OData is a synchronous API that supports CRUD operations but would require direct integration and does not avoid storage. Custom services expose custom logic and data through APIs but are not designed for real-time query in Dataverse. Business events stream events from F&O to other systems but are not a query mechanism. Virtual entities minimize storage overhead and provide direct query capability, meeting the requirement.\n\nMicrosoft Power Platform integration with finance and operations apps - Training | Microsoft Learn Integrate Dynamics 365 apps with other systems - Training | Microsoft Learn", "references": [{"title": "Microsoft Power Platform integration with finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/power-platform/overview"}, {"title": "Integrate Dynamics 365 apps with other systems - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/guidance/implementation-guide/integrate-other-solutions-guidance-product"}]}]}, {"id": "b44ee50ce5b1d99da730dbd9792b28d01be6f24a0c24a39a9fb560a5af1ea3ad", "stem": "Your company is integrating its Microsoft Dynamics 365 finance and operations apps with a legacy inventory management system.\n\nYou need to ensure that inventory data is synchronized daily between the two systems with minimal performance impact.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Set up a recurring data job with change tracking enabled for the inventory entities.", "correct": true}, {"text": "Manually import and export data daily using Excel files.", "correct": false}, {"text": "Implement a full data sync every hour to ensure data consistency.", "correct": false}, {"text": "Develop a custom real-time integration solution for data synchronization.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Option A is correct because setting up a recurring data job with change tracking will synchronize the data daily with minimal performance impact. Option B is incorrect as manual processes are not efficient for daily tasks and do not meet the requirement of minimal performance impact. Option D is incorrect because a real-time solution is not necessary for daily synchronization and could lead to unnecessary complexity and resource usage. Option C is incorrect as it would have a significant performance impact due to the frequency of the full data sync.\n\nMonitor status and availability of entities - Training | Microsoft Learn Data import and export jobs overview - Training | Microsoft Learn", "references": [{"title": "Monitor status and availability of entities - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/data-integrations-finance-operations/monitor-status-entities"}, {"title": "Data import and export jobs overview - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/fin-ops/data-entities/data-import-export-job"}]}]}, {"id": "96a7d49ec38ef523e1c127f18b8c02a34b49be2c57eaa4e912e877e2a8e467e5", "stem": "You are setting up a data migration process from a legacy system to Microsoft Dynamics 365 finance and operations apps. The legacy system contains complex customer and vendor data that needs to be migrated while ensuring data integrity and minimal downtime.\n\nYou need to ensure that the data import process can handle errors effectively without halting the entire process.\n\nWhat should you do? Each correct answer presents a complete solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Manually import data entity files one at a time to isolate and address errors, disregarding the use of the data management framework.", "correct": false}, {"text": "Configure the data management framework to halt the entire import process upon encountering any errors, ensuring no faulty data is migrated.", "correct": false}, {"text": "Use the data management framework to create a data project and set up a recurring data job with error handling to skip faulty records.", "correct": true}, {"text": "Enable change tracking for entities in the data management framework to monitor the status and availability of entities during the import process.", "correct": true}, {"text": "Implement an asynchronous integration pattern using the data management framework to sequence data entities and manage import errors.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct answer is to use the data management framework to create a data project and set up a recurring data job with error handling to skip faulty records, enable change tracking for entities in the data management framework to monitor the status and availability of entities during the import process, and implement an asynchronous integration pattern using the data management framework to sequence data entities and manage import errors. Manually importing data entity files one at a time is time-consuming and does not utilize the capabilities of the data management framework. Configuring the data management framework to halt the entire import process upon encountering any errors does not meet the requirement of skipping faulty records\n\nData management overview - Training | Microsoft Learn Export, import, and copy data into a legal entity - Training | Microsoft Learn", "references": [{"title": "Data management overview - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/data-entities/data-entities-data-packages"}, {"title": "Export, import, and copy data into a legal entity - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/work-data-management-finance-operations/7-export-import-copy-data"}]}]}, {"id": "faff03c813cd5dc683a9c0d2c1d9e7a6ead753c0866082cc61bd1dec1af9263c", "stem": "You are working on a new solution for the Projects module. You built an entity for the project category and need to test exporting a sample of its rows. How should you obtain the data for this test?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Fix the column mappings to the Projects entity.", "correct": false}, {"text": "Change the company to USSI.", "correct": false}, {"text": "Set the entity’s category to Transaction – limited.", "correct": false}, {"text": "Use a sample file mapping and filters.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "To export only a subset of the data, you should use a sample file mapping and filters. The other options are not relevant to this specific task.\n\nDevelop entities for data migration - Training | Microsoft Learn Work with composite data entities - Training | Microsoft Learn", "references": [{"title": "Develop entities for data migration - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/data-entities/develop-entity-for-data-migration"}, {"title": "Work with composite data entities - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/data-integrations-finance-operations/5-composite"}]}, {"options": [{"text": "Fix the column mappings to the Projects entity.", "correct": false}, {"text": "Change the company to USSI.", "correct": false}, {"text": "Set the entity’s category to Transaction – limited.", "correct": false}, {"text": "Use a sample file mapping and filters.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "To export only a subset of the data, you should use a sample file mapping and filters. The other options are not relevant to this specific task.\n\nDevelop entities for data migration - Training | Microsoft Learn Work with composite data entities - Training | Microsoft Learn", "references": [{"title": "Develop entities for data migration - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/data-entities/develop-entity-for-data-migration"}, {"title": "Work with composite data entities - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/data-integrations-finance-operations/5-composite"}]}]}, {"id": "402d1079468637c10d0578423b9cf40eca0a01d35e11702a0a0294ce4d3d3b7f", "stem": "Your company needs to export aggregated data from multiple entities in Microsoft Dynamics 365 finance and operations apps for analysis.\n\nYou need to create a solution that allows for the export of combined data from several entities.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Manually merge data in Excel after exporting individual entities.", "correct": false}, {"text": "Develop and export a composite data entity that includes all the required entities.", "correct": true}, {"text": "Export each entity separately and combine them using an external database tool.", "correct": false}, {"text": "Create a custom SQL view in the application database to combine the data.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Developing and exporting a composite data entity is the correct approach as it allows for the aggregation of data from multiple entities within Microsoft Dynamics 365. Exporting entities separately and combining them externally is inefficient and prone to errors. Manually merging data in Excel is not scalable or reliable for large datasets. Creating a custom SQL view directly in the database is not recommended as it can lead to performance issues and bypasses the application's business logic.\n\nOptimize data entities to achieve better performance - Training | Microsoft Learn Integration architecture design - Training | Microsoft Learn", "references": [{"title": "Optimize data entities to achieve better performance - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/external-data-sources-finance-operations/4-performance"}, {"title": "Integration architecture design - Training | Microsoft Learn", "url": "https://learn.microsoft.com/azure/architecture/integration/integration-start-here"}]}]}, {"id": "a4856e812ac8e2f61364521ac22bbf062507aa9858e93b9055a50e71b369478a", "stem": "You are integrating Microsoft Dynamics 365 finance and operations apps with Power BI Desktop.\n\nYou need to connect Power BI Desktop to finance and operations apps.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Select 'Get Data' from the Home ribbon and then select 'OData Feed'.", "correct": true}, {"text": "Use the 'Import Data' option from the File menu.", "correct": false}, {"text": "Create a new Power BI report and select 'Dynamics 365 for Fin & Ops' as the data source.", "correct": false}, {"text": "Download the finance and operations apps data and import it into Power BI.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "To connect Power BI Desktop to finance and operations apps, you should select 'Get Data' from the Home ribbon and then select 'OData Feed'. The other options are incorrect because they do not correctly describe the process of connecting Power BI Desktop to finance and operations apps.\n\nMicrosoft Power Platform documentation - Training | Microsoft Learn\nDevelop and integrate Microsoft Power Platform - Training | Microsoft Learn\n\nMicrosoft Power Platform documentation - Training | Microsoft Learn\nDevelop and integrate Microsoft Power Platform - Training | Microsoft Learn", "references": [{"title": "Microsoft Power Platform documentation - Training | Microsoft Learn", "url": "https://learn.microsoft.com/azure/architecture/solutions/power-platform-scenarios"}, {"title": "Develop and integrate Microsoft Power Platform - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/integrate-azure-finance-operations/3-power"}]}]}, {"id": "682971bf22dd16e1b49598a5cfe8dede87457a3d847920ddbe9b8581e307e429", "stem": "You are integrating Microsoft Dynamics 365 finance and operations apps with Power Apps.\n\nYou need to connect to finance and operations apps in Power Apps.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "When creating a new Power App, select the 'Start with data' option and then select 'Fin & Ops Apps' as the connection.", "correct": true}, {"text": "Install Power Apps Studio and select 'Fin & Ops Apps' as the data source.", "correct": false}, {"text": "Create a new Power Apps app and select 'Fin & Ops Apps' as the data source.", "correct": false}, {"text": "Import data from finance and operations apps to Power Apps.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "To connect to finance and operations apps in Power Apps, you should select the 'Start with data' option when creating a new Power Apps app and then select 'Fin & Ops Apps'. The other options are incorrect because they do not correctly describe the process of connecting Power Apps to finance and operations apps.\n\nMicrosoft Power Platform documentation - Training | Microsoft Learn\nDevelop and integrate Microsoft Power Platform - Training | Microsoft Learn", "references": [{"title": "Microsoft Power Platform documentation - Training | Microsoft Learn", "url": "https://learn.microsoft.com/azure/architecture/solutions/power-platform-scenarios"}, {"title": "Develop and integrate Microsoft Power Platform - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/integrate-azure-finance-operations/3-power"}]}]}, {"id": "5a1cbcc57494e0929e9df7af3d7cec81144ccab38aab59683938e0ad263996cb", "stem": "You have an X++ CustImportService class that updates staging records.\n\nFor each record, the code calls the following .NET method:\n\nThirdPartyNormalizer.NormalizeName(str)\n\nSometimes, the .NET call throws an exception and the Infolog does NOT display the .NET exception message.\n\nYou need to log the .NET exception details to the Infolog and stop processing by throwing an X++ error, while keeping the per-record ttsBegin/ttsCommit behavior.\n\nWhich X++ code should you add?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "catch (Exception::CLRError)\n{\nSystem.Exception ex = CLRInterop::getLastException();\nthrow error(ex.Message);\n}", "correct": false}, {"text": "catch (Exception::CLRError)\n{\nSystem.Exception ex = CLRInterop::getLastException();\nerror(ex.ToString());\nthrow Exception::Error;\n}", "correct": true}, {"text": "catch (Exception::Error)\n{\nSystem.Exception ex = CLRInterop::getLastException();\nthrow error(ex.Message);\n}", "correct": false}, {"text": "catch\n{\nGlobal::exceptionTextFallThrough();\n}", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Objective:\n\n4.1 Develop X++ code\n\nWhat This Item Tests:\n\nImplement common structured programming constructs of X++\n\nAdditional Reading:\n\nCLRInterop.getLastException Method\n\nRationale:\n\nCatching Exception::CLRError, retrieving the CLR exception via CLRInterop::getLastException(), writing the details to the Infolog, and then throwing an X++ error stops processing and ensures that the CLR failure is visible. Logging only ex.Message can omit useful diagnostic details, catching Exception::Error will not reliably capture CLR exceptions, and exceptionTextFallThrough() intentionally does nothing and will not surface the CLR exception information.", "references": [{"title": "CLRInterop.getLastException Method", "url": "https://learn.microsoft.com/en-us/dotnet/api/microsoft.dynamics.ax.xpp.clrinterop.getlastexception?view=dyn-finops-dotnet"}]}]}, {"id": "cc00c7d751a7e715cf64d9ca2d3a8a556e5dd29566b01dae4e752c4902f662cf", "stem": "You have a Dynamics 365 finance and operations app extension solution in Microsoft Visual Studio that includes a C# best practice rules project.\n\nA rule runs during builds in the xppcAgent process and checks the value of the Author attribute on X++ methods.\n\nThe rule intermittently reports AuthorNotCurrent warnings when methods contain multiple attributes.\n\nYou need to resolve the best practice warnings.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Disable the AuthorNotCurrent rule.", "correct": false}, {"text": "Locate the Author attribute by name before reading its parameter value.", "correct": true}, {"text": "Limit the rule to debug builds only.", "correct": false}, {"text": "Use breakpoints to verify attribute values during builds.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Objective:\n\n4.1 Develop X++ code\n\nWhat This Item Tests:\n\nResolve best practice warnings\n\nAdditional Reading:\n\nWrite best practice rules\n\nUse the right type of breakpoint\n\nRationale:\n\nLocating the Author attribute by name before reading its parameter ensures that the rule consistently evaluates the correct metadata and eliminates false AuthorNotCurrent warnings. Disabling the rule or limiting it to debug builds avoids the warning rather than resolving its cause. Using breakpoints is a diagnostic step and does not correct the rule logic or prevent future warnings.", "references": [{"title": "Write best practice rules", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-tools/author-best-practice-rules"}, {"title": "Use the right type of breakpoint", "url": "https://learn.microsoft.com/en-us/visualstudio/debugger/using-breakpoints"}]}]}, {"id": "4932b280dacba4606c8ca2afbdf4c95090b387005ee74a46a59d6b4829569193", "stem": "You are developing a Dynamics 365 Finance and Operations application. You need to extend a base class method but the method is marked as final.\n\nYou need to override the restriction and wrap the final method in an extension class.\n\nWhat attribute should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Hookable(false)", "correct": false}, {"text": "Hookable(true)", "correct": false}, {"text": "Wrappable(true)", "correct": true}, {"text": "Wrappable(false)", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The Wrappable(true) attribute can be used to override the restriction and allow final methods to be wrapped in extension classes. Hookable(true) does not influence chain of command wrapping. Wrappable(false) marks methods as non-wrappable. Hookable(false) makes the method unable to be wrapped in an extension class.\n\nClass extension - Method wrapping and Chain of Command - Training | Microsoft Learn Implement Chain of Command - Training | Microsoft Learn", "references": [{"title": "Class extension - Method wrapping and Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/method-wrapping-coc"}, {"title": "Implement Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/develop-object-oriented-code-finance-operations/4-chain-command"}]}]}, {"id": "e49b00a0c9375aa32b0d632bdfdd1f037db864c5eb88aef9bb7cf53626edb82a", "stem": "You are working on a Dynamics 365 Finance and Operations application. You need to extend a base class method but the method has a default parameter.\n\nYou need to wrap the method in an extension class without causing any errors.\n\nYou need to determine how to declare the wrapper method.\n\nHow should you do this?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Declare the wrapper method with the default value of the parameter", "correct": false}, {"text": "Declare the wrapper method with a different default value for the parameter", "correct": false}, {"text": "Declare the wrapper method without the parameter", "correct": false}, {"text": "Declare the wrapper method without including the default value of the parameter", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "When wrapping methods that have default parameters in extension classes, the method signature in the wrapper method must not include the default value of the parameter. Including the default value, omitting the parameter, or using a different default value would cause errors.\n\nClass extension - Method wrapping and Chain of Command - Training | Microsoft Learn Implement Chain of Command - Training | Microsoft Learn", "references": [{"title": "Class extension - Method wrapping and Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/method-wrapping-coc"}, {"title": "Implement Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/develop-object-oriented-code-finance-operations/4-chain-command"}]}]}, {"id": "7e999c6eece43713481a78e1003028a0b05b8c8611c648e860b888cca5559808", "stem": "You are tasked with improving the efficiency of batch jobs in the Microsoft Dynamics 365 finance and operations apps.\n\nYou need to ensure that a batch job runs at a scheduled time with minimal performance impact on the system.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Configure the batch job to run during off-peak hours and set it to a lower batch thread priority.", "correct": true}, {"text": "Schedule the batch job to run every hour to distribute the load throughout the day.", "correct": false}, {"text": "Manually trigger the batch job during peak business hours.", "correct": false}, {"text": "Increase the batch thread priority to the highest level to ensure it runs immediately.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Configuring the batch job to run during off-peak hours with a lower priority will minimize the performance impact on the system. Increasing the batch thread priority to the highest level could negatively affect other processes. Scheduling the batch job to run every hour may not be necessary and could lead to system overload. Manually triggering the batch job during peak hours would likely cause performance issues.\n\nFinance and operations apps and associated apps - Training | Microsoft Learn Type registration - Training | Microsoft Learn", "references": [{"title": "Finance and operations apps and associated apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-ecosystem-main-components-finance-operations/1-apps"}, {"title": "Type registration - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/process-automation/type-registration"}]}]}, {"id": "6bc45ee4fbbe55e112697de51f1e80f4657bcc870635eff9a557ed5a7208388f", "stem": "You are working on a Microsoft Dynamics 365 finance and operations apps project. The company has a requirement to implement a batch processing feature for their financial transactions.\n\nYou need to implement the batch framework in the most efficient way.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create a custom batch processing system using X++ code.", "correct": false}, {"text": "Implement batch processing manually by creating a new class for each batch job.", "correct": false}, {"text": "Use the SysOperation framework for batch processing.", "correct": false}, {"text": "Use the BatchHeader and BatchJob classes to create and manage batch jobs.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The BatchHeader and BatchJob classes are specifically designed for creating and managing batch jobs in Dynamics 365 finance and operations apps. Creating a custom batch processing system or implementing batch processing manually would be unnecessary and inefficient. The SysOperation framework is not designed for batch processing.\n\nImplement the SysOperationSandbox framework - Training | Microsoft Learn Development and administration for finance and operations apps - Training | Microsoft Learn", "references": [{"title": "Implement the SysOperationSandbox framework - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-extensions-framework-finance-operations/sysoperationsandbox-framework"}, {"title": "Development and administration for finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/"}]}]}, {"id": "f74a8fd2aa59ea3ba53baf3c323dd603b30c7cc02cfe9712fb5c5b38fb9cd294", "stem": "You are working on a finance and operations app. You have a custom table called BankCheque with two fields BankAccount and CheckNo.\n\nYou need to run a user interface-driven process to add 100 new check numbers, starting from 10000, by using the sandbox framework without freezing the web client.\n\nYou need to marshal the state of the current instance to the new instance.\n\nWhich method should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "callStaticMethod()", "correct": false}, {"text": "run() method", "correct": false}, {"text": "pack()/unpack() method", "correct": true}, {"text": "AsyncInfo() method", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Option A is correct because the pack()/unpack() method is used to marshal the state of the current instance to the new instance prior to starting the run() method. Option B is incorrect because the run() method is used to start the process, not to marshal the state. Option C is incorrect because the AsyncInfo() method is used to run a synchronous operation on the asynchronous session, not to marshal the state. Option D is incorrect because callStaticMethod() is used to run the AsyncInfo static method by using the sandbox framework, not to marshal the state.\n\nImplement the SysOperationSandbox framework - Training | Microsoft Learn The user interface - Training | Microsoft Learn Use X++ runtime functions for common tasks - Training | Microsoft Learn", "references": [{"title": "Implement the SysOperationSandbox framework - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-extensions-framework-finance-operations/sysoperationsandbox-framework"}, {"title": "The user interface - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-ecosystem-main-components-finance-operations/4-ui"}, {"title": "Use X++ runtime functions for common tasks - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/get-started-xpp-finance-operations/8-runtime"}]}]}, {"id": "259621ec514d26a8fe48b512d5c9dab9a294a506af20029255eadaf94277208e", "stem": "You have been tasked with testing a new feature in the ERP application.\n\nYou need to create a unit test that is data agnostic and dependent only on the input data provided as part of the test.\n\nWhich three tools should you use? Each correct answer presents a complete solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Regression Suite Automation Tool (RSAT)", "correct": true}, {"text": "ATL framework", "correct": true}, {"text": "SysTest framework", "correct": true}, {"text": "Visual Studio Code", "correct": false}, {"text": "Microsoft Excel", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The SysTest framework is reliable for writing unit tests that are data agnostic and dependent only on the input data provided as part of the test. The ATL framework is used for writing component tests or simple integration tests, and the RSAT is used for integration tests and business cycle tests. Microsoft Excel and Visual Studio Code are not tools used for creating unit tests in Dynamics 365.\n\nData agnostic testing using the Regression Suite Automation Tool - Training | Microsoft Learn Unit test framework - Training | Microsoft Learn", "references": [{"title": "Data agnostic testing using the Regression Suite Automation Tool - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/get-started/recommendation-data-agnostic-testing-rsat"}, {"title": "Unit test framework - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-test-framework-tools-finance-operations/02-framework"}]}]}, {"id": "68451c5c455e4af865e583e0bf31aaeed3350c3281b5de61efc91a1163cbdb4d", "stem": "You are tasked with ensuring that test cases for the Microsoft Dynamics 365 finance and operations apps fail when a warning message appears in the Infolog.\n\nYou need to configure RSAT to meet this requirement.\n\nYou need to determine which setting to modify in the Excel parameter file.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Set Abort test suite execution on failure option to True", "correct": false}, {"text": "Increase the Pause between steps value", "correct": false}, {"text": "Enable Enforce test case readiness checkbox", "correct": false}, {"text": "Set Fail on warning message in the Infolog option to True", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Setting 'Fail on warning message in the Infolog' option to True will cause test cases to fail when a warning message appears, which meets the requirement. The other options do not directly relate to the behavior of test cases in response to warning messages in the Infolog.\n\nUse the Regression suite automation tool (RSAT) - Training | Microsoft Learn Plan the build, test, and quality control processes - Training | Microsoft Learn", "references": [{"title": "Use the Regression suite automation tool (RSAT) - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/perf-test/rsat/rsat-run"}, {"title": "Plan the build, test, and quality control processes - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/application-lifecycle-finance-operations/03-plan"}]}]}, {"id": "e83ec9cec355d2e289a88d0a815602910c235ee6e9002468560e54de867b5ab9", "stem": "You are working on the Microsoft Dynamics 365 finance and operations apps. You have a set of tests that need to be run regularly.\n\nYou need to automate these tests to save time and effort.\n\nWhich tool should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "SysTest framework", "correct": false}, {"text": "Acceptance Test Library (ATL) tool", "correct": false}, {"text": "Regression suite automation tool (RSAT)", "correct": true}, {"text": "Task recorder", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The Regression suite automation tool (RSAT) is specifically designed for automating tests in Microsoft Dynamics 365. The SysTest framework is used for unit/component testing, not for test automation. The Acceptance Test Library (ATL) tool is used for acceptance testing, not for test automation. The Task recorder is used for recording tasks, not for test automation.\n\nRun unit tests - Training | Microsoft Learn Regression suite automation tool best practices - Training | Microsoft Learn", "references": [{"title": "Run unit tests - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-test-framework-tools-finance-operations/08-unit-test"}, {"title": "Regression suite automation tool best practices - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/perf-test/rsat/rsat-best-practices"}]}]}, {"id": "209f2f7b7607176b98e2e779c27a3a69ca57ee61106184af9182a01fc22b6bbd", "stem": "Your company is developing a custom feature for their Microsoft Dynamics 365 finance and operations apps that automates complex financial calculations. The feature has multiple dependencies across different modules and requires rigorous testing to ensure accuracy and performance.\n\nYou need to establish a testing approach that allows for the validation of the custom feature's functionality within the context of the entire application and identifies potential performance issues.\n\nWhat should you recommend? Each correct answer presents part of the solution. Choose two.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Deploy the feature to a limited user base and gather feedback on its functionality and performance.", "correct": false}, {"text": "Implement unit/component testing using the SysTest framework to test the feature's performance and logic in isolation.", "correct": true}, {"text": "Use the Task recorder to capture the financial calculations and replay them for testing purposes.", "correct": false}, {"text": "Conduct performance testing by measuring the response time of the feature when accessed by the
