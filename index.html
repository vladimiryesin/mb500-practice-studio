hoices": [{"text": "error(\"Update completed.\"); info(\"Script completed.\");", "value": "1"}, {"text": "info(\"Update completed.\"); error(\"Script completed.\");", "value": "2"}, {"text": "info(\"Update completed.\"); info(\"Script completed.\");", "value": "3"}], "correct_choice": "info(\"Update completed.\"); info(\"Script completed.\");"}], "explanation": "Objective: \n\n4.1 Develop X++ code\n\n \n\nWhat This Item Tests: \n\nImplement global functions in X++\n\n \n\nAdditional Reading: \n\nRun custom X++ scripts with zero downtime — Code example\n\n \n\nRationale: \n\nThe correct configuration compares curExt() to company and writes both completion messages by using info(). The curExt() function returns the current legal entity, so it detects when the script is running in a different legal entity from the requested one. Comparing company to itself cannot detect an incorrect execution context, while checking record1.DataAreaId verifies the record’s legal entity rather than the current legal entity. The info() function creates informational Infolog entries, while error() creates error entries and does not meet the requirement.", "references": [{"title": "Run custom X++ scripts with zero downtime — Code example", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/deployment/run-custom-scripts"}]}]}, {"id": "962c7bb4347e0ed2d921a4ebce4b89a4bebe2e27cbc134c713b69618ea7425ef", "stem": "You have an ISV package named Package1. Package1 contains a model named Model1. Model1 contains a table named Table1 and a form named Form1.\n\nYou need to create an extension model named Model2 that meets the following requirements:\n\nAdd a field to Table1 and a control to Form1.\n\nAllow Package1 to be updated independently of the extensions.\n\nOther required model references are already selected.\n\nHow should you configure Model2? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.", "variants": [{"options": [{"text": "Package selection: ApplicationSuite package", "correct": false}, {"text": "Package selection: Create a new package", "correct": true}, {"text": "Package selection: Package1", "correct": false}, {"text": "Referenced model: ApplicationFoundation", "correct": false}, {"text": "Referenced model: ApplicationSuite", "correct": false}, {"text": "Referenced model: Model1", "correct": true}], "type": "dropdown", "response_groups": [{"label": "Package selection", "choices": [{"text": "ApplicationSuite package", "value": "1"}, {"text": "Create a new package", "value": "2"}, {"text": "Package1", "value": "3"}], "correct_choice": "Create a new package"}, {"label": "Referenced model", "choices": [{"text": "ApplicationFoundation", "value": "1"}, {"text": "ApplicationSuite", "value": "2"}, {"text": "Model1", "value": "3"}], "correct_choice": "Model1"}], "explanation": "Objective: \n\n2.1 Customize finance and operations apps by using Visual Studio\n\n \n\nWhat This Item Tests: \n\nCreate and manage extension models\n\n \n\nAdditional Reading: \n\nModels and packages - Finance & Operations | Dynamics 365 | Microsoft Learn\n\n \n\nRationale: \n\nThe correct configuration is to create a new package for Model2 and reference Model1. A model deployed in its own package can extend metadata and business logic in referenced models while remaining separate from the source package, which supports independent servicing and upgrades. Because Table1 and Form1 belong to Model1, Model2 must reference Model1 to extend those elements. Selecting Package1 or the ApplicationSuite package would place Model2 in an existing package rather than an independent extension package, while ApplicationFoundation and ApplicationSuite do not contain the elements being extended.", "references": [{"title": "Models and packages - Finance & Operations | Dynamics 365 | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-tools/models"}]}]}, {"id": "4538e59b3d2d2c7af110a4f7779b48553612525c9887786fedae108bb7942572", "stem": "You have an OnlineDev unified developer environment (UDE) named Environment1.\n\nAn attempt to disable administration mode for Environment1 from the Power Platform admin center fails because a deployed package causes a metadata and schema validation issue.\n\nA corrected package that resolves the issue is available.\n\nYou need to restore normal developer access to Environment1.\n\nHow should you complete the recovery sequence? To answer, drag the appropriate actions to the correct steps. Each action may be used once or not at all. You may need to drag the split bar between panes or scroll to view content.\n\nNOTE: Each correct selection is worth one point.", "variants": [{"options": [{"text": "Step 1: Review environment history.", "correct": false}, {"text": "Step 1: Retry disabling administration mode.", "correct": false}, {"text": "Step 1: Run a full database synchronization.", "correct": false}, {"text": "Step 1: Provision a new UDE from an ERP template.", "correct": false}, {"text": "Step 1: Deploy the corrected package in administration mode.", "correct": true}, {"text": "Step 2: Review environment history.", "correct": false}, {"text": "Step 2: Retry disabling administration mode.", "correct": true}, {"text": "Step 2: Run a full database synchronization.", "correct": false}, {"text": "Step 2: Provision a new UDE from an ERP template.", "correct": false}, {"text": "Step 2: Deploy the corrected package in administration mode.", "correct": false}], "type": "ordering", "response_groups": [{"label": "Step 1", "choices": [{"text": "Review environment history."}, {"text": "Retry disabling administration mode."}, {"text": "Run a full database synchronization."}, {"text": "Provision a new UDE from an ERP template."}, {"text": "Deploy the corrected package in administration mode."}], "correct_choice": "Deploy the corrected package in administration mode."}, {"label": "Step 2", "choices": [{"text": "Review environment history."}, {"text": "Retry disabling administration mode."}, {"text": "Run a full database synchronization."}, {"text": "Provision a new UDE from an ERP template."}, {"text": "Deploy the corrected package in administration mode."}], "correct_choice": "Retry disabling administration mode."}], "explanation": "Objective: \n\n1.2 Implement application lifecycle management (ALM)\n\n \n\nWhat This Item Tests: \n\nManage Unified Developer Experience (UDE) developer environments in Power Platform admin center\n\n \n\nAdditional Reading: \n\nManage administration mode in a unified developer environment\n\n \n\nRationale: \n\nThe correct recovery sequence is to deploy the corrected package while Environment1 remains in administration mode and then retry disabling administration mode. An OnlineDev/UDE environment supports code-only package deployment while administration mode is enabled, and this recovery path automatically skips database synchronization. After the corrected package resolves the package or schema issue, disabling administration mode can be retried to restore normal access. Reviewing environment history provides information about the failed operation but does not correct the underlying issue, a full database synchronization is not part of this recovery path, and reprovisioning the environment is unnecessary.", "references": [{"title": "Manage administration mode in a unified developer environment", "url": "https://learn.microsoft.com/power-platform/developer/unified-experience/finance-operations-deploy-admin-mode"}]}]}, {"id": "0e961f5951209a1941a98ef9179ea45b9cb20d7f013431e1e776fab0d4134ad2", "stem": "You have a Dynamics 365 finance and operations app that contains tables named Table1 and Table2. Table1 contains a Closed field. The HeaderRecId field in Table2 references Table1, and the delete method on Table2 is overridden to create an audit record.\n\nYou need to set Closed to Yes for an existing Table1 record and delete its related Table2 records. An audit record must be created for each deleted record.\n\nHow should you complete the method? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.", "variants": [{"options": [{"text": "the first missing value: forUpdate", "correct": true}, {"text": "the first missing value: optimisticLock", "correct": false}, {"text": "the first missing value: pessimisticLock", "correct": false}, {"text": "the second missing value: table2.delete();", "correct": true}, {"text": "the second missing value: table2.doDelete();", "correct": false}, {"text": "the second missing value: table2.update();", "correct": false}], "type": "dropdown", "response_groups": [{"label": "the first missing value", "choices": [{"text": "forUpdate", "value": "1"}, {"text": "optimisticLock", "value": "2"}, {"text": "pessimisticLock", "value": "3"}], "correct_choice": "forUpdate"}, {"label": "the second missing value", "choices": [{"text": "table2.delete();", "value": "1"}, {"text": "table2.doDelete();", "value": "2"}, {"text": "table2.update();", "value": "3"}], "correct_choice": "table2.delete();"}], "explanation": "Objective: \n\n4.1 Develop X++ code\n\n \n\nWhat This Item Tests: \n\nCreate, read, update, and delete (CRUD) data\n\n \n\nAdditional Reading: \n\nX++ transactional integrity\nDelete data\n\n \n\nRationale: \n\nThe correct configuration selects Table1 by using forUpdate and deletes each Table2 record by calling delete(). The X++ for-update check requires a record to be selected for update before it can be updated or deleted, while optimisticLock and pessimisticLock control concurrency behavior but do not replace forUpdate. Calling delete() invokes the overridden Table2 delete method and creates the required audit record. Calling doDelete() bypasses the overridden delete logic, while update() modifies the record instead of deleting it.", "references": [{"title": "X++ transactional integrity", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-ref/xpp-data/xpp-transaction"}, {"title": "Delete data", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-ref/xpp-data/xpp-delete"}]}]}, {"id": "e31fec33bf7ebbec7a6c68fecff723ddc088a3b84b727182f7e9bec3f66c5a37", "stem": "You have an X++ class named Class1 in a model named Model1. An extension model named Model2 references Model1. You cannot modify Model1.\n\nYou need to add an instance method to Class1 in Model2 so that the method can be called on a Class1 object.\n\nHow should you complete the extension class declaration? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.", "variants": [{"options": [{"text": "the first missing value: [ExtensionOf(classStr(Class1))]", "correct": true}, {"text": "the first missing value: [ExtensionOf(tableStr(Class1))]", "correct": false}, {"text": "the first missing value: [FormDesignControlAttribute(\"Class1\")]", "correct": false}, {"text": "the first missing value: [SysObsoleteAttribute(\"Use Class1.\", false)]", "correct": false}, {"text": "the second missing value: abstract", "correct": false}, {"text": "the second missing value: final", "correct": true}, {"text": "the second missing value: private", "correct": false}, {"text": "the second missing value: public", "correct": false}], "type": "dropdown", "response_groups": [{"label": "the first missing value", "choices": [{"text": "[ExtensionOf(classStr(Class1))]", "value": "1"}, {"text": "[ExtensionOf(tableStr(Class1))]", "value": "2"}, {"text": "[FormDesignControlAttribute(\"Class1\")]", "value": "3"}, {"text": "[SysObsoleteAttribute(\"Use Class1.\", false)]", "value": "4"}], "correct_choice": "[ExtensionOf(classStr(Class1))]"}, {"label": "the second missing value", "choices": [{"text": "abstract", "value": "1"}, {"text": "final", "value": "2"}, {"text": "private", "value": "3"}, {"text": "public", "value": "4"}], "correct_choice": "final"}], "explanation": "Objective: \n\n3.3 Create classes and extend AOT elements\n\n \n\nWhat This Item Tests: \n\nAdd attributes or modifiers to a class\n\n \n\nAdditional Reading: \n\nClass extension model in X++\n\n \n\nRationale: \n\nThe correct configuration uses ExtensionOf(classStr(Class1)) and declares Class1_Extension as final. The ExtensionOf attribute identifies the artifact being augmented, and classStr specifies that Class1 is a class. X++ extension classes must be declared final because deriving from an extension class is not supported by the extension model. Using tableStr identifies a table rather than a class, while SysObsoleteAttribute and FormDesignControlAttribute do not declare a class extension. The abstract modifier does not meet the requirement for an extension class, while private and public do not replace the required final modifier.", "references": [{"title": "Class extension model in X++", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/class-extensions"}]}]}, {"id": "c28f123c72aee55fe99bf61fbe025976684a25dde7afa0061434d6cc29d7b2fe", "stem": "You have a Dynamics 365 finance and operations development environment that contains a Visual Studio test project. Test Explorer displays multiple X++ unit tests. The previous run included all tests. Three tests related to the current change are now highlighted.\n\nDevelopers currently build the solution and then start tests manually.\n\nYou need to configure the test workflow to meet the following requirements:\n\nValidate the three tests related to the current change without repeating the previous test scope.\n\nRemove the manual test-start step while preserving the build-then-test sequence.\n\nHow should you configure the test workflow? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.", "variants": [{"options": [{"text": "Current test action: Repeat Last Run", "correct": false}, {"text": "Current test action: Run All Tests", "correct": false}, {"text": "Current test action: Run Selected Tests", "correct": true}, {"text": "Build-cycle behavior: Create a playlist", "correct": false}, {"text": "Build-cycle behavior: Enable parallel test execution", "correct": false}, {"text": "Build-cycle behavior: Select Run Tests After Build", "correct": true}], "type": "dropdown", "response_groups": [{"label": "Current test action", "choices": [{"text": "Repeat Last Run", "value": "1"}, {"text": "Run All Tests", "value": "2"}, {"text": "Run Selected Tests", "value": "3"}], "correct_choice": "Run Selected Tests"}, {"label": "Build-cycle behavior", "choices": [{"text": "Create a playlist", "value": "1"}, {"text": "Enable parallel test execution", "value": "2"}, {"text": "Select Run Tests After Build", "value": "3"}], "correct_choice": "Select Run Tests After Build"}], "explanation": "Objective: \n\n4.4 Perform testing\n\n \n\nWhat This Item Tests: \n\nRun unit tests in Test Explorer\n\n \n\nAdditional Reading: \n\nRun unit tests by using Test Explorer\n\n \n\nRationale: \n\nThe correct configuration uses Run Selected Tests for the current validation and Run Tests After Build for subsequent execution. Run Selected Tests executes the tests currently highlighted in Test Explorer. Run All Tests executes all tests, while Repeat Last Run repeats the previous test run, which included all tests in this scenario. Run Tests After Build automatically starts unit tests after each local build. Creating a playlist organizes tests but does not automate execution after a build, while parallel test execution changes how eligible tests execute rather than what triggers the test run.", "references": [{"title": "Run unit tests by using Test Explorer", "url": "https://learn.microsoft.com/visualstudio/test/run-unit-tests-with-test-explorer"}]}]}, {"id": "eacfe3719d063b2a619086f9e94e8a9d4d090a6d078c9c1686c5c0ad6b2c8f5f", "stem": "You have a Dynamics 365 finance and operations app that contains an X++ method. The method uses a service class named Service1 to process queue positions.\n\nYou need to complete the method to meet the following requirements:\n\nSkip positions that are not eligible.\n\nStop after processing the requested number of eligible positions.\n\nWrite a summary after processing stops.\n\nHow should you complete the code? To answer, drag the appropriate statements to the correct targets. Each statement may be used once or not at all. You may need to drag the split bar between panes or scroll to view content.\n\nNOTE: Each correct selection is worth one point.", "variants": [{"options": [{"text": "the first missing value: break", "correct": false}, {"text": "the first missing value: continue", "correct": true}, {"text": "the first missing value: return", "correct": false}, {"text": "the first missing value: throw Exception::Error", "correct": false}, {"text": "the second missing value: break", "correct": true}, {"text": "the second missing value: continue", "correct": false}, {"text": "the second missing value: return", "correct": false}, {"text": "the second missing value: throw Exception::Error", "correct": false}], "type": "ordering", "response_groups": [{"label": "the first missing value", "choices": [{"text": "break"}, {"text": "continue"}, {"text": "return"}, {"text": "throw Exception::Error"}], "correct_choice": "continue"}, {"label": "the second missing value", "choices": [{"text": "break"}, {"text": "continue"}, {"text": "return"}, {"text": "throw Exception::Error"}], "correct_choice": "break"}], "explanation": "Objective: \n\n4.1 Develop X++ code\n\n \n\nWhat This Item Tests: \n\nImplement common structured programming constructs of X++\n\n \n\nAdditional Reading: \n\nX++ loop statements - Finance & Operations | Dynamics 365 | Microsoft Learn\n\n \n\nRationale: \n\nThe correct completion uses continue for an ineligible position and break after the requested number of eligible positions has been processed. In X++, continue moves execution to the next loop iteration, so the current position is skipped without ending the loop. break terminates the loop and execution continues with the summary statement after the loop. Using return would exit the method before the summary is written, while throwing an exception would also prevent normal execution from reaching the summary. Microsoft documents these continue and break behaviors for X++ loops.", "references": [{"title": "X++ loop statements - Finance & Operations | Dynamics 365 | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-ref/xpp-loops"}]}]}]</script><script>'use strict';
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).replace(/\s+/g,' ').trim();
const shuffle = a => {a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const KEY='mb500.studio.v1';
let storageOK=true;
function readStore(k, fallback){try{return JSON.parse(localStorage.getItem(k)) ?? fallback;}catch{return fallback;}}
let state=readStore(KEY,{stats:{},bookmarks:[],history:[],session:null});
state={stats:{},bookmarks:[],history:[],session:null,...state};
const seedBank=JSON.parse($('#seed').textContent);
let bank=mergePublishedBank(seedBank,readStore(KEY+'.bank',null));
let view='home', mode='practice', filter='all', formatFilter='all', lastMissed=[];
let libraryQuery='', libraryFilter='all', libraryFormat='all';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageOK=false;toast('Browser storage is unavailable. Keep this page open to retain this session.');}}
function askConfirm(message){
 const dialog=$('#confirm-dialog');
 if(dialog.open)return Promise.resolve(false);
 $('#confirm-message').textContent=message;
 return new Promise(resolve=>{dialog.returnValue='';dialog.addEventListener('close',()=>resolve(dialog.returnValue==='yes'),{once:true});dialog.showModal();$('#confirm-cancel').focus();});
}
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),4200);}
function stats(id){return state.stats[id]||{seen:0,correct:0,wrong:0,lastCorrect:null};}
function booked(id){return state.bookmarks.includes(id);}
function pool(kind,format='all'){return bank.filter(q=>matchesFormat(q,format)).filter(q=>kind==='missed'?stats(q.id).lastCorrect===false:kind==='unseen'?!stats(q.id).seen:kind==='bookmarks'?booked(q.id):true);}
function qById(id){return bank.find(q=>q.id===id);}
function status(q){const s=stats(q.id);return !s.seen?'Not practised':s.lastCorrect?'Last answer correct':'Needs review';}
function accuracy(){const s=Object.values(state.stats);const n=s.reduce((a,b)=>a+b.seen,0);return n?Math.round(100*s.reduce((a,b)=>a+b.correct,0)/n):0;}
function validURL(url){try{let u=new URL(url);return ['http:','https:'].includes(u.protocol)?u.href:null;}catch{return null;}}
function references(refs){return (refs||[]).map(r=>{const u=validURL(r.url);return u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(r.title||'Microsoft Learn reference')} <span aria-hidden="true">↗</span></a>`:'';}).join('');}
function paragraphs(text){return esc(text).split(/\n\s*\n/).map(t=>`<p>${t.replace(/\n/g,'<br>')}</p>`).join('');}
function setView(next){armedChoice=null;view=next;render();window.scrollTo({top:0,behavior:'instant'});}
function toggleBookmark(id){if(booked(id))state.bookmarks=state.bookmarks.filter(x=>x!==id);else state.bookmarks.push(id);save();render();}
function shell(){
 const answered=bank.filter(q=>stats(q.id).seen).length;
 $('#bank-count').textContent=bank.length;
 $('#sidebar-progress').textContent=`${answered} of ${bank.length} practised`;
 $('#sidebar-bar').style.width=`${answered/bank.length*100}%`;
 document.querySelectorAll('[data-view]').forEach(el=>{el.classList.toggle('active',el.dataset.view===view);if(el.dataset.view===view)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});
 $('#review-badge').textContent=pool('missed').length;
 $('#library-badge').textContent=bank.length;
}
function render(){shell();if(view==='home')renderHome();else if(view==='library')renderLibrary();else if(view==='history')renderHistory();else if(view==='review')renderReview();else if(view==='session')renderSession();else if(view==='results')renderResults();}
function title(kicker,heading,detail){return `<div class="page-heading"><div class="eyebrow">${kicker}</div><h1>${heading}</h1><p>${detail}</p></div>`;}
function renderHome(){
 const answered=bank.filter(q=>stats(q.id).seen).length, missed=pool('missed').length, available=pool(filter,formatFilter).length;
 const live=state.session&&!state.session.finished;
 $('#main').innerHTML=`<div class="topline"><span class="breadcrumb">Your learning workspace</span><span class="status-dot">Progress saved on this browser</span></div>
 <section class="hero"><div><div class="eyebrow">MICROSOFT DYNAMICS 365 · MB-500</div><h1>A little practice.<br>A lot more confidence.</h1><p>Your question bank, a clear explanation, and space to learn at your own pace.</p><div class="hero-meta"><span>Finance & Operations Apps Developer</span><span>Personal practice studio</span></div></div><div class="hero-art" aria-hidden="true"><div class="orbit o1"></div><div class="orbit o2"></div><div class="art-card c1"><span>01 / 50</span><div class="fake-line"></div><div class="fake-line short"></div><i>✓</i></div><div class="art-card c2">✦<span>One step closer</span></div></div></section>
 <div class="stat-grid"><div class="stat"><span>In your question bank</span><strong>${bank.length}<small>questions</small></strong><div class="stat-note">Duplicates counted once</div></div><div class="stat"><span>Questions practised</span><strong>${answered}<small>/ ${bank.length}</small></strong><div class="mini-track"><i style="width:${answered/bank.length*100}%"></i></div></div><div class="stat"><span>Answer accuracy</span><strong>${accuracy()}<small>%</small></strong><div class="stat-note">Across your checked answers</div></div><button class="stat stat-button" data-action="review"><span>Ready for another look</span><strong>${missed}<small>questions</small></strong><div class="stat-note">Review missed questions <b>↗</b></div></button></div>
 ${live?`<div class="resume-banner"><div><strong>You have a session in progress</strong><span>${state.session.mode==='exam'?'Exam':'Practice'} · ${state.session.items.filter(i=>i.checked).length} of ${state.session.items.length} checked</span></div><button class="button secondary" data-action="resume">Continue session <span>→</span></button></div>`:''}
 <section class="setup-panel"><div class="section-title"><div><div class="eyebrow">MAKE IT YOURS</div><h2>Choose your next session</h2></div><span class="subtle">A fresh shuffle every time</span></div><div class="mode-grid"><button class="mode-card ${mode==='practice'?'selected':''}" data-mode="practice" aria-pressed="${mode==='practice'}"><span class="mode-icon">◎</span><span><strong>Practice mode</strong><small>Check each answer and learn as you go.</small></span><i class="choice-dot"></i></button><button class="mode-card ${mode==='exam'?'selected':''}" data-mode="exam" aria-pressed="${mode==='exam'}"><span class="mode-icon">◷</span><span><strong>Exam mode</strong><small>See your score and explanations at the end.</small></span><i class="choice-dot"></i></button></div>
 <div class="settings-row ${mode==='exam'?'with-timer':''}"><label>Question source<select id="question-source"><option value="all">All questions</option><option value="unseen">Not yet practised</option><option value="missed">Missed questions</option><option value="bookmarks">Bookmarked</option></select></label><label>Question format<select id="question-format"><option value="all">All formats</option><option value="choice">Multiple choice</option><option value="dropdown">Dropdown (${pool('all','dropdown').length})</option><option value="ordering">Drag & drop (${pool('all','ordering').length})</option></select></label><label>Number of questions<input id="question-count" type="number" min="1" max="${Math.max(1,available)}" value="${Math.min(50,Math.max(1,available))}" inputmode="numeric"></label>${mode==='exam'?'<label>Time limit<select id="time-limit"><option value="60">60 minutes</option><option value="90">90 minutes</option><option value="120">120 minutes</option><option value="0">No time limit</option></select></label>':''}</div><div class="setup-footer"><span id="available-note">${available} questions available</span><button class="button primary" data-action="start" ${!available?'disabled':''}>Start ${mode==='exam'?'exam':'practising'} <span>→</span></button></div></section>
 <div class="bottom-note"><span>↗</span><p>A study companion built from your bank. This is an independent practice tool; use Microsoft Learn to verify material that looks unclear.</p></div>`;
 $('#question-format').value=formatFilter;
 $('#question-format').onchange=e=>{formatFilter=e.target.value;renderHome();};
 $('#question-source').value=filter;
 $('#question-source').onchange=e=>{filter=e.target.value;renderHome();};
}
function structured(item){return Array.isArray(item.groups)&&item.groups.length>0;}
function matchesFormat(q,format){return format==='all'||q.variants.some(v=>(v.type||'choice')===format||(format==='choice'&&!['dropdown','ordering'].includes(v.type)));}
function mergePublishedBank(seed,saved){
 const merged=new Map(seed.map(q=>[norm(q.stem),q]));
 for(const q of Array.isArray(saved)?saved:[]){const key=norm(q.stem),published=merged.get(key);if(!published){merged.set(key,q);continue;}if(!published.variants.some(v=>['dropdown','ordering'].includes(v.type)))merged.set(key,{...q,id:published.id});}
 return [...merged.values()];
}
function createItem(q,v){
 const item={id:q.id,stem:q.stem,type:v.type||'choice',options:shuffle(v.options.map((o,i)=>({...o,uid:i}))),explanation:v.explanation,references:v.references,selected:[],checked:false,recorded:false,flag:false};
 if(['dropdown','ordering'].includes(item.type)&&v.response_groups?.length){
  const unique=new Map();for(const g of v.response_groups)for(const c of g.choices)if(!unique.has(norm(c.text)))unique.set(norm(c.text),{uid:unique.size,text:c.text});
  item.responseChoices=shuffle([...unique.values()]);
  item.groups=v.response_groups.map((g,i)=>({gid:i,label:g.label,choiceIds:g.choices.map(c=>unique.get(norm(c.text)).uid),correctUid:unique.get(norm(g.correct_choice)).uid}));
  item.responses=item.groups.map(()=>null);
  item.allowReuse=/more than once/i.test(q.stem);
 }
 return item;
}
function isComplete(item){return structured(item)?item.groups.every((g,i)=>Number.isInteger(item.responses?.[i])&&g.choiceIds.includes(item.responses[i])):item.selected.length>0;}
function hasAnswer(item){return structured(item)?(item.responses||[]).some(v=>v!==null):item.selected.length>0;}
function responseChoice(item,uid){return item.responseChoices.find(c=>c.uid===uid);}
let armedChoice=null;
function setResponse(groupId,value){
 const item=current();if(item.checked||state.session.finished||!structured(item))return;
 const group=item.groups[groupId];if(!group)return;
 const uid=value===null?null:Number(value);if(uid!==null&&(!Number.isInteger(uid)||!group.choiceIds.includes(uid)))return;
 if(item.type==='ordering'&&!item.allowReuse&&uid!==null)item.responses=item.responses.map((v,i)=>i!==groupId&&v===uid?null:v);
 item.responses[groupId]=uid;armedChoice=null;save();renderSession();
}
function armChoice(uid){
 const item=current();if(item.checked||!responseChoice(item,uid))return;
 armedChoice=armedChoice===uid?null:uid;
 renderSession();const button=$(`[data-chip="${uid}"]`);button?.focus();
 if(armedChoice!==null)toast('Choice selected. Select a target to place it.');
}
function responseId(item,index){return 'response-'+item.id.slice(0,16).replace(/[^a-zA-Z0-9_-]/g,'')+'-'+index;}
function groupFeedback(item,group,index){
 const selected=item.responses?.[index],right=selected===group.correctUid;
 return `<div class="response-feedback ${right?'right':'wrong'}">${right?'✓ Correct':`${selected===null?'Unanswered. ':''}Correct answer: <strong>${esc(responseChoice(item,group.correctUid).text)}</strong>`}</div>`;
}
function responseControls(item,reveal=false){
 if(!structured(item))return choiceAnswerList(item,reveal);
 if(item.type==='dropdown')return `<div class="response-fields" role="group" aria-label="Dropdown answer area">${item.groups.map((g,i)=>`<div class="response-field ${reveal?(item.responses[i]===g.correctUid?'response-right':'response-wrong'):''}"><label for="${responseId(item,g.gid)}">${esc(g.label)}</label><select id="${responseId(item,g.gid)}" data-response-group="${i}" ${reveal?'disabled':''}><option value="" ${item.responses[i]===null?'selected':''}>Choose an answer…</option>${item.responseChoices.filter(c=>g.choiceIds.includes(c.uid)).map(c=>`<option value="${c.uid}" ${item.responses[i]===c.uid?'selected':''}>${esc(c.text)}</option>`).join('')}</select>${reveal?groupFeedback(item,g,i):''}</div>`).join('')}</div>`;
 const used=uid=>item.groups.filter((g,i)=>item.responses[i]===uid).map(g=>g.label);
 return `<div class="placement-layout"><section class="choice-bank" aria-label="Available choices"><div class="response-heading">Available choices</div><p class="response-help">${item.allowReuse?'Choices may be used more than once.':'Place each choice once, or leave it unused.'}</p><div class="drag-chips">${item.responseChoices.map(c=>`<button type="button" class="drag-chip ${armedChoice===c.uid?'armed':''} ${used(c.uid).length?'placed':''}" data-chip="${c.uid}" draggable="${!reveal}" ${reveal?'disabled':''} aria-pressed="${armedChoice===c.uid}" aria-label="Select choice: ${esc(c.text)}"><span class="grip" aria-hidden="true">⠿</span><span>${esc(c.text)}${used(c.uid).length?`<small>Placed in ${esc(used(c.uid).join(', '))}</small>`:''}</span></button>`).join('')}</div></section><section class="target-bank" aria-label="Answer targets"><div class="response-heading">Answer area</div><p class="response-help">Drag a choice here, or select a choice then a target.</p>${item.groups.map((g,i)=>{const c=responseChoice(item,item.responses[i]);return `<div class="drop-target ${c?'filled':''} ${reveal?(item.responses[i]===g.correctUid?'response-right':'response-wrong'):''}" data-drop-target="${i}"><div class="target-label">${esc(g.label)}</div><div class="target-controls"><button class="target-button" data-place-target="${i}" ${reveal?'disabled':''} aria-label="Place choice in ${esc(g.label)}${c?': '+esc(c.text):''}">${c?esc(c.text):'<span>Drop or place an answer here</span>'}</button>${c&&!reveal?`<button class="clear-target" data-clear-target="${i}" aria-label="Clear ${esc(g.label)}">×</button>`:''}</div>${reveal?groupFeedback(item,g,i):''}</div>`;}).join('')}</section></div>`;

function importBank(raw){
 if(!raw||typeof raw.bank!=='object'||Array.isArray(raw.bank)||raw.bank===null)throw Error('Choose a bank JSON file created by your collection script.');
 const questions=[],stems=new Set();
 for(const [id,q] of Object.entries(raw.bank)){
  if(!q||typeof q.question!=='string'||!Array.isArray(q.variants))continue;
  const stem=norm(q.question.replace(/^\s*\d{1,3}\s*\.\s*(?:\r?\n)+/,''));if(!stem||stems.has(stem))continue;
  const variants=[],seen=new Set();
  for(const v of q.variants){
   if(!Array.isArray(v.options)||typeof v.explanation!=='string')continue;
   const unique=new Map();for(const o of v.options)if(typeof o.text==='string'&&typeof o.correct==='boolean')unique.set(norm(o.text)+'|'+o.correct,{text:o.text,correct:o.correct});
   const options=[...unique.values()];if(options.length<2||!options.some(o=>o.correct))continue;
   const type=['dropdown','ordering'].includes(v.question_type||v.type)?(v.question_type||v.type):'choice';
   let groups=[];
   if(type!=='choice'){
    if(!Array.isArray(v.response_groups)||!v.response_groups.length)continue;
    groups=v.response_groups.map(g=>({label:g.label,correct_choice:g.correct_choice,choices:Array.isArray(g.choices)?g.choices.filter(c=>c&&typeof c.text==='string').map(c=>({text:c.text})):[]}));
    if(groups.some(g=>typeof g.label!=='string'||typeof g.correct_choice!=='string'||g.choices.length<2||!g.choices.some(c=>norm(c.text)===norm(g.correct_choice))))continue;
   }
   const sig=JSON.stringify({type,answers:options.map(o=>norm(o.text)+'|'+o.correct).sort()});if(seen.has(sig))continue;seen.add(sig);
   variants.push({options,type,response_groups:groups,explanation:v.explanation,references:Array.isArray(v.references)?v.references.filter(r=>r&&typeof r.url==='string'&&typeof r.title==='string'):[]});
  }
  if(variants.length){stems.add(stem);questions.push({id,stem:q.question.replace(/^\s*\d{1,3}\s*\.\s*(?:\r?\n)+/,''),variants});}
 }
 if(!questions.length)throw Error('No usable questions found in this bank.');return questions;
}

$('#progress-file').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.format!=='mb500-studio-progress'||!d.state||!Array.isArray(d.state.bookmarks)||!Array.isArray(d.state.history)||typeof d.state.stats!=='object')throw Error('Choose a progress backup exported by this app.');if(!await askConfirm('Replace the progress in this browser with this backup?'))return;state={stats:{},bookmarks:[],history:[],session:null,...d.state};save();setView('home');toast('Progress restored.');}catch(err){toast(err.message);}e.target.value='';};
document.addEventListener('click',e=>{if(Date.now()-lastPlacementDrag<350)return;const el=e.target.closest('button');if(!el||el.disabled)return;if(el.dataset.chip!==undefined){armChoice(Number(el.dataset.chip));return;}if(el.dataset.placeTarget!==undefined){if(armedChoice===null){toast('Select an available choice first, then select its target.');return;}setResponse(Number(el.dataset.placeTarget),armedChoice);return;}if(el.dataset.clearTarget!==undefined){setResponse(Number(el.dataset.clearTarget),null);return;}if(el.dataset.practiceId){begin([el.dataset.practiceId],'practice');return;}if(el.dataset.view){setView(el.dataset.view);return;}if(el.dataset.mode){mode=el.dataset.mode;renderHome();return;}if(el.dataset.choice!==undefined){choose(Number(el.dataset.choice));return;}if(el.dataset.jump!==undefined){armedChoice=null;state.session.index=Number(el.dataset.jump);save();renderSession();return;}if(el.dataset.book){toggleBookmark(el.dataset.book);return;}const action=el.dataset.action;if(!action)return;switch(action){case 'home':setView('home');break;case 'review':setView('review');break;case 'start':begin();break;case 'resume':setView('session');break;case 'check':checkAnswer();break;case 'next':armedChoice=null;state.session.index++;save();renderSession();window.scrollTo(0,0);break;case 'previous':armedChoice=null;state.session.index--;save();renderSession();window.scrollTo(0,0);break;case 'bookmark':toggleBookmark(current().id);break;case 'flag':current().flag=!current().flag;save();renderSession();break;case 'finish':finish();break;case 'retry':begin(lastMissed,'practice');break;case 'review-missed':begin(pool('missed').map(q=>q.id),'practice');break;case 'review-bookmarks':begin(pool('bookmarks').map(q=>q.id),'practice');break;case 'import':$('#bank-file').click();break;}});
document.addEventListener('keydown',e=>{if(view!=='session'||/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)||e.altKey||e.metaKey||e.ctrlKey)return;const i=current();if(/^[1-9]$/.test(e.key)&&!i.checked&&!structured(i)){const o=i.options[Number(e.key)-1];if(o){e.preventDefault();choose(o.uid);}}else if(e.key==='Enter'){e.preventDefault();if(state.session.mode==='practice'&&!i.checked)checkAnswer();else if(state.session.index<state.session.items.length-1){state.session.index++;save();renderSession();}else finish();}});
upgradeSession();
installResponseEvents();
render();
</script></body></html>
