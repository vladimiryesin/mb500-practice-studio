package uploaded by Task1 during the current pipeline run.\n\nHow should you configure the deployment task? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Task version: 2", "correct": false}, {"text": "Task version: 3", "correct": false}, {"text": "Task version: 4", "correct": true}, {"text": "Package identifier: Asset name of the uploaded package", "correct": false}, {"text": "Package identifier: FileAssetId output from Task1", "correct": true}, {"text": "Package identifier: Lifecycle Services environment ID for Environment1", "correct": false}, {"text": "Package identifier: Lifecycle Services project ID", "correct": false}], "type": "dropdown", "response_groups": [{"label": "Task version", "choices": [{"text": "2", "value": "1"}, {"text": "3", "value": "2"}, {"text": "4", "value": "3"}], "correct_choice": "4"}, {"label": "Package identifier", "choices": [{"text": "Asset name of the uploaded package", "value": "1"}, {"text": "FileAssetId output from Task1", "value": "2"}, {"text": "Lifecycle Services environment ID for Environment1", "value": "3"}, {"text": "Lifecycle Services project ID", "value": "4"}], "correct_choice": "FileAssetId output from Task1"}], "allow_reuse": false, "explanation": "Objective:\n\n1.2 Implement application lifecycle management (ALM)\n\nWhat This Item Tests:\n\nManage package deployments between environments\n\nAdditional Reading:\n\nDeploy assets by using Azure Pipelines\n\nRationale:\n\nThe correct configuration uses task version 4 and the FileAssetId output from Task1. Version 4.* is the minimum supported Dynamics Lifecycle Services Asset Deployment task version when the target includes a self-service environment, while versions 3.* and lower are obsolete. The deployment task requires the Lifecycle Services File Asset ID to identify the software deployable package, and this value can be obtained dynamically from a Dynamics Lifecycle Services Asset Upload task by using its FileAssetId output. The asset name does not provide the required file asset ID, while the environment ID identifies Environment1 and the project ID identifies the Lifecycle Services project rather than the package.", "references": [{"title": "Deploy assets by using Azure Pipelines", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/dev-tools/pipeline-deploy-asset"}]}]}, {"id": "3a9af1cc94c4a62b063bde126b8118f8e1a12012c81a950bd12ea9cac665d958", "stem": "You have a Dynamics 365 finance and operations app.\n\nYou plan to implement the following reports:\n\nReport1 produces customer documents for printing and email distribution.\n\nReport2 provides interactive sales analysis across large data volumes and supports drill-down.\n\nYou need to select the appropriate reporting datastore for each report.\n\nWhich datastore should you use for each report? To answer, drag the appropriate datastores to the correct reports. Each datastore may be used once or not at all. You may need to drag the split bar between panes or scroll to view content.\n\nNOTE: Each correct selection is worth one point.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Report1: Data warehouse", "correct": false}, {"text": "Report1: Financial reporting data mart", "correct": false}, {"text": "Report1: Transactional database", "correct": true}, {"text": "Report2: Data warehouse", "correct": true}, {"text": "Report2: Financial reporting data mart", "correct": false}, {"text": "Report2: Transactional database", "correct": false}], "type": "ordering", "response_groups": [{"label": "Report1", "choices": [{"text": "Data warehouse"}, {"text": "Financial reporting data mart"}, {"text": "Transactional database"}], "correct_choice": "Transactional database"}, {"label": "Report2", "choices": [{"text": "Data warehouse"}, {"text": "Financial reporting data mart"}, {"text": "Transactional database"}], "correct_choice": "Data warehouse"}], "allow_reuse": false, "explanation": "Objective:\n\n5.1 Select reporting tools in finance and operations apps\n\nWhat This Item Tests:\n\nDifferentiate among reporting datastores\n\nAdditional Reading:\n\nDocument Reporting Service in Dynamics 365 applications\n\nRationale:\n\nThe correct configuration uses a transactional database for Report1 and a data warehouse for Report2. Microsoft identifies transactional databases as the data source for document-generation scenarios such as printable or distributable business documents. BI and analytics scenarios that process larger data volumes and support interactive drill-down use a data warehouse. A Financial reporting data mart supports financial reporting scenarios and does not meet the requirements for customer document generation or general interactive sales analytics.", "references": [{"title": "Document Reporting Service in Dynamics 365 applications", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/analytics/reporting-experience-iias-environments"}]}]}, {"id": "aceb5c600b030aeb0cff78f8b684650f0686706900b102b46e490f029d4fb53a", "stem": "You have an external application named App1 that integrates with Dynamics 365 Finance. A data entity provides the current purchase order approval status. App1 submits receipt lines by using the batch data API.\n\nYou need to configure the integration to meet the following requirements:\n\nVerify the current approval status before allowing receipt posting.\n\nDetermine whether each receipt import ultimately succeeds or fails.\n\nHow should you configure the integration? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Status retrieval: Batch data API", "correct": false}, {"text": "Status retrieval: Business event", "correct": false}, {"text": "Status retrieval: OData", "correct": true}, {"text": "Import completion handling: Poll the import process for the result", "correct": true}, {"text": "Import completion handling: Use the successful scheduling response as the final result", "correct": false}, {"text": "Import completion handling: Keep the scheduling request open until processing completes", "correct": false}], "type": "dropdown", "response_groups": [{"label": "Status retrieval", "choices": [{"text": "Batch data API", "value": "1"}, {"text": "Business event", "value": "2"}, {"text": "OData", "value": "3"}], "correct_choice": "OData"}, {"label": "Import completion handling", "choices": [{"text": "Poll the import process for the result", "value": "1"}, {"text": "Use the successful scheduling response as the final result", "value": "2"}, {"text": "Keep the scheduling request open until processing completes", "value": "3"}], "correct_choice": "Poll the import process for the result"}], "allow_reuse": false, "explanation": "Objective:\n\n6.1 Evaluate data integration patterns and scenarios\n\nWhat This Item Tests:\n\nDifferentiate between synchronous and asynchronous patterns\n\nAdditional Reading:\n\nIntegration between finance and operations apps and third-party services\n\nRationale:\n\nThe correct configuration uses OData to retrieve the current approval status and polls the import process for the final batch result. OData is a synchronous integration pattern that is appropriate for retrieving current information from a public data entity when the result is needed before processing can continue. The batch data API is asynchronous: the initial response confirms that scheduling succeeded, but it does not indicate whether the import ultimately succeeded or failed. The caller must poll for the final result. A business event is an asynchronous notification pattern rather than a request-response lookup, and the scheduling request does not remain open until the batch import finishes.", "references": [{"title": "Integration between finance and operations apps and third-party services", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/data-entities/integration-overview"}]}]}, {"id": "ebee76497dcf12f0d894cc3cec794e8ce84295dcad8085c9cbae4b5410aaa63b", "stem": "You have a Dynamics 365 finance and operations app that contains an X++ correction script. The script receives a legal entity in _args.parm() and a record from that legal entity in _args.record(). The script can run in a different legal entity.\n\nYou need to complete the script to meet the following requirements:\n\nPrevent the update when the current legal entity differs from the requested legal entity.\n\nWrite separate informational Infolog entries for the completed update and completed script.\n\nHow should you complete the script? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.", "question_code": "public static void main(Args _args)\n{\n    DataAreaId company = _args.parm();\n    Table1 record1 = _args.record();\n\n    if ([first missing value] != company)\n    {\n        throw error(\"Invalid legal entity.\");\n    }\n\n    ttsbegin;\n    record1.selectForUpdate(true);\n    record1.Processed = NoYes::Yes;\n    record1.update();\n    ttscommit;\n\n    [completion message statements];\n}", "question_table": null, "variants": [{"options": [{"text": "the first missing value: company", "correct": false}, {"text": "the first missing value: curExt()", "correct": true}, {"text": "the first missing value: record1.DataAreaId", "correct": false}, {"text": "the second missing value: error(\"Update completed.\"); info(\"Script completed.\");", "correct": false}, {"text": "the second missing value: info(\"Update completed.\"); error(\"Script completed.\");", "correct": false}, {"text": "the second missing value: info(\"Update completed.\"); info(\"Script completed.\");", "correct": true}], "type": "dropdown", "response_groups": [{"label": "the first missing value", "choices": [{"text": "company", "value": "1"}, {"text": "curExt()", "value": "2"}, {"text": "record1.DataAreaId", "value": "3"}], "correct_choice": "curExt()"}, {"label": "the second missing value", "choices": [{"text": "error(\"Update completed.\"); info(\"Script completed.\");", "value": "1"}, {"text": "info(\"Update completed.\"); error(\"Script completed.\");", "value": "2"}, {"text": "info(\"Update completed.\"); info(\"Script completed.\");", "value": "3"}], "correct_choice": "info(\"Update completed.\"); info(\"Script completed.\");"}], "allow_reuse": false, "explanation": "Objective:\n\n4.1 Develop X++ code\n\nWhat This Item Tests:\n\nImplement global functions in X++\n\nAdditional Reading:\n\nRun custom X++ scripts with zero downtime — Code example\n\nRationale:\n\nThe correct configuration compares curExt() to company and writes both completion messages by using info(). The curExt() function returns the current legal entity, so it detects when the script is running in a different legal entity from the requested one. Comparing company to itself cannot detect an incorrect execution context, while checking record1.DataAreaId verifies the record’s legal entity rather than the current legal entity. The info() function creates informational Infolog entries, while error() creates error entries and does not meet the requirement.", "references": [{"title": "Run custom X++ scripts with zero downtime — Code example", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/deployment/run-custom-scripts"}]}]}, {"id": "962c7bb4347e0ed2d921a4ebce4b89a4bebe2e27cbc134c713b69618ea7425ef", "stem": "You have an ISV package named Package1. Package1 contains a model named Model1. Model1 contains a table named Table1 and a form named Form1.\n\nYou need to create an extension model named Model2 that meets the following requirements:\n\nAdd a field to Table1 and a control to Form1.\n\nAllow Package1 to be updated independently of the extensions.\n\nOther required model references are already selected.\n\nHow should you configure Model2? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Package selection: ApplicationSuite package", "correct": false}, {"text": "Package selection: Create a new package", "correct": true}, {"text": "Package selection: Package1", "correct": false}, {"text": "Referenced model: ApplicationFoundation", "correct": false}, {"text": "Referenced model: ApplicationSuite", "correct": false}, {"text": "Referenced model: Model1", "correct": true}], "type": "dropdown", "response_groups": [{"label": "Package selection", "choices": [{"text": "ApplicationSuite package", "value": "1"}, {"text": "Create a new package", "value": "2"}, {"text": "Package1", "value": "3"}], "correct_choice": "Create a new package"}, {"label": "Referenced model", "choices": [{"text": "ApplicationFoundation", "value": "1"}, {"text": "ApplicationSuite", "value": "2"}, {"text": "Model1", "value": "3"}], "correct_choice": "Model1"}], "allow_reuse": false, "explanation": "Objective:\n\n2.1 Customize finance and operations apps by using Visual Studio\n\nWhat This Item Tests:\n\nCreate and manage extension models\n\nAdditional Reading:\n\nModels and packages - Finance & Operations | Dynamics 365 | Microsoft Learn\n\nRationale:\n\nThe correct configuration is to create a new package for Model2 and reference Model1. A model deployed in its own package can extend metadata and business logic in referenced models while remaining separate from the source package, which supports independent servicing and upgrades. Because Table1 and Form1 belong to Model1, Model2 must reference Model1 to extend those elements. Selecting Package1 or the ApplicationSuite package would place Model2 in an existing package rather than an independent extension package, while ApplicationFoundation and ApplicationSuite do not contain the elements being extended.", "references": [{"title": "Models and packages - Finance & Operations | Dynamics 365 | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-tools/models"}]}]}, {"id": "4538e59b3d2d2c7af110a4f7779b48553612525c9887786fedae108bb7942572", "stem": "You have an OnlineDev unified developer environment (UDE) named Environment1.\n\nAn attempt to disable administration mode for Environment1 from the Power Platform admin center fails because a deployed package causes a metadata and schema validation issue.\n\nA corrected package that resolves the issue is available.\n\nYou need to restore normal developer access to Environment1.\n\nHow should you complete the recovery sequence? To answer, drag the appropriate actions to the correct steps. Each action may be used once or not at all. You may need to drag the split bar between panes or scroll to view content.\n\nNOTE: Each correct selection is worth one point.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Step 1: Review environment history.", "correct": false}, {"text": "Step 1: Retry disabling administration mode.", "correct": false}, {"text": "Step 1: Run a full database synchronization.", "correct": false}, {"text": "Step 1: Provision a new UDE from an ERP template.", "correct": false}, {"text": "Step 1: Deploy the corrected package in administration mode.", "correct": true}, {"text": "Step 2: Review environment history.", "correct": false}, {"text": "Step 2: Retry disabling administration mode.", "correct": true}, {"text": "Step 2: Run a full database synchronization.", "correct": false}, {"text": "Step 2: Provision a new UDE from an ERP template.", "correct": false}, {"text": "Step 2: Deploy the corrected package in administration mode.", "correct": false}], "type": "ordering", "response_groups": [{"label": "Step 1", "choices": [{"text": "Review environment history."}, {"text": "Retry disabling administration mode."}, {"text": "Run a full database synchronization."}, {"text": "Provision a new UDE from an ERP template."}, {"text": "Deploy the corrected package in administration mode."}], "correct_choice": "Deploy the corrected package in administration mode."}, {"label": "Step 2", "choices": [{"text": "Review environment history."}, {"text": "Retry disabling administration mode."}, {"text": "Run a full database synchronization."}, {"text": "Provision a new UDE from an ERP template."}, {"text": "Deploy the corrected package in administration mode."}], "correct_choice": "Retry disabling administration mode."}], "allow_reuse": false, "explanation": "Objective:\n\n1.2 Implement application lifecycle management (ALM)\n\nWhat This Item Tests:\n\nManage Unified Developer Experience (UDE) developer environments in Power Platform admin center\n\nAdditional Reading:\n\nManage administration mode in a unified developer environment\n\nRationale:\n\nThe correct recovery sequence is to deploy the corrected package while Environment1 remains in administration mode and then retry disabling administration mode. An OnlineDev/UDE environment supports code-only package deployment while administration mode is enabled, and this recovery path automatically skips database synchronization. After the corrected package resolves the package or schema issue, disabling administration mode can be retried to restore normal access. Reviewing environment history provides information about the failed operation but does not correct the underlying issue, a full database synchronization is not part of this recovery path, and reprovisioning the environment is unnecessary.", "references": [{"title": "Manage administration mode in a unified developer environment", "url": "https://learn.microsoft.com/power-platform/developer/unified-experience/finance-operations-deploy-admin-mode"}]}]}, {"id": "0e961f5951209a1941a98ef9179ea45b9cb20d7f013431e1e776fab0d4134ad2", "stem": "You have a Dynamics 365 finance and operations app that contains tables named Table1 and Table2. Table1 contains a Closed field. The HeaderRecId field in Table2 references Table1, and the delete method on Table2 is overridden to create an audit record.\n\nYou need to set Closed to Yes for an existing Table1 record and delete its related Table2 records. An audit record must be created for each deleted record.\n\nHow should you complete the method? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.", "question_code": "public static void closeRecord(RecId _recId)\n{\n    Table1 table1;\n    Table2 table2;\n\n    ttsbegin;\n    select firstOnly table1\n        where table1.RecId == _recId;\n\n    table1.Closed = NoYes::Yes;\n    table1.update();\n\n    while select [first missing value] table2\n        where table2.HeaderRecId == table1.RecId\n    {\n        [second missing value]\n    }\n    ttscommit;\n}", "question_table": null, "variants": [{"options": [{"text": "the first missing value: forUpdate", "correct": true}, {"text": "the first missing value: optimisticLock", "correct": false}, {"text": "the first missing value: pessimisticLock", "correct": false}, {"text": "the second missing value: table2.delete();", "correct": true}, {"text": "the second missing value: table2.doDelete();", "correct": false}, {"text": "the second missing value: table2.update();", "correct": false}], "type": "dropdown", "response_groups": [{"label": "the first missing value", "choices": [{"text": "forUpdate", "value": "1"}, {"text": "optimisticLock", "value": "2"}, {"text": "pessimisticLock", "value": "3"}], "correct_choice": "forUpdate"}, {"label": "the second missing value", "choices": [{"text": "table2.delete();", "value": "1"}, {"text": "table2.doDelete();", "value": "2"}, {"text": "table2.update();", "value": "3"}], "correct_choice": "table2.delete();"}], "allow_reuse": false, "explanation": "Objective:\n\n4.1 Develop X++ code\n\nWhat This Item Tests:\n\nCreate, read, update, and delete (CRUD) data\n\nAdditional Reading:\n\nX++ transactional integrity Delete data\n\nRationale:\n\nThe correct configuration selects Table1 by using forUpdate and deletes each Table2 record by calling delete(). The X++ for-update check requires a record to be selected for update before it can be updated or deleted, while optimisticLock and pessimisticLock control concurrency behavior but do not replace forUpdate. Calling delete() invokes the overridden Table2 delete method and creates the required audit record. Calling doDelete() bypasses the overridden delete logic, while update() modifies the record instead of deleting it.", "references": [{"title": "X++ transactional integrity", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-ref/xpp-data/xpp-transaction"}, {"title": "Delete data", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-ref/xpp-data/xpp-delete"}]}]}, {"id": "e31fec33bf7ebbec7a6c68fecff723ddc088a3b84b727182f7e9bec3f66c5a37", "stem": "You have an X++ class named Class1 in a model named Model1. An extension model named Model2 references Model1. You cannot modify Model1.\n\nYou need to add an instance method to Class1 in Model2 so that the method can be called on a Class1 object.\n\nHow should you complete the extension class declaration? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.", "question_code": "[first missing value]\n[second missing value] class Class1_Extension\n{\n    public real applyFactor(real _value)\n    {\n        return _value * 1.05;\n    }\n}", "question_table": null, "variants": [{"options": [{"text": "the first missing value: [ExtensionOf(classStr(Class1))]", "correct": true}, {"text": "the first missing value: [ExtensionOf(tableStr(Class1))]", "correct": false}, {"text": "the first missing value: [FormDesignControlAttribute(\"Class1\")]", "correct": false}, {"text": "the first missing value: [SysObsoleteAttribute(\"Use Class1.\", false)]", "correct": false}, {"text": "the second missing value: abstract", "correct": false}, {"text": "the second missing value: final", "correct": true}, {"text": "the second missing value: private", "correct": false}, {"text": "the second missing value: public", "correct": false}], "type": "dropdown", "response_groups": [{"label": "the first missing value", "choices": [{"text": "[ExtensionOf(classStr(Class1))]", "value": "1"}, {"text": "[ExtensionOf(tableStr(Class1))]", "value": "2"}, {"text": "[FormDesignControlAttribute(\"Class1\")]", "value": "3"}, {"text": "[SysObsoleteAttribute(\"Use Class1.\", false)]", "value": "4"}], "correct_choice": "[ExtensionOf(classStr(Class1))]"}, {"label": "the second missing value", "choices": [{"text": "abstract", "value": "1"}, {"text": "final", "value": "2"}, {"text": "private", "value": "3"}, {"text": "public", "value": "4"}], "correct_choice": "final"}], "allow_reuse": false, "explanation": "Objective:\n\n3.3 Create classes and extend AOT elements\n\nWhat This Item Tests:\n\nAdd attributes or modifiers to a class\n\nAdditional Reading:\n\nClass extension model in X++\n\nRationale:\n\nThe correct configuration uses ExtensionOf(classStr(Class1)) and declares Class1_Extension as final. The ExtensionOf attribute identifies the artifact being augmented, and classStr specifies that Class1 is a class. X++ extension classes must be declared final because deriving from an extension class is not supported by the extension model. Using tableStr identifies a table rather than a class, while SysObsoleteAttribute and FormDesignControlAttribute do not declare a class extension. The abstract modifier does not meet the requirement for an extension class, while private and public do not replace the required final modifier.", "references": [{"title": "Class extension model in X++", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/class-extensions"}]}]}, {"id": "c28f123c72aee55fe99bf61fbe025976684a25dde7afa0061434d6cc29d7b2fe", "stem": "You have a Dynamics 365 finance and operations development environment that contains a Visual Studio test project. Test Explorer displays multiple X++ unit tests. The previous run included all tests. Three tests related to the current change are now highlighted.\n\nDevelopers currently build the solution and then start tests manually.\n\nYou need to configure the test workflow to meet the following requirements:\n\nValidate the three tests related to the current change without repeating the previous test scope.\n\nRemove the manual test-start step while preserving the build-then-test sequence.\n\nHow should you configure the test workflow? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Current test action: Repeat Last Run", "correct": false}, {"text": "Current test action: Run All Tests", "correct": false}, {"text": "Current test action: Run Selected Tests", "correct": true}, {"text": "Build-cycle behavior: Create a playlist", "correct": false}, {"text": "Build-cycle behavior: Enable parallel test execution", "correct": false}, {"text": "Build-cycle behavior: Select Run Tests After Build", "correct": true}], "type": "dropdown", "response_groups": [{"label": "Current test action", "choices": [{"text": "Repeat Last Run", "value": "1"}, {"text": "Run All Tests", "value": "2"}, {"text": "Run Selected Tests", "value": "3"}], "correct_choice": "Run Selected Tests"}, {"label": "Build-cycle behavior", "choices": [{"text": "Create a playlist", "value": "1"}, {"text": "Enable parallel test execution", "value": "2"}, {"text": "Select Run Tests After Build", "value": "3"}], "correct_choice": "Select Run Tests After Build"}], "allow_reuse": false, "explanation": "Objective:\n\n4.4 Perform testing\n\nWhat This Item Tests:\n\nRun unit tests in Test Explorer\n\nAdditional Reading:\n\nRun unit tests by using Test Explorer\n\nRationale:\n\nThe correct configuration uses Run Selected Tests for the current validation and Run Tests After Build for subsequent execution. Run Selected Tests executes the tests currently highlighted in Test Explorer. Run All Tests executes all tests, while Repeat Last Run repeats the previous test run, which included all tests in this scenario. Run Tests After Build automatically starts unit tests after each local build. Creating a playlist organizes tests but does not automate execution after a build, while parallel test execution changes how eligible tests execute rather than what triggers the test run.", "references": [{"title": "Run unit tests by using Test Explorer", "url": "https://learn.microsoft.com/visualstudio/test/run-unit-tests-with-test-explorer"}]}]}, {"id": "eacfe3719d063b2a619086f9e94e8a9d4d090a6d078c9c1686c5c0ad6b2c8f5f", "stem": "You have a Dynamics 365 finance and operations app that contains an X++ method. The method uses a service class named Service1 to process queue positions.\n\nYou need to complete the method to meet the following requirements:\n\nSkip positions that are not eligible.\n\nStop after processing the requested number of eligible positions.\n\nWrite a summary after processing stops.\n\nHow should you complete the code? To answer, drag the appropriate statements to the correct targets. Each statement may be used once or not at all. You may need to drag the split bar between panes or scroll to view content.\n\nNOTE: Each correct selection is worth one point.", "question_code": "public static void run(int _maxCompleted)\n{\n    int position;\n    int completed = 0;\n\n    for (position = 1; position \u003c= 20; position++)\n    {\n        if (!Service1::isEligible(position))\n        {\n            [first missing value];\n        }\n\n        Service1::process(position);\n        completed++;\n\n        if (completed >= _maxCompleted)\n        {\n            [second missing value];\n        }\n    }\n\n    // The summary statement follows the loop.\n}", "question_table": null, "variants": [{"options": [{"text": "the first missing value: break", "correct": false}, {"text": "the first missing value: continue", "correct": true}, {"text": "the first missing value: return", "correct": false}, {"text": "the first missing value: throw Exception::Error", "correct": false}, {"text": "the second missing value: break", "correct": true}, {"text": "the second missing value: continue", "correct": false}, {"text": "the second missing value: return", "correct": false}, {"text": "the second missing value: throw Exception::Error", "correct": false}], "type": "ordering", "response_groups": [{"label": "the first missing value", "choices": [{"text": "break"}, {"text": "continue"}, {"text": "return"}, {"text": "throw Exception::Error"}], "correct_choice": "continue"}, {"label": "the second missing value", "choices": [{"text": "break"}, {"text": "continue"}, {"text": "return"}, {"text": "throw Exception::Error"}], "correct_choice": "break"}], "allow_reuse": false, "explanation": "Objective:\n\n4.1 Develop X++ code\n\nWhat This Item Tests:\n\nImplement common structured programming constructs of X++\n\nAdditional Reading:\n\nX++ loop statements - Finance & Operations | Dynamics 365 | Microsoft Learn\n\nRationale:\n\nThe correct completion uses continue for an ineligible position and break after the requested number of eligible positions has been processed. In X++, continue moves execution to the next loop iteration, so the current position is skipped without ending the loop. break terminates the loop and execution continues with the summary statement after the loop. Using return would exit the method before the summary is written, while throwing an exception would also prevent normal execution from reaching the summary. Microsoft documents these continue and break behaviors for X++ loops.", "references": [{"title": "X++ loop statements - Finance & Operations | Dynamics 365 | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-ref/xpp-loops"}]}]}]</script><script id="measureup-seed" type="application/json">[{"id": "measureup-d01f96b05502754b838d9da44e1c29ea3d0cbf2bf4582773adb8886593e7a621", "stem": "You are a Dynamics 365 developer. You write the following X++ method in a class in Visual Studio:\n\n{{question_code}}\n\nYou need to know what message will be displayed at the user interface in Dynamics 365 after you execute this method.\n\nWhich message will be displayed?", "question_code": "public void scopeMethod()\n{\n    int i = 4;\n    int j = 0;\n\n    try\n    {\n        i++;\n        i = i / j;\n        j++;\n    }\n    catch\n    {\n        j = i;\n        i = i + 1;\n    }\n    finally\n    {\n        i = 0;\n        j = 0;\n    }\n\n    info(strFmt(\"i value %1, j value %2\", i, j));\n}", "question_table": null, "variants": [{"options": [{"text": "i value 5, j value 0", "correct": false}, {"text": "i value 0, j value 0", "correct": true}, {"text": "i value 6, j value 5", "correct": false}, {"text": "i value 6, j value 6", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "", "references": []}]}, {"id": "measureup-9f22e53f161e1d7de57dac10973d00664cd6623373a73e751a55ffdf35e130fa", "stem": "You work as a Dynamics 365 Finance and Operations developer. You use Extensible data security framework (XDS) to restrict access to records in the\nCustTable based on the CustGroup.\nYou have created a query named custXDSCustGroupQuery with the datasource CustGroup. You then add a datasource range for the field Groupld to\nonly select the value 'EU' (Customer groups with group = 'EU')\nYou need to create a Security Policy named 'custGroupPolicy'.\nWhich properties should you set on the Security Policy? To answer, select the appropriate options from the drop-down menus.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Yes", "correct": true}, {"text": "No", "correct": false}, {"text": "CustTable", "correct": false}, {"text": "CustGroup", "correct": true}, {"text": "custXDSCustGroupQuery", "correct": true}, {"text": "custXDSCustTableQuery", "correct": false}], "type": "dropdown", "response_groups": [{"label": "Constrained Table", "correct_choice": "Yes", "choices": [{"text": "Yes"}, {"text": "No"}]}, {"label": "Primary Table", "correct_choice": "CustGroup", "choices": [{"text": "CustTable"}, {"text": "CustGroup"}]}, {"label": "Query", "correct_choice": "custXDSCustGroupQuery", "choices": [{"text": "custXDSCustGroupQuery"}, {"text": "custXDSCustTableQuery"}]}], "allow_reuse": false, "explanation": "", "references": []}]}, {"id": "measureup-cdbe0cd00d61ec1e9877b276c47b722ca5850ba40704b2c84689d323c50e6824", "stem": "You are a Microsoft Dynamics 365 Finance and Supply Chain Management developer. You have a set of requirements to customize an existing table\nusing a table extension.\nYou need to identify which requirements can be achieved using a table extension.\nWhich three requirements should you identify? Each correct answer presents a complete solution.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Modifying an existent relationship to add an extra related field in the table extension.", "correct": false}, {"text": "Adding a relationship with another table in the table extension.", "correct": true}, {"text": "Modifying the cluster index of the table.", "correct": false}, {"text": "Adding new fields in the table extension.", "correct": true}, {"text": "Modifying the Title Field1 and the Title Field2 in the table extension.", "correct": true}, {"text": "Deleting a field from the original table in the table extension.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "", "references": []}]}, {"id": "measureup-c791a955772ad4a216b1f7e6f7f7b2454e4108e72d067e82cc863911dc1f3247", "stem": "You work as a Dynamics 365 Finance and Operations Developer and you are looking at the different concurrency models.\nYou need to explain the performance advantages for the Optimistic Concurrency Control (OCC) model compared to the Pessimistic one.\nWhich three performance advantages should you select? Each correct answer presents a complete solution.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Locks all the records selected for update.", "correct": false}, {"text": "Can lead to a deadlock into the database.", "correct": false}, {"text": "Locks only records as they are being updated.", "correct": true}, {"text": "Locks for a shorter time.", "correct": true}, {"text": "Records can be used and updated by other users while they are selected and not yet updated.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "", "references": []}]}, {"id": "measureup-e55d0cdefeb06d725fbf653819b3e853b093a3ad59ad2d7547060f98b703fcfc", "stem": "You work as a Dynamics 365 Finance and Operations developer and create a new Customer report. You create a new output menu item for the report\nand add it to the Accounts Receivable menu.\nYou need to configure security for the new output menu item.\nWhich two actions should you perform? Each correct answer presents a complete solution.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create a new role for the new output menu item.", "correct": false}, {"text": "Create a new privilege, add a reference to the new output menu item, create a new duty, and add the duty to a role extension.", "correct": true}, {"text": "Create a new privilege, add a reference to the new output menu item, and add the privilege to a duty extension.", "correct": true}, {"text": "Create a new privilege, add a reference to the new output menu item, and add the privilege to a role extension.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "", "references": []}]}, {"id": "measureup-bf3da56e694678943c7383a913da539424a98aa3d8cb8311e2d1fbf73b3a018b", "stem": "You are a Dynamics 365 Finance developer. You are developing a new model for Dynamics 365 called Investment. The table named INVCustNotes is\npart of your model and it has a relation with the table named Cust Table. The INVCustNotes table is used to store additional information about\ncustomers. You realized that when customers are deleted from the database, the related extra information stored in the table INVCustNotes remains\nin the database with a relation that no longer exists.\nYou need to configure the model so that when a customer is deleted, its related information in the table INVCustNotes is also deleted.\nWhich two actions should you perform to meet the requirements? Each correct answer presents a complete solution.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create an extension on the delete method at the Cust Table table.", "correct": true}, {"text": "Set the DeleteAction property to Restricted on the CusTable table.", "correct": false}, {"text": "Set the DeleteAction property to Cascade on the CustTable table.", "correct": true}, {"text": "Set the DeleteAction property to Cascade on the INVCustNotes table.", "correct": false}, {"text": "Create an extension on the delete method at the INVCust Table table.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "", "references": []}]}, {"id": "measureup-94659cf70e0d50d96be48c31eb302d36c333da993e83d946bd21f5d3f0f72a9a", "stem": "You are a Dynamics 365 Finance developer. You have a development environment using Visual Studio. You are working on a Finance and Operations\n(FinOps) Visual Studio project in order to extend the functionality such as flow of revenue and inventory with an external hospital management\nsystem. You have another .NET library pr function structured(item){return Array.isArray(item.groups)&&item.groups.length>0;}

 for(const q of Array.isArray(saved)?saved:[]){const stem=cleanQuestionStem(q.stem),key=norm(stem),published=merged.get(key);if(!published){merged.set(key,{...q,stem});continue;}if(!published.variants.some(v=>['dropdown','ordering'].includes(v.type)))merged.set(key,{...q,id:published.id,stem});}

function questionPrompt(item,code,reveal=false){

function makeItem(q){return createItem(q,q.variants[Math.floor(Math.random()*q.variants.length)]);}
function prioritizeSessionQuestions(items){
 return shuffle(items).sort((a,b)=>{
  const aStats=stats(a.id),bStats=stats(b.id);
  const tier=s=>!s.seen?0:(s.wrong>0&&!s.correct)?1:2;
  const priority=tier(aStats)-tier(bStats);
  if(priority)return priority;
  return tier(aStats)===2?(bStats.wrong||0)-(aStats.wrong||0):0;
 });
}
async function begin(ids=null, selectedMode=mode){
 if(state.session&&!state.session.finished&&!await askConfirm('Replace your current session? Answers already checked remain in your progress.'))return;
 const source=ids?bank.filter(q=>ids.includes(q.id)):pool(filter,formatFilter);
 const n=ids?source.length:Number($('#question-count')?.value||50);
 if(!Number.isInteger(n)||n<1||n>source.length){toast(`Choose a number from 1 to ${source.length}.`);return;}
 const minutes=selectedMode==='exam'?Number($('#time-limit')?.value||0):0;
 const ordered=questionOrder==='bank'?[...source]:(ids?shuffle(source):prioritizeSessionQuestions(source));
 state.session={mode:selectedMode,bankId:selectedBank,items:ordered.slice(0,n).map(makeItem),index:0,started:Date.now(),deadline:minutes?Date.now()+minutes*60000:null,finished:false};
 save();setView('session');
}
function isRight(item){if(structured(item))return item.groups.every((g,i)=>item.responses?.[i]===g.correctUid);const right=item.options.filter(o=>o.correct).map(o=>o.uid);return right.length===item.selected.length&&right.every(id=>item.selected.includes(id));}
function record(item){if(item.recorded)return;const s=stats(item.id);s.seen++;if(isRight(item))s.correct++;else s.wrong++;s.lastCorrect=isRight(item);s.lastSeen=Date.now();state.stats[item.id]=s;if(hasAnswer(item))addPracticePoint();item.recorded=true;}
function current(){return state.session.items[state.session.index];}
function choose(uid){const s=state.session,i=current();if(i.checked||s.finished)return;const multi=i.options.filter(o=>o.correct).length>1;if(multi){i.selected=i.selected.includes(uid)?i.selected.filter(x=>x!==uid):[...i.selected,uid];}else i.selected=[uid];save();renderSession();}
function checkAnswer(){const item=current();if(!isComplete(item)){toast(structured(item)?'Fill in every answer field first.':'Choose an answer first.');return;}item.checked=true;record(item);save();window.dispatchEvent(new Event('practice-cloud-save-requested'));shell();renderSession();toast('10 XP earned. Keep your learning streak going!');}
async function finish(force=false){const s=state.session;if(!s||s.finished)return;const unanswered=s.items.filter(i=>!isComplete(i)).length;if(!force&&!await askConfirm(`Finish this session${unanswered?` with ${unanswered} unanswered question${unanswered===1?'':'s'}`:''}?`))return;if(s.finished)return;
 s.items.forEach(i=>{i.checked=true;record(i);});s.finished=true;s.ended=Date.now();s.score=s.items.filter(isRight).length;s.elapsed=Math.round((s.ended-s.started)/1000);state.history.unshift({at:s.ended,total:s.items.length,correct:s.score,mode:s.mode,elapsed:s.elapsed,missed:s.items.filter(i=>!isRight(i)).map(i=>i.id)});state.history=state.history.slice(0,50);save();setView('results');}
function explanation(item){return `<section class="explanation"><div class="explanation-label"><span>✧</span> Why this answer?</div><div class="explanation-text">${paragraphs(item.explanation)}</div>${references(item.references)?`<div class="reference-links">${references(item.references)}</div>`:''}</section>`;}
function choiceAnswerList(item,reveal=false){const multi=item.options.filter(o=>o.correct).length>1,codeOptions=item.options.some(o=>o.text.includes('\n')&&/[{};]/.test(o.text));return `<div class="answer-list" role="group" aria-label="Answer choices">${item.options.map((o,j)=>{const selected=item.selected.includes(o.uid);const tone=reveal?(o.correct?'correct':selected?'incorrect':'muted'):selected?'chosen':'';return `<button class="answer ${tone}" data-choice="${o.uid}" ${reveal?'disabled':''} aria-pressed="${selected}"><span class="answer-marker ${multi?'square':''}">${reveal&&o.correct?'✓':reveal&&selected?'×':selected?'●':String.fromCharCode(65+j)}</span><span class="answer-text ${codeOptions?'code-option':''}">${esc(o.text)}</span>${reveal&&o.correct?'<span class="answer-label">Correct</span>':''}</button>`;}).join('')}</div>`;}
function renderSession(){const s=state.session;if(!s){setView('home');return;}if(s.finished){setView('results');return;}const item=current(),questionCode=item.questionCode||qById(item.id)?.question_code||'',index=s.index,checked=s.items.filter(i=>i.checked).length,multi=item.options.filter(o=>o.correct).length>1;
 const arrival=animateQuestionArrival;animateQuestionArrival=false;

tructured(item)?'Tab to move between answer controls':'Use 1–9 to select · Enter to continue'}</span>${s.mode==='practice'&&!item.checked?'<button class="button primary" data-action="check" '+(!isComplete(item)?'disabled':'')+'>Check answer <span>✓</span></button>':''}<button class="button ${s.mode==='practice'&&!item.checked?'secondary':'primary'}" data-action="${index===s.items.length-1?'finish':'next'}">${index===s.items.length-1?'Finish session':'Next question'} <span>→</span></button></div></div><aside class="question-map"><div class="eyebrow">YOUR SESSION</div><h2>Question navigator</h2><div class="map-grid">${s.items.map((it,j)=>`<button aria-label="Go to question ${j+1}${it.flag?', flagged':''}" data-jump="${j}" class="map-cell ${j===index?'current':''} ${it.checked?(isRight(it)?'right':'wrong'):isComplete(it)?'answered':hasAnswer(it)?'partial':''}">${j+1}${it.flag?'<i></i>':''}</button>`).join('')}</div><div class="map-key"><span><i class="key-current"></i>Current</span><span><i class="key-answered"></i>${s.mode==='exam'?'Answered':'Checked'}</span><span><b>⚑</b>Flagged</span></div><div class="tip-card"><span>✦</span><strong>${s.mode==='exam'?'Trust your preparation.':'Understanding beats memorising.'}</strong><p>${s.mode==='exam'?'You can move between questions and change your answers until you finish.':'Read the explanation, even when you get it right. Look for the rule behind the answer.'}</p></div></aside></div>`;
 updateTimer();
}
function updateTimer(){const s=state.session;if(!s||s.finished||!s.deadline)return;const left=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));if($('#timer')){$('#timer').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')} remaining`;$('#timer').classList.toggle('urgent',left<300);}if(!left)finish(true);}
setInterval(updateTimer,1000);
function renderResults(){const s=state.session;if(!s?.finished){setView('home');return;}const percent=Math.round(s.score/s.items.length*100);lastMissed=s.items.filter(i=>!isRight(i)).map(i=>i.id);
 $('#main').innerHTML=`<div class="topline"><button class="text-button" data-action="home">← Dashboard</button><span class="status-dot">Session saved</span></div><section class="result-hero"><div><div class="eyebrow">SESSION COMPLETE</div><h1>${percent>=80?'Look at that progress.':'Every attempt is a step forward.'}</h1><p>You answered ${s.score} of ${s.items.length} questions correctly.<br>${lastMissed.length?'Your next session can focus on the ones that need another look.':'A great time to try a fresh shuffle of the bank.'}</p><div class="result-actions">${lastMissed.length?'<button class="button primary" data-action="retry">Practise missed questions →</button>':''}<button class="button secondary" data-action="home">New session</button></div></div><div class="score-ring" style="--score:${percent}%"><div><strong>${percent}<small>%</small></strong><span>SESSION SCORE</span></div></div></section><div class="section-title"><div><div class="eyebrow">LEARN FROM THIS SESSION</div><h2>Review your answers</h2></div><span class="subtle">${Math.floor(s.elapsed/60)}m ${s.elapsed%60}s elapsed</span></div><div class="result-list">${s.items.map((it,j)=>`<details class="result-item"><summary><span class="result-symbol ${isRight(it)?'good':'bad'}">${isRight(it)?'✓':'×'}</span><span><small>QUESTION ${j+1} · ${isRight(it)?'CORRECT':hasAnswer(it)?'INCORRECT':'UNANSWERED'}</small><strong>${esc(it.stem)}</strong></span><b>⌄</b></summary><div class="result-body">${answerList(it,true)}${explanation(it)}</div></details>`).join('')}</div>`;
}
function renderReview(){const missed=pool('missed'),marks=pool('bookmarks');$('#main').innerHTML=title('ANOTHER LOOK','Make the tricky ones familiar.','A focused space for missed questions and the ones you want to keep close.')+`<div class="review-grid"><div class="review-card"><span class="mode-icon">↻</span><h2>Missed questions</h2><p>Questions you answered incorrectly on your latest attempt.</p><strong class="big-number">${missed.length}</strong><button class="button primary" data-action="review-missed" ${!missed.length?'disabled':''}>Practise missed questions →</button></div><div class="review-card"><span class="mode-icon">☆</span><h2>Your bookmarks</h2><p>Questions you saved for a little more attention.</p><strong class="big-number">${marks.length}</strong><button class="button secondary" data-action="review-bookmarks" ${!marks.length?'disabled':''}>Practise bookmarks →</button></div></div>${!missed.length&&!marks.length?'<div class="empty-state"><span>✧</span><h2>Your review space is clear.</h2><p>Missed questions will appear here after you practise. Use the star on any question to bookmark it.</p><button class="button secondary" data-action="home">Start a session</button></div>':''}`;}
function renderLibrary(){let items=pool(libraryFilter,libraryFormat).filter(q=>norm(q.stem).toLocaleLowerCase().includes(libraryQuery.toLocaleLowerCase()));$('#main').innerHTML=title('YOUR REFERENCE SHELF','The question library.',`${bank.length} unique questions. Browse a topic, reveal an explanation, or save a question for later.`)+`<div class="library-toolbar"><label class="search-box"><span>⌕</span><input id="library-search" type="search" placeholder="Search the question bank…" aria-label="Search question bank" value="${esc(libraryQuery)}"></label><label class="sr-only" for="library-filter">Filter questions</label><select id="library-filter"><option value="all">All questions</option><option value="unseen">Not yet practised</option><option value="missed">Needs review</option><option value="bookmarks">Bookmarked</option></select><label class="sr-only" for="library-format">Question format</label><select id="library-format"><option value="all">All formats</option><option value="choice">Multiple choice</option><option value="dropdown">Dropdown</option><option value="ordering">Drag & drop</option></select><span class="subtle">${items.length} shown</span></div><div class="library-list">${items.length?items.map(q=>{const v=q.variants[0];return `<details class="library-item"><summary><span class="library-index">${String(bank.indexOf(q)+1).padStart(3,'0')}</span><span><small>${status(q)}${booked(q.id)?' · ★ Bookmarked':''}</small><strong>${esc(displayStem(q.stem))}</strong></span><b>+</b></summary><div class="library-body"><button class="text-button" data-book="${q.id}">${booked(q.id)?'★ Remove bookmark':'☆ Bookmark question'}</button><p class="subtle">Answer key · ${q.variants.length>1?q.variants.length+' answer variants collected; one is shown.':'From your collected bank'}</p>${solutionPreview(v)}<button class="button secondary" data-practice-id="${q.id}">Practise this question →</button>${explanation(v)}</div></details>`;}).join(''):'<div class="empty-state"><h2>No questions found.</h2><p>Try another search or filter.</p></div>'}</div>`;

function renderHistory(){$('#main').innerHTML=title('YOUR MOMENTUM','Small sessions. Steady progress.','Sign in with the same account on your devices to sync this progress.')+(state.history.length?`<div class="history-table"><div class="history-row history-head"><span>SESSION</span><span>MODE</span><span>SCORE</span><span>RESULT</span></div>${state.history.map(h=>`<div class="history-row"><span><strong>${new Date(h.at).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</strong><small>${new Date(h.at).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}</small></span><span class="pill">${h.mode==='exam'?'Exam':'Practice'}</span><span><strong>${h.correct} / ${h.total}</strong></span><span class="history-percent ${h.correct/h.total>=.8?'good':''}">${Math.round(100*h.correct/h.total)}%</span></div>`).join('')}</div>`:'<div class="empty-state"><span>◷</span><h2>Your first session is waiting.</h2><p>Complete a practice or exam session to see your history here.</p><button class="button primary" data-action="home">Set up a session →</button></div>');}
function importBank(raw){
 if(!raw||typeof raw.bank!=='object'||Array.isArray(raw.bank)||raw.bank===null)throw Error('Choose a bank JSON file created by your collection script.');
 const questions=[],stems=new Set();
 for(const [id,q] of Object.entries(raw.bank)){
  if(!q||typeof q.question!=='string'||!Array.isArray(q.variants))continue;
  const cleanStem=cleanQuestionStem(q.question),stem=norm(cleanStem);if(!stem||stems.has(stem))continue;
  const variants=[],seen=new Set();
  for(const v of q.variants){
   if(!Array.isArray(v.options)||typeof v.explanation!=='string')continue;
   const unique=new Map();for(const o of v.options)if(typeof o.text==='string'&&typeof o.correct==='boolean')unique.set(norm(o.text)+'|'+o.correct,{text:o.text,correct:o.correct});
   const options=[...unique.values()];if(options.length<2||!options.some(o=>o.correct))continue;
   let type=(v.question_type||v.type||'choice');if(type==='rearrange')type='rearrange';else if(!['dropdown','code-dropdown','ordering'].includes(type))type='choice';
   let groups=[];
   if(type!=='choice'){
    if(!Array.isArray(v.response_groups)||!v.response_groups.length)continue;
    groups=v.response_groups.map(g=>({label:g.label,correct_choice:g.correct_choice,choices:Array.isArray(g.choices)?g.choices.filter(c=>c&&typeof c.text==='string').map(c=>({text:c.text})):[]}));
    if(groups.some(g=>typeof g.label!=='string'||typeof g.correct_choice!=='string'||g.choices.length<2||!g.choices.some(c=>norm(c.text)===norm(g.correct_choice))))continue;
   }
   const sig=JSON.stringify({type,answers:options.map(o=>norm(o.text)+'|'+o.correct).sort()});if(seen.has(sig))continue;seen.add(sig);
   variants.push({options,type,response_groups:groups,allow_reuse:Boolean(v.allow_reuse),explanation:v.explanation,references:Array.isArray(v.references)?v.references.filter(r=>r&&typeof r.url==='string'&&typeof r.title==='string'):[]});
  }
  if(variants.length){stems.add(stem);questions.push({id,stem:cleanStem,question_code:typeof q.question_code==='string'?q.question_code:'',variants});}
 }
 if(!questions.length)throw Error('No usable questions found in this bank.');return questions;
}

document.addEventListener('click',e=>{if(Date.now()-lastPlacementDrag<350)return;const el=e.target.closest('button');if(!el||el.disabled)return;if(el.dataset.chip!==undefined){armChoice(Number(el.dataset.chip));return;}if(el.dataset.placeTarget!==undefined){if(armedChoice===null){toast('Select an available choice first, then select its target.');return;}setResponse(Number(el.dataset.placeTarget),armedChoice);return;}if(el.dataset.clearTarget!==undefined){setResponse(Number(el.dataset.clearTarget),null);return;}if(el.dataset.practiceId){begin([el.dataset.practiceId],'practice');return;}if(el.dataset.view){setView(el.dataset.view);return;}if(el.dataset.mode){mode=el.dataset.mode;renderHome();return;}if(el.dataset.choice!==undefined){choose(Number(el.dataset.choice));return;}if(el.dataset.jump!==undefined){armedChoice=null;animateQuestionArrival=true;state.session.index=Number(el.dataset.jump);save();window.dispatchEvent(new Event('practice-cloud-save-requested'));renderSession();return;}if(el.dataset.book){toggleBookmark(el.dataset.book);return;}const action=el.dataset.action;if(!action)return;switch(action){case 'home':setView('home');break;case 'review':setView('review');break;case 'start':begin();break;case 'daily':begin(shuffle(bank).slice(0,5).map(q=>q.id),'practice');break;case 'cloud-signin':window.practiceCloudSignIn?.().catch(err=>toast(err.message||'Sign-in could not be started.'));break;case 'cloud-signout':window.practiceCloudSignOut?.().catch(err=>toast(err.message||'Sign-out could not be completed.'));break;case 'cloud-help':toast('Cloud sync needs a Firebase project. Your progress is still saved on this device.');break;case 'resume':if(state.session.bankId&&state.session.bankId!==selectedBank)setBank(state.session.bankId);setView('session');break;case 'check':checkAnswer();break;case 'next':if(state.session.index<state.session.items.length-1){armedChoice=null;animateQuestionArrival=true;state.session.index++;save();window.dispatchEvent(new Event('practice-cloud-save-requested'));renderSession();window.scrollTo(0,0);}break;case 'previous':if(state.session.index>0){armedChoice=null;animateQuestionArrival=true;state.session.index--;save();window.dispatchEvent(new Event('practice-cloud-save-requested'));renderSession();window.scrollTo(0,0);}break;case 'bookmark':toggleBookmark(current().id);break;case 'flag':current().flag=!current().flag;save();renderSession();break;case 'finish':finish();break;case 'retry':begin(lastMissed,'practice');break;case 'review-missed':begin(pool('missed').map(q=>q.id),'practice');break;case 'review-bookmarks':begin(pool('bookmarks').map(q=>q.id),'practice');break;case 'import':importTargetBank=selectedBank;$('#bank-file').click();break;}});
document.addEventListener('keydown',e=>{if(view!=='session'||/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)||e.altKey||e.metaKey||e.ctrlKey)return;const i=current();if(/^[1-9]$/.test(e.key)&&!i.checked&&!structured(i)){const o=i.options[Number(e.key)-1];if(o){e.preventDefault();choose(o.uid);}}else if(e.key==='Enter'){e.preventDefault();if(state.session.mode==='practice'&&!i.checked)checkAnswer();else if(state.session.index<state.session.items.length-1){animateQuestionArrival=true;state.session.index++;save();renderSession();}else finish();}});
