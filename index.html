may not address the root cause of the performance issues.\n\nCreate and modify reports by using Power BI - Training | Microsoft Learn Improve performance with smart design choices - Training | Microsoft Learn", "references": [{"title": "Create and modify reports by using Power BI - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-reports-finance-operations/02-power-bi-reports"}, {"title": "Improve performance with smart design choices - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/performing-solution-design-for-performance"}]}]}, {"id": "a3cbd71f028ccf5e029121a7d5b5d1c709c25f40a1ac9e549c3b58f1f79eac29", "stem": "You have been diagnosing performance issues in the finance and operations apps.\n\nYou need to identify the methods that are consuming the most time during execution.\n\nWhich tool should you use to perform this task?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Event log", "correct": false}, {"text": "Trace parser", "correct": true}, {"text": "Performance timer", "correct": false}, {"text": "Action center", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Trace parser is the correct tool for analyzing performance issues and identifying the methods that consume the most time during execution. Performance timer is used for diagnosing client performance issues, Event log is used for logging system events, and Action center is used for managing alerts and tasks.\n\nTroubleshooting performance issues in ER configurations - Training | Microsoft Learn Diagnose performance issues by using Trace parser - Training | Microsoft Learn", "references": [{"title": "Troubleshooting performance issues in ER configurations - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/analytics/er-troubleshoot-perf-issues-in-configurations"}, {"title": "Diagnose performance issues by using Trace parser - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/performance-monitoring-finance-operations/2-trace-parser"}]}]}, {"id": "6dd70ae6d272614c62dda91e90e1d2b4364771b25a39b15e6426188cf1840281", "stem": "You are improving the data entity performance in the Microsoft Dynamics 365 finance and operations apps. Users report slow data import and export processes.\n\nYou need to enhance the data entity performance for import and export operations while ensuring data integrity.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Optimize the data entities by adjusting the staging table design and utilizing the Entity Execution Parameters form.", "correct": true}, {"text": "Increase the timeout settings for the data management framework to allow longer operations.", "correct": false}, {"text": "Disable all entity triggers and database logging during import and export operations.", "correct": false}, {"text": "Export and import data in smaller batches to reduce the load on the system.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Optimizing the data entities by adjusting the staging table design and using the Entity Execution Parameters form can significantly improve performance during import and export operations. Disabling entity triggers and database logging could compromise data integrity and is not recommended. Increasing timeout settings may allow longer operations but does not address the root cause of the performance issue. Exporting and importing data in smaller batches might reduce system load but could also increase the overall time for operations and does not optimize the process.\n\nCreate a SQL trace by using the SQL Profiler - Training | Microsoft Learn Product-specific guidance for optimizing performance - Training | Microsoft Learn", "references": [{"title": "Create a SQL trace by using the SQL Profiler - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/performance-monitoring-finance-operations/4-2-sql-trace"}, {"title": "Product-specific guidance for optimizing performance - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/performing-solution-product-specific-guidance"}]}]}, {"id": "d94c00ebcef099cf230bb7fb0f0bcc8edea5706ed95610ee5f0c5a53e8293fa4", "stem": "Your company uses Microsoft Dynamics 365 finance and operations apps. The company has a requirement to restrict access to certain data in shared tables.\n\nYou need to secure data in such a way that users will have access to only the part of the table that is allowed by the enforced policy.\n\nYou need to select a framework to assign data security policies to security roles.\n\nWhich should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Extensible Data Security (XDS) framework", "correct": true}, {"text": "Data Protection API (DPAPI)", "correct": false}, {"text": "Role-based Security (RBS) framework", "correct": false}, {"text": "Record-level Security (RLS) framework", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The Extensible Data Security (XDS) framework in finance and operations apps allows you to secure data in shared tables. Role-based Security (RBS) framework, Record-level Security (RLS) framework, and Data Protection API (DPAPI) are incorrect because they do not provide the functionality to assign data security policies to security roles.\n\nSecure finance and operations apps - Training | Microsoft Learn Extensible data security framework - Training | Microsoft Learn", "references": [{"title": "Secure finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/security-strategy-product-oa"}, {"title": "Extensible data security framework - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/role-security-finance-operations/4-xds"}]}]}, {"id": "f1b771768397b4ca353d1024807f5191dfd1e46e41880bf38f54755db7543c42", "stem": "Your company's Microsoft Dynamics 365 finance and operations apps need to integrate with an external payroll system.\n\nYou need to ensure that employee payroll data is transferred securely and accurately.\n\nWhich method should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Export data to Excel and import it into the payroll system", "correct": false}, {"text": "Send payroll data via email attachments", "correct": false}, {"text": "Set up data entities and use the Data Management framework", "correct": true}, {"text": "Use direct database access for data transfer", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Setting up data entities and using the Data Management framework is the recommended method for secure and accurate data integration between Dynamics 365 finance and operations apps and external systems. Exporting to Excel, direct database access, and email attachments are not secure or reliable methods for integrating payroll data.\n\nExtend Dynamics 365 finance and operations apps - Training | Microsoft Learn Finance and operations apps and associated apps - Training | Microsoft Learn", "references": [{"title": "Extend Dynamics 365 finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/extend-your-solution-guidance-product-fo"}, {"title": "Finance and operations apps and associated apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-ecosystem-main-components-finance-operations/1-apps"}]}]}, {"id": "5094d7a81f1423ccb5d5bb82ae2eb9f77d8506f127b8a4f100d6a22434e364ea", "stem": "Your company is using Microsoft Dynamics 365 finance and operations apps. You have noticed that the system is not scaling well with increasing demand, affecting user satisfaction.\n\nYou need to improve the scalability of the system to handle increasing workload efficiently.\n\nWhat should you do to enhance system scalability?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Reduce the number of users who can access the data at the same time.", "correct": false}, {"text": "Remove set-based operations.", "correct": false}, {"text": "Disable all batch jobs and manually process each task to avoid system overload.", "correct": false}, {"text": "Use parallelism and multi-threading for high-volume scenarios.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct answer is to use parallelism and multi-threading for high-volume scenarios. This approach can significantly improve system scalability by allowing tasks to run simultaneously on different processors or threads. Reducing the number of users who can access the data, increasing the server's memory allocation, or disabling all batch jobs do not directly address the underlying scalability issue and might not improve system scalability or could require impractical manual intervention.\n\nImprove performance with smart design choices - Training | Microsoft Learn Diagnose and optimize client performance - Training | Microsoft Learn", "references": [{"title": "Improve performance with smart design choices - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/performing-solution-design-for-performance"}, {"title": "Diagnose and optimize client performance - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-forms-optimize-finance-operations/7-optimize"}]}]}, {"id": "ecba00d8659f7c9bd76b3db72c78159b834334e40edba889f821280daab65633", "stem": "You are working on the Microsoft Dynamics 365 finance and operations apps. The app's batch processes are currently running inefficiently, causing delays in operations.\n\nYou need to optimize the performance of the batch processes to reduce operational delays.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Manually monitor and restart batch jobs when they appear to be running slowly.", "correct": false}, {"text": "Implement priority-based batch scheduling.", "correct": true}, {"text": "Increase the frequency of batch jobs to process tasks more often.", "correct": false}, {"text": "Consolidate all batch jobs into a single task to simplify management.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct answer is to implement priority-based batch scheduling appropriately, which helps distribute the load and improve efficiency. Increasing the frequency of batch jobs without addressing the underlying performance issues could exacerbate the problem. Consolidating batch jobs into a single task could lead to longer run times and does not address the issue of inefficiency. Manually monitoring and restarting batch jobs is not a scalable or efficient long-term solution.\n\nCreate a SQL trace by using the SQL Profiler - Training | Microsoft Learn Product-specific guidance for optimizing performance - Training | Microsoft Learn", "references": [{"title": "Create a SQL trace by using the SQL Profiler - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/performance-monitoring-finance-operations/4-2-sql-trace"}, {"title": "Product-specific guidance for optimizing performance - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/performing-solution-product-specific-guidance"}]}]}, {"id": "536d8ca56874db004d5cbecb64ce4f0df5af1e9660fffcefcdf753dd42386b17", "stem": "A retailer is integrating its third-party, on-premises product catalog application with Microsoft Dynamics 365 finance and operations apps. You need to ensure that product changes in the third-party application are reflected in real time in the finance and operations apps. What should you use to achieve this integration?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Schedule a recurring data import using the Data Management Framework REST API.", "correct": false}, {"text": "Implement OData service endpoints for the required data entities.", "correct": true}, {"text": "Create a batch job to synchronize data at the end of each day.", "correct": false}, {"text": "Use the Electronic Reporting tool to configure data formats.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "OData service endpoints allow real-time data exchange, which is necessary for the retailer's requirement. The Data Management Framework REST API is used for asynchronous, batched data transfer and does not support real-time updates. The Electronic Reporting tool is intended for configuring document formats for regulatory reporting, not for product catalog integration. A batch job would only synchronize data periodically, not in real time.\n\nExplore data integration concepts in finance and operations apps - Training | Microsoft Learn Integrate Dynamics 365 apps with other systems - Training | Microsoft Learn", "references": [{"title": "Explore data integration concepts in finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/integration-patterns-finance-operations/4-scenarios"}, {"title": "Integrate Dynamics 365 apps with other systems - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/integrate-other-solutions-guidance-product"}]}]}, {"id": "6288386dee7f3c0d4f92db1f55e9bbea2b2a92ab1c5935ed75e6b624604e3426", "stem": "Your company is setting up a recurring data import job in Microsoft Dynamics 365 finance and operations apps. They want to ensure that the job runs efficiently and respects the dependencies between entities.\n\nYou need to configure the data import job to optimize execution time while considering all dependencies.\n\nHow should you set up the data import job?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Increase the batch size to the maximum allowed to process all entities in the shortest possible time.", "correct": false}, {"text": "Schedule the import job to run during off-peak hours to avoid any potential system performance impacts.", "correct": false}, {"text": "Disable all dependencies checks to speed up the import process and handle any issues post-import.", "correct": false}, {"text": "Use resequencing options to optimize the execution time for the full job by representing modules with execution units and feature areas with levels.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Resequencing options allow for optimization of execution time while maintaining the correct order based on dependencies. Disabling dependency checks could lead to data integrity issues. Scheduling during off-peak hours does not address the efficiency of the job itself. Increasing the batch size may not respect dependencies and could lead to system performance issues.\n\nMonitor status and availability of entities - Training | Microsoft Learn Data import and export jobs overview - Training | Microsoft Learn", "references": [{"title": "Monitor status and availability of entities - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/data-integrations-finance-operations/monitor-status-entities"}, {"title": "Data import and export jobs overview - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/fin-ops/data-entities/data-import-export-job"}]}]}, {"id": "5a9b5d63e5431edf680617f6279b9a4ccfda6ac65e952590221ec26cdd6b7dfc", "stem": "Your company is looking to use Microsoft Power Platform capabilities with its finance and operations apps.\n\nYou need to enable business users to create custom applications that interact with finance and operations data.\n\nWhich tool should you recommend to the business users?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Power Automate", "correct": false}, {"text": "Power Apps", "correct": true}, {"text": "Microsoft Dataverse", "correct": false}, {"text": "Power BI", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Power Apps is the correct tool for business users to create custom applications that can interact with finance and operations data. Power BI is primarily for data visualization and analytics, not app creation. Power Automate is for automating workflows and tasks, not for building apps. Microsoft Dataverse is the underlying data platform, but it is not a tool for creating apps.\n\nMicrosoft Power Platform integration with finance and operations apps - Training | Microsoft Learn Develop and integrate Microsoft Power Platform - Training | Microsoft Learn", "references": [{"title": "Microsoft Power Platform integration with finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/power-platform/overview"}, {"title": "Develop and integrate Microsoft Power Platform - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/integrate-azure-finance-operations/3-power"}]}]}, {"id": "b91cdec3b424c702298c953bc6f1c9d79fc4c12c7145b642c9596be9ce572886", "stem": "At your company, you are creating a solution that allows external applications to react to data changes in the finance and operations apps, such as when a new sales order is created.\n\nYou need to enable external applications to receive notifications about create, update, or delete operations occurring within the finance and operations apps.\n\nWhat should you implement to meet this requirement?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Use dual-write to replicate data changes to external applications' databases.", "correct": false}, {"text": "Implement OData feeds to provide external applications with the latest data changes.", "correct": false}, {"text": "Set up business events to trigger workflows in external applications using Microsoft Power Platform.", "correct": true}, {"text": "Configure a periodic data export service to send updates to external applications.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct answer is to set up business events to trigger workflows in external applications using Microsoft Power Platform. Business events can notify external applications of specific operations occurring within finance and operations apps. Dual-write is for data synchronization between Dynamics 365 apps and not for notifying external applications. OData feeds are meant for data access, not for event-driven notifications. A periodic data export service does not provide real-time notifications.\n\nMicrosoft Power Platform integration with finance and operations apps - Training | Microsoft Learn Develop and integrate Microsoft Power Platform - Training | Microsoft Learn", "references": [{"title": "Microsoft Power Platform integration with finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/power-platform/overview"}, {"title": "Develop and integrate Microsoft Power Platform - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/integrate-azure-finance-operations/3-power"}]}]}, {"id": "7354f2e0e6d6ad286dd65bbcccc2f99a98cb2dae0e3bccc06f90a740ff43cb23", "stem": "You have a Dynamics 365 Finance environment that includes a model named Model1.\n\nYou create a new model named Model2, and you create a new project that references Model2.\n\nYou need to create a form in Model2 that displays data from a table in Model1.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create a display menu item in Model1 and a form in Model2. Set the Object property of the menu item.", "correct": false}, {"text": "Create a form in Model2 that has a data source that references the table from Model1.", "correct": true}, {"text": "Create a form in Model2 that has a data source that references the table from Model1. Create an output menu item in Model1 that has the form from Model2 as its Object property.", "correct": false}, {"text": "Create a form in Model2 that has a data source that references the table from Model1. Create an output menu item in Model2 that has the form from Model2 as its Object property.", "correct": false}, {"text": "Create a form in Model2 that has a data source that references the table from Model1. Create an output menu item in Model2 that has the form from Model1 as its Object property.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "In Finance and Operations development, tables can be referenced across models as long as the model reference is configured in the project. Since the requirement is only to display data from a table in Model1 within a new form in Model2, the correct approach is to create a form in Model2 and add the table from Model1 as a data source. You do not need to create or modify menu items in Model1, nor do you need to cross-link menu items between models, because the form and menu item can both reside in Model2. Creating menu items in Model1 for a form in Model2 would break modular boundaries and is not necessary.\n\nApplication stack and server architecture - Training | Microsoft Learn Service description for finance and operations apps - Training | Microsoft Learn Finance and operations application architecture - Training | Microsoft Learn Finance and operations application documentation - Training | Microsoft Learn", "references": [{"title": "Application stack and server architecture - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-tools/application-stack-server-architecture"}, {"title": "Service description for finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/get-started/service-description"}, {"title": "Finance and operations application architecture - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/organization-administration/architecture-overview"}, {"title": "Finance and operations application documentation - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/fin-ops/index"}]}]}, {"id": "30ade3bb743e9ef6c99a7d4a16f8c4e25243633c088640e2f59363a3a45f8913", "stem": "You are responsible for ensuring that the company's deployment of finance and operations apps is monitored and tuned for optimal performance.\n\nYou need to utilize Dynamics Lifecycle Services (LCS) to maintain the health of your environments effectively.\n\nWhich three features should you use? Each correct answer presents a complete solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Deployment setup wizard for initial configuration", "correct": false}, {"text": "Customization analysis to ensure code quality", "correct": true}, {"text": "Performance metrics dashboard for real-time data", "correct": true}, {"text": "Data import/export framework for data management", "correct": false}, {"text": "Office integration for enhanced productivity", "correct": false}, {"text": "Environment monitoring with actionable insights", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Environment monitoring with actionable insights in LCS is the correct feature to proactively identify and resolve issues, as it provides tools to monitor the health of the environment. Customization analysis and performance metrics dashboard are useful for other purposes such as ensuring code quality and viewing performance data, but they do not proactively identify and resolve issues. Deployment setup wizard, data import/export framework, and Office integration are not related to proactive issue identification and resolution in LCS.\n\nExtend Menus - Training | Microsoft Learn Development and administration for finance and operations apps - Training | Microsoft Learn", "references": [{"title": "Extend Menus - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/extend-elements-finance-operations/extend-menus"}, {"title": "Development and administration for finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/"}]}]}, {"id": "e0a8813a225483e654c90aec3a6e9c8f2dd6a38b0679fc4ab068242abba20fe1", "stem": "You are managing a Dynamics 365 Commerce project using Azure DevOps and need to automate the build process for deployment packages.\n\nYou need to ensure that the build pipeline is correctly configured to generate a deployable package by adding a task to it.\n\nWhich task should you add?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Add the 'Node Tool Installer' task to install Node.js on the build agent.", "correct": false}, {"text": "Add the 'PowerShell Script' task to execute custom scripts.", "correct": false}, {"text": "Add the 'Publish Pipeline Artifacts' task to publish the build artifacts.", "correct": true}, {"text": "Add the 'Copy Files' task to copy source files to the build agent.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct answer involves using the 'Publish Pipeline Artifacts' task, which is critical for publishing build artifacts needed to create a deployable package. Another answer suggesting that copying source files is the final step in packaging artifacts is not correct because copying source files is not the final step in this process. The suggestion to install Node.js is also incorrect, as this is a prerequisite and not directly related to the packaging of artifacts. Finally, the answer advising to execute custom scripts is incorrect, as this action doesn't directly result in the creation of a deployable package.\n\nSet up Azure DevOps code sharing and create a build pipeline - Training | Microsoft Learn Working in Visual Studio - Training | Microsoft Learn", "references": [{"title": "Set up Azure DevOps code sharing and create a build pipeline - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/commerce/e-commerce-extensibility/set-up-code-sharing-build-pipeline"}, {"title": "Working in Visual Studio - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/manage-source-code-version-control-finance-operations/03-visual-studio"}]}, {"options": [{"text": "Add the 'Use Node.js ecosystem' task to install Node.js on the build agent.", "correct": false}, {"text": "Add the 'PowerShell Script' task to execute custom scripts.", "correct": false}, {"text": "Add the 'Publish Pipeline Artifacts' task to publish the build artifacts.", "correct": true}, {"text": "Add the 'Copy Files' task to copy source files to the build agent.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct answer involves using the 'Publish Pipeline Artifacts' task, which is critical for publishing build artifacts needed to create a deployable package. Another answer suggesting that copying source files is the final step in packaging artifacts is not correct because copying source files is not the final step in this process. The suggestion to install Node.js is also incorrect, as this is a prerequisite and not directly related to the packaging of artifacts. Finally, the answer advising to execute custom scripts is incorrect, as this action doesn't directly result in the creation of a deployable package.\n\nSet up Azure DevOps code sharing and create a build pipeline - Training | Microsoft Learn Working in Visual Studio - Training | Microsoft Learn", "references": [{"title": "Set up Azure DevOps code sharing and create a build pipeline - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/commerce/e-commerce-extensibility/set-up-code-sharing-build-pipeline"}, {"title": "Working in Visual Studio - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/manage-source-code-version-control-finance-operations/03-visual-studio"}]}]}, {"id": "09e0c45684d42d45f3ec98e4ea5c8a97934637fd5e2e1148dcfb0f071d330769", "stem": "You are tasked with creating a new form that will display customer transactions in a grid format.\n\nYou need to ensure that the grid displays only the necessary fields in a specific order for optimal readability.\n\nYou need to add and order the fields in the grid.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Use the Arrange option in the grid's context menu to order fields after adding them.", "correct": false}, {"text": "Add fields to the grid and then reorder them in the Properties window.", "correct": false}, {"text": "Drag the selected fields from the Fields node to the Grid node in the desired order.", "correct": true}, {"text": "Manually set the order property for each field in the data source.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Dragging the selected fields from the Fields node to the Grid node allows you to add and order the fields as needed. The other options either do not exist or are not the standard method for ordering fields in Dynamics 365.\n\nAdd grids, fields, and groups to a form - Training | Microsoft Learn Create and extend menus - Training | Microsoft Learn Lab - Create a form - Training | Microsoft Learn", "references": [{"title": "Add grids, fields, and groups to a form - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-forms-optimize-finance-operations/4-grids"}, {"title": "Create and extend menus - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-forms-optimize-finance-operations/create-menus"}, {"title": "Lab - Create a form - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-forms-optimize-finance-operations/9-exercise"}]}]}, {"id": "07925d7409984d09016d66ceeb8844304cac51d142d7436838ff622d374162d4", "stem": "The current workspace used by the finance team is cluttered and causes inefficiency due to the lack of custom data views.\n\nYou need to design an efficient solution that allows users to have views that display only the data relevant to their specific roles, improving navigation and efficiency.\n\nWhat two actions should you perform? Each correct answer presents a complete solution.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create a new workspace for each user to avoid clutter and overlap of data.", "correct": false}, {"text": "Configure filtering and sorting options to create role-centered workspaces that enhance data relevancy for the users.", "correct": true}, {"text": "Increase the number of menu items to provide direct access to all possible data forms and reports.", "correct": false}, {"text": "Remove all existing personalizations and reset the workspace to its default layout.", "correct": false}, {"text": "Design and implement saved views that can be personalized based on user roles and permissions.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Saved views allow users to have personalized data views relevant to their roles, which improves efficiency and navigation. Configuring filtering and sorting options helps in creating focused workspaces tailored to user roles. Increasing the number of menu items would add to the clutter rather than reduce it. Creating a new workspace for each user is not practical and does not ensure data relevancy. Removing all personalizations would negate any existing efficiencies and is counterproductive to the goal.\n\nCreate and extend menus - Training | Microsoft Learn User interface elements - Training | Microsoft Learn", "references": [{"title": "Create and extend menus - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/training/modules/build-forms-optimize-finance-operations/create-menus"}, {"title": "User interface elements - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/fin-ops/get-started/user-interface-elements"}]}]}, {"id": "ce01d66e6f132a3d9500595eca742159d489ffd590371d5bb6779c4334f2c240", "stem": "You are working on the FMCustomer.myExtension table in Microsoft Dynamics 365. You have added a new field to the table.\n\nYou need to ensure that the new field is linked to another table to guarantee referential integrity.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create a new relation to the extended table following the same process as adding a relation to a new table.", "correct": true}, {"text": "Create a new table with the new field and the related field.", "correct": false}, {"text": "Use an event handler to create a relation between the new field and the other table.", "correct": false}, {"text": "Modify the properties of the new field to create a relation.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Creating a new relation to the extended table is the correct approach to link the new field to another table. Using an event handler is not the appropriate method to create a relation. Modifying the properties of the new field does not allow you to create a relation. Creating a new table is unnecessary and could lead to data redundancy.\n\nWrite extensible tables - Training | Microsoft Learn Add a table extension to a project - Training | Microsoft Learn", "references": [{"title": "Write extensible tables - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/extensible-tables"}, {"title": "Add a table extension to a project - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/extend-elements-finance-operations/2-table"}]}]}, {"id": "fd804d75e2f33c9237ab45bd474a422ad98e88f7deb512ece7d52114283c4a93", "stem": "You are working on a project that involves the use of Microsoft Dynamics 365 finance and operations apps. You have created an extension of the FMCustomer table and added a new field named AccountReferrer.\n\nYou need to add a dedicated index to speed up database searches on AccountReferrer.\n\nWhat should you do next?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create an index in the same manner as you would add an index to a new table.", "correct": true}, {"text": "Index the foreign key reference.", "correct": false}, {"text": "Add the index to the base table.", "correct": false}, {"text": "Set AccountReferrer’s properties to IsMandatory and Unique.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Creating an index in the same manner as you would add an index to a new table is the correct approach. Creating a unique index using the extension is not allowed because it is intrusive. Adding the index to the base table is incorrect because the new field was added to the extension, not the base table. Using a third-party tool is not recommended because it may not be compatible with Microsoft Dynamics 365.\n\nWalkthrough: Defining Classes (Visual Basic) - Training | Microsoft Learn Add a table extension to a project - Training | Microsoft Learn", "references": [{"title": "Walkthrough: Defining Classes (Visual Basic) - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dotnet/visual-basic/programming-guide/language-features/objects-and-classes/walkthrough-defining-classes"}, {"title": "Add a table extension to a project - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/extend-elements-finance-operations/2-table"}]}]}, {"id": "ed02a65c96382513aaeba878057da1fa5c512518b16c4feeb40fa916f3e45e08", "stem": "You have a Dynamics 365 finance and operations apps extension model.\n\nWhen a planned production order is confirmed, you need to automatically set the status of the new production order to Started. The solution must use the extensibility model and must NOT modify application objects or use overlayering.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create a class extension and wrap the planned order confirmation method by using Chain of Command (CoC).", "correct": false}, {"text": "Create a new X++ class with a post-event handler for the planned order confirmation method and set the order to Started.", "correct": true}, {"text": "Export the planned orders to Microsoft Excel, update the Status field, and publish the changes.", "correct": false}, {"text": "Personalize the order form to set the Status field to Started.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Objective:\n\n3.3 Create classes and extend AOT elements\n\nWhat This Item Tests:\n\nAdd event handler methods to a class\n\nAdditional Reading:\n\nExtend Dynamics 365 finance and operations apps\n\nRationale:\n\nA post-event handler enables custom logic to run after a planned order confirmation, while fully complying with the extensibility model. Replacing the method implementation is not the intended event-based approach. Form personalization affects only the user interface, and Excel-based updates do not extend the confirmation process.", "references": [{"title": "Extend Dynamics 365 finance and operations apps", "url": "https://learn.microsoft.com/en-us/dynamics365/guidance/implementation-guide/extend-your-solution-guidance-product-fo"}]}]}, {"id": "17882241c4cbff965d4aefb0f2b8738bd6e83e0ff5b62131a8f632a83faf64b8", "stem": "You are working on finance and operations apps using X++. You have created a class.\n\nYou want to add a method that belongs to the class, not an instance of the class, and exists even if an instance of the class is not created.\n\nYou need to add an accessor keyword to that method.\n\nWhich should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "protected", "correct": false}, {"text": "static", "correct": true}, {"text": "private", "correct": false}, {"text": "public", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The 'static' keyword is used to declare a method that belongs to the class, not an instance of the class. It exists even if an instance of the class is not created. 'public', 'private', and 'protected' are accessor keywords, not used to declare a method that belongs to a class.\n\nCommon type system - Training | Microsoft Learn Add code and methods to meet business requirements - Training | Microsoft Learn", "references": [{"title": "Common type system - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dotnet/standard/base-types/common-type-system"}, {"title": "Add code and methods to meet business requirements - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/create-classes-finance-operations/3-code"}]}]}, {"id": "9d11f1ad5440d0daaab4482ab90c4faf142b10b85d20d2903981cb70acabf18b", "stem": "You are implementing a feature in Microsoft Dynamics 365 finance and operations apps that requires handling events during a business process.\n\nYou need to ensure that the application can respond to specific events without tightly coupling the event handlers to the business process logic.\n\nWhat should you implement?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create event handler classes and subscribe them to the appropriate delegates.", "correct": true}, {"text": "Use global variables to track the state of the business process and execute logic conditionally.", "correct": false}, {"text": "Implement a polling mechanism that checks for event conditions within the main process loop.", "correct": false}, {"text": "Embed the event response logic directly within the business process methods.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Option A is correct because event handler classes and delegates provide a decoupled way to respond to events. Option B is incorrect as global variables do not provide a mechanism for event handling and can lead to tightly coupled code. Option C is incorrect because embedding the logic within the methods leads to tight coupling and is not a best practice for event handling. Option D is incorrect as polling is not an efficient or recommended method for event handling in this context.\n\nImplement Chain of Command - Training | Microsoft Learn Class extension - Method wrapping and Chain of Command - Training | Microsoft Learn", "references": [{"title": "Implement Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/develop-object-oriented-code-finance-operations/4-chain-command"}, {"title": "Class extension - Method wrapping and Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/method-wrapping-coc"}]}]}, {"id": "4ef2dae012974f11e00ded5faea98af0eecac904f7b73d1d8a2545595664e2b3", "stem": "You are working on a Dynamics 365 application. You need to extend a base class method but the method is marked as [Hookable(false)].\n\nYou need to understand how this attribute affects your ability to wrap the method.\n\nYou need to determine if you can wrap the method in an extension class.\n\nCan you do this?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "No", "correct": true}, {"text": "Yes", "correct": false}, {"text": "Only if the method is also marked as Wrappable(true)", "correct": false}, {"text": "Only if the method is not final", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "If a method is explicitly marked as [Hookable(false)], the method can't be wrapped in an extension class. The Wrappable attribute and whether the method is final do not affect this restriction.\n\nClass extension - Method wrapping and Chain of Command - Training | Microsoft Learn Implement Chain of Command - Training | Microsoft Learn", "references": [{"title": "Class extension - Method wrapping and Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/method-wrapping-coc"}, {"title": "Implement Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/develop-object-oriented-code-finance-operations/4-chain-command"}]}]}, {"id": "c11e7874a143c140d7479b43bc5af5b54d8a1a0313cc3e3e8838b768514a47d2", "stem": "You are managing a Microsoft Dynamics 365 finance and operations apps implementation. You need to ensure that the system remains operational during peak business hours.\n\nYou need to manage the timing of system jobs to schedule system jobs to run during off-peak hours.\n\nWhich feature should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Continuous background service without scheduling", "correct": false}, {"text": "Real-time services execution", "correct": false}, {"text": "Manual triggering of jobs during off-peak hours", "correct": false}, {"text": "Batch processing with priority-based batch scheduling", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The scheduling priority classifications are used to declare relative priorities, and to determine the processing order of jobs and business processes. The available values for the scheduling priority are Low, Normal, High, Critical, and Reserved capacity.\n\nExtend Dynamics 365 finance and operations apps - Training | Microsoft Learn Finance and operations apps and associated apps - Training | Microsoft Learn", "references": [{"title": "Extend Dynamics 365 finance and operations apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/extend-your-solution-guidance-product-fo"}, {"title": "Finance and operations apps and associated apps - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-ecosystem-main-components-finance-operations/1-apps"}]}]}, {"id": "8e3cf424f8b64cb1919d7fd8a32a0e18289dad0ccc6eaab72f7dc2c5cbd9ac42", "stem": "You are working on a project that involves the use of Microsoft Dynamics 365 finance and operations apps. You have created a new class that extends the InventTable.\n\nYou need to add methods to the augmented class.\n\nWhat should you do next?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Implement the methods directly in the base class.", "correct": false}, {"text": "Add methods to the base class and use your new method from an event handler.", "correct": false}, {"text": "Create a new class called InventTable_Handler and create the methods in it.", "correct": false}, {"text": "Add methods to the augmented class and use your new method from an event handler.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Adding methods to the augmented class and using your new method from an event handler is the correct approach. Adding methods to the base class and using your new method from an event handler is incorrect because the new method should be added to the augmented class. Implementing the methods directly in the base class is not recommended because it can lead to code clutter. Using a third-party tool is not recommended because it may not be compatible with Microsoft Dynamics 365.\n\nAdd a table extension to a project - Training | Microsoft Learn", "references": [{"title": "Add a table extension to a project - Training | Microsoft Learn", "url": "https://learn.microsoft.com/en-us/training/modules/extend-elements-finance-operations/2-table"}]}]}, {"id": "827ddc57f8150640cb4a338d298c45db81db3c709ac0f8598c3f1b3036d9f9dc", "stem": "Your company is planning to take a Microsoft application update and apply custom code and configurations to the production environment.\n\nYou need to reduce the time and cost of user acceptance testing (UAT) without having to write source code.\n\nWhat two tools should you use? Each correct answer presents part of the solution. Choose two.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Regression suite automation tool (RSAT)", "correct": true}, {"text": "Data management framework", "correct": false}, {"text": "Acceptance Test Library (ATL) tool", "correct": false}, {"text": "SysTest framework", "correct": false}, {"text": "Task recorder", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The Regression suite automation tool (RSAT) and Task recorder are the correct tools to use as they allow functional power users to record business tasks and then convert the recordings into a suite of automated tests, without having to write source code. The SysTest framework and Acceptance Test Library (ATL) tool are used for unit and component testing, not for reducing the time and cost of UAT. The Data management framework is used for data integration testing, not for UAT.\n\nRegression suite automation tool (RSAT) - Training | Microsoft Learn Configure the testing environment and prepare data - Training | Microsoft Learn", "references": [{"title": "Regression suite automation tool (RSAT) - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/perf-test/rsat/rsat-overview"}, {"title": "Configure the testing environment and prepare data - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-test-framework-tools-finance-operations/07-configure"}]}]}, {"id": "065c43e7618ecff904ffc6379adb510293d708dcd3d93e258237857e43bed690", "stem": "You are managing the testing process for Microsoft Dynamics 365 finance and operations apps using RSAT. You have updated a recording file with new steps.\n\nYou need to ensure that the test parameter file matches the updated steps in the recording file.\n\nWhat should you do next?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Modify the existing Excel parameter file manually", "correct": false}, {"text": "Upload the updated recording file to Azure DevOps without generating files", "correct": false}, {"text": "Select Generate > Generate Test Execution and Parameter files", "correct": true}, {"text": "Select Generate > Generate Test Execution files only", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Selecting 'Generate &gt; Generate Test Execution and Parameter files' generates both test automation files and a new Excel parameter file in your working directory, which is necessary after updating a recording file with new steps. The other options do not generate a new parameter file that matches the updated recording file.\n\nUse the Regression suite automation tool (RSAT) - Training | Microsoft Learn\nPlan the build, test, and quality control processes - Training | Microsoft Learn", "references": [{"title": "Use the Regression suite automation tool (RSAT) - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/perf-test/rsat/rsat-run"}, {"title": "Plan the build, test, and quality control processes - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/application-lifecycle-finance-operations/03-plan"}]}]}, {"id": "eae04584af53fd27baf05dc697c826b2de03ef18acc2c465d2b2cfcc1caeb108", "stem": "Your company is using Microsoft Dynamics 365 finance and operations apps to manage its financial data. They have recently noticed that their SSRS reports are not reflecting the most current data, leading to discrepancies in financial reporting.\n\nYou need to ensure that the SSRS reports reflect live data to maintain accuracy in financial reporting.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Increase the frequency of data refresh in the batch job settings.", "correct": false}, {"text": "Export the data to Microsoft Excel and create pivot tables for real-time analysis.", "correct": false}, {"text": "Manually update the data source before running each report.", "correct": false}, {"text": "Configure the SSRS reports to use query-based data sources with real-time execution.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Configuring the SSRS reports to use query-based data sources with real-time execution ensures that the reports reflect the most current data without manual intervention. Increasing the frequency of data refresh does not guarantee real-time data. Exporting data to Excel and creating pivot tables is a manual process and not a solution for SSRS reports. Manually updating the data source is not efficient and prone to human error.\n\nReporting capabilities - Training | Microsoft Learn Create reporting solutions - Training | Microsoft Learn", "references": [{"title": "Reporting capabilities - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-ecosystem-main-components-finance-operations/5-reporting"}, {"title": "Create reporting solutions - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/analytics/create-nextgen-reporting-solutions"}]}]}, {"id": "7268bce9da08cec1c047a82c9605be275665d9baefbd946d2bdd2fd7a4f71976", "stem": "Your company uses Dynamics 365 finance and operations apps for its business operations. They have a requirement to create a new workspace that includes specific elements for their sales team.\n\nYou need to create a workspace and add existing elements to it from the user interface.\n\nYou need to determine which presentation types are available when adding an element to a workspace from the user interface. What are they?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Graph, Chart, and Table", "correct": false}, {"text": "Tile, List, and Link", "correct": true}, {"text": "Form, View, and Entity", "correct": false}, {"text": "Report, Dashboard, and Canvas", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Option A is correct because Tile, List, and Link are the presentation types that can be selected when adding an element to a workspace from the user interface in Dynamics 365 finance and operations apps. The other options are not valid presentation types for this context.\n\nCustomize data models of historical and real-time analytics reports - Training | Microsoft Learn Implement built-in KPIs, charts, and other reporting components - Training | Microsoft Learn", "references": [{"title": "Customize data models of historical and real-time analytics reports - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/customer-service/administer/model-customize-reports"}, {"title": "Implement built-in KPIs, charts, and other reporting components - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-workspaces-finance-operations/4-built-in-kpi"}]}]}, {"id": "7f13cc6b2535f3645c1f44ee5d1da13872b83c8d6c4ee4db3d99ea14b164a140", "stem": "You are working on finance and operations apps using X++. You have created a class and now you need to add a method to it.\n\nYou will add a method that can be called from anywhere the class is accessible and can be overridden by a subclass.\n\nYou need to add an accessor keyword to that method.\n\nWhich should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "private", "correct": false}, {"text": "public", "correct": true}, {"text": "protected", "correct": false}, {"text": "static", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The 'public' keyword allows a method to be called from anywhere the class is accessible and can be overridden by a subclass. 'private' methods can only be called from methods within the same class and can't be overridden in a subclass. 'protected' methods can only be called from methods in the same class or methods in a subclass of that class. 'static' is not an accessor keyword, it's used to declare a method that belongs to a class, not an instance of the class.\n\nCommon type system - Training | Microsoft Learn Add code and methods to meet business requirements - Training | Microsoft Learn", "references": [{"title": "Common type system - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dotnet/standard/base-types/common-type-system"}, {"title": "Add code and methods to meet business requirements - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/create-classes-finance-operations/3-code"}]}]}, {"id": "46ddb998bf80c0c7422d173da8517a29e0c903a91bc00d43429c7ff474d11c31", "stem": "You are working on a project that involves the development of a new class in X++ for Microsoft Dynamics 365 finance and operations apps.\n\nYou need to create a subclass that extends an existing superclass and overrides one of its methods to customize its behavior.\n\nWhat three steps should you perform? Each correct answer presents part of the solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create a new class and use the 'extends' keyword to specify its superclass.", "correct": true}, {"text": "Add the desired functionality to the overridden method in the subclass.", "correct": true}, {"text": "Use the 'final' keyword when declaring the subclass to prevent further inheritance.", "correct": false}, {"text": "Declare the method to be overridden in the subclass as 'private'.", "correct": false}, {"text": "In the subclass, declare a method with the same name and parameters as the method in the superclass.", "correct": true}, {"text": "Use the 'overload' keyword to change the functionality of the inherited method.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "To create a subclass that extends a superclass, you need to create a new class and use the 'extends' keyword to specify the superclass it should inherit from. To override a method from the superclass, you need to declare a method with the same name and parameters in the subclass and add the desired functionality. Using the 'final' keyword when declaring the subclass would prevent further inheritance, which is not required in this scenario. Declaring the method to be overridden as 'private' would make it inaccessible from the subclass. The 'overload' keyword does not exist in X++, so it cannot be used to change the functionality of the inherited method.\n\nX++ inheritance - Training | Microsoft Learn Class extension - Method wrapping and Chain of Command - Training | Microsoft Learn", "references": [{"title": "X++ inheritance - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/dev-ref/xpp-inheritance"}, {"title": "Class extension - Method wrapping and Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/create-classes-finance-operations/3-code"}]}]}, {"id": "087e1cbe0de74eb58c5f161c128e308a5afb266d37343a7de7c5c1b42a5db23f", "stem": "For a new module in Microsoft Dynamics 365 finance and operations apps, you need to ensure that certain operations are performed only if specific conditions are met within the data retrieved by a query.\n\nYou need to apply filtering logic to the query results based on dynamic conditions.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Retrieve all records and then use an if-else block in X++ to filter the results programmatically.", "correct": false}, {"text": "Create multiple versions of the query; one for each set of conditions, and execute them conditionally.", "correct": false}, {"text": "Implement X++ variable scoping and use the QueryFilter class to add conditional filters to the query.", "correct": true}, {"text": "Hard-code the filter conditions directly into the select statement of the query.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Rationale: The correct method to apply filtering logic to the query results based on dynamic conditions is to implement X++ variable scoping and use the QueryFilter class to add conditional filters to the query, making option C correct. Option A is incorrect as it is inefficient to retrieve all records first and then filter them programmatically. Option B, which suggests creating multiple versions of the query for each set of conditions, is incorrect as it is not efficient and does not leverage the capabilities of the QueryFilter class. Hard-coding the filter conditions directly into the select statement of the query (Option D) is incorrect as it lacks flexibility and does not support dynamic filtering.\n\nClass extension - Method wrapping and Chain of Command - Training | Microsoft Learn\nImplement Chain of Command - Training | Microsoft Learn", "references": [{"title": "Class extension - Method wrapping and Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/method-wrapping-coc"}, {"title": "Implement Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/develop-object-oriented-code-finance-operations/4-chain-command"}]}]}, {"id": "c3f37bee51cbb4c80a0c2f1c717034e190f631b013f5779a0cba443343d29954", "stem": "Your company uses Dynamics 365 finance and operations apps for its business processes. Recently, the company decided to implement a new workflow for their procurement process.\n\nYou need to develop this custom workflow with the least amount of coding effort.\n\nWhat three tools should you use? Each correct answer presents part of the solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "the batch framework", "correct": true}, {"text": "the workflow framework", "correct": true}, {"text": "the SysExtensionSerializer", "correct": false}, {"text": "the SysOperation framework", "correct": true}, {"text": "the Regression Suite Automation tool", "correct": false}, {"text": "Data task automation", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The workflow framework is designed to represent a business process by showing who must complete a task, make a decision, or approve a document. The SysOperation framework and the batch framework are not specifically designed for workflows. The SysExtensionSerializer is not a framework for developing workflows. The Regression Suite Automation tool and Data task automation are used for testing and data management respectively, not for developing workflows.\n\nFinance and operations application documentation - Training | Microsoft Learn Application components and architecture - Training | Microsoft Learn", "references": [{"title": "Finance and operations application documentation - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/fin-ops/"}, {"title": "Application components and architecture - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-technical-architecture-finance-operations/application-components-architecture"}]}]}, {"id": "2167a66b47cf4507117a64ebce87931981e2e8e85e4ee9f5a9a29bbd77f057b6", "stem": "You are working on a finance and operations app. You have a custom table called AdventureWorksBankCheque with two fields BankAccount and CheckNo.\n\nYou need to run a user interface-driven process to add 100 new check numbers, starting from 10000, by using the sandbox framework without freezing the web client.\n\nYou need to avoid the Application Object Server (AOS) timing out.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Run an asynchronous process using the SysOperationSandbox framework.", "correct": true}, {"text": "Use batch processes to perform the task.", "correct": false}, {"text": "Run the process in synchronous mode in the web client.", "correct": false}, {"text": "Create a new form and add a button without using SysOperationSandbox.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Option A is correct because running an asynchronous process using the SysOperationSandbox framework will prevent the Application Object Server (AOS) from disconnecting the client if the process takes too long. Option B is incorrect because running the process in synchronous mode in the web client will freeze the web browser until the process completes. Option C is incorrect because batch processes are used for lengthy tasks that are implemented on the batch servers, not for user interface-driven processes. Option D is incorrect because simply creating a new form and adding a button will not solve the problem of the AOS disconnecting the client.\n\nImplement the SysOperationSandbox framework - Training | Microsoft Learn The user interface - Training | Microsoft Learn Use X++ runtime functions for common tasks - Training | Microsoft Learn", "references": [{"title": "Implement the SysOperationSandbox framework - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-extensions-framework-finance-operations/sysoperationsandbox-framework"}, {"title": "The user interface - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-ecosystem-main-components-finance-operations/4-ui"}, {"title": "Use X++ runtime functions for common tasks - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/get-started-xpp-finance-operations/8-runtime"}]}]}, {"id": "2ff3cc58fad193494ef8ebd800cbdadb8adf4cfb77a92f18811b49d86423acfa", "stem": "You are working on a project that requires frequent code deployments to on-premises environments.\n\nYou need to automate the process of deploying code to these environments to reduce manual effort and potential errors.\n\nWhich two actions should you perform? Each correct answer presents part of the solution. Choose two.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Use the Environment Monitoring Tool to deploy the code.", "correct": false}, {"text": "Upload a deployable package to the Lifecycle Services Asset Library.", "correct": true}, {"text": "Redeploy the environment after selecting the deployable package in the Customize solution assets tab.", "correct": true}, {"text": "Manually copy the code files to each on-premises environment.", "correct": false}, {"text": "Use the Cloud-hosted environments tool to deploy the code.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct steps to automate the process of deploying code to on-premises environments are to upload a deployable package to the Lifecycle Services Asset Library and redeploy the environment after selecting the deployable package in the Customize solution assets tab. These steps are recommended as they reduce manual effort and potential errors. Using the Environment Monitoring Tool, manually copying the code files to each on-premises environment, or using the Cloud-hosted environments tool are not correct methods for code deployment.\n\nChecklist for application lifecycle management - Training | Microsoft Learn Overview of Lifecycle Services - Training | Microsoft Learn", "references": [{"title": "Checklist for application lifecycle management - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/guidance/implementation-guide/application-lifecycle-management-checklist"}, {"title": "Overview of Lifecycle Services - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-technical-architecture-finance-operations/6-lcs"}]}]}, {"id": "ddc84e8f953e62c913a4f4f050d63b1aaeae27ef83f631c426d48a752b604ad2", "stem": "Your company uses Microsoft Power BI for data exploration and visualization. Recently, the company has decided to shift from using SSRS reports to Power BI for non-document reports.\n\nYou need to ensure that the transition is smooth and the users can interactively explore large volumes of data without creating multiple views of the same data.\n\nWhich tool should you recommend for this purpose?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "PowerPivot extension in Excel", "correct": false}, {"text": "DirectQuery technology in Power BI", "correct": true}, {"text": "Power Query extension in Excel", "correct": false}, {"text": "SSRS integration", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "DirectQuery technology in Power BI allows creation of reports over large volumes of data without caching data in the PowerBI.com service. Power Query and PowerPivot extensions in Excel are used for creating visualizations and ingesting larger amount of data into Excel respectively, but they do not provide interactive data exploration like Power BI. SSRS integration is used for document-style reports, not for interactive data exploration.\n\nReporting capabilities - Training | Microsoft Learn Create reporting solutions - Training | Microsoft Learn", "references": [{"title": "Reporting capabilities - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-ecosystem-main-components-finance-operations/5-reporting"}, {"title": "Create reporting solutions - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/analytics/create-nextgen-reporting-solutions"}]}]}, {"id": "c4dd42e4c292d551f3d73c2b23c02177f76664c9b8d9df33ea13edc903707f7b", "stem": "You are working on a project that involves Microsoft Dynamics 365 finance and operations apps. You have been integrating the finance and operations apps with Microsoft Excel using OData.\n\nYou need to ensure that the integration is seamless and does not disrupt the existing workflows.\n\nWhat should you do? Each correct answer presents part of the solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Configure the OData connection in Microsoft Excel.", "correct": true}, {"text": "Integrate the apps with Excel using virtual entities.", "correct": false}, {"text": "Use dual-write to integrate the apps with Excel.", "correct": false}, {"text": "Create an OData endpoint in the finance and operations apps.", "correct": true}, {"text": "Use Power Automate to create a data flow between the apps and Excel.", "correct": false}, {"text": "Test the connection and validate the data flow between the apps and Excel.", "correct": true}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Creating an OData endpoint in the finance and operations apps, configuring the OData connection in Excel, and testing the connection are the correct steps for integrating the apps with Excel using OData. Power Automate is not necessary for this task. Virtual entities and dual-write are used for integrating with Microsoft Dataverse, not Excel.\n\nPower Platform convergence - Training | Microsoft Learn Enable Power Platform integration - Training | Microsoft Learn", "references": [{"title": "Power Platform convergence - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/data-integrations-finance-operations/5-3-power-platform-convergence"}, {"title": "Enable Power Platform integration - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/power-platform/enable-power-platform-integration"}]}]}, {"id": "9db697bc9aacda7592ff6dd8a756d35faa0664e847a016f84c528d48c798dc74", "stem": "You are developing finance and operations apps in X++. You have created a class and you want to add a method to it.\n\nYou want to add a method that can only be called from methods within the same class and can't be overridden in a subclass.\n\nYou need to add an accessor keyword to that method.\n\nWhich should you use?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "static", "correct": false}, {"text": "private", "correct": true}, {"text": "public", "correct": false}, {"text": "protected", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The 'private' keyword allows a method to be called only from methods within the same class and can't be overridden in a subclass. 'public' methods can be called from anywhere the class is accessible and can be overridden by a subclass. 'protected' methods can only be called from methods in the same class or methods in a subclass of that class. 'static' is not an accessor keyword, it's used to declare a method that belongs to a class, not an instance of the class.\n\nCommon type system - Training | Microsoft Learn Add code and methods to meet business requirements - Training | Microsoft Learn", "references": [{"title": "Common type system - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dotnet/standard/base-types/common-type-system"}, {"title": "Add code and methods to meet business requirements - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/create-classes-finance-operations/3-code"}]}]}, {"id": "f0b71a8da9f2627ae49c0cc298084d454e166f826619076056d6fc545ae604eb", "stem": "You are developing a custom module in Microsoft Dynamics 365 finance and operations apps that requires using object-oriented principles to manage financial transactions.\n\nYou need to ensure that the module supports different types of transactions while sharing common functionalities and adhering to the principle of inheritance.\n\nYou need to design the classes appropriately.\n\nHow should you do this?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create separate classes for each transaction type without a base class and replicate the common functionalities.", "correct": false}, {"text": "Create a base class for common transaction functionalities and derive specialized classes for each transaction type.", "correct": true}, {"text": "Use a standalone utility class that handles all types of transactions with conditional statements.", "correct": false}, {"text": "Implement all transaction types within a single class to centralize the transaction management.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Option A is correct because it uses inheritance to share common functionalities among different transaction types. Option B is incorrect as it violates the single responsibility principle and does not use inheritance. Option C is incorrect because it does not leverage the benefits of object-oriented design such as inheritance. Option D is incorrect as it leads to code duplication and does not use inheritance.\n\nImplement Chain of Command - Training | Microsoft Learn Class extension - Method wrapping and Chain of Command - Training | Microsoft Learn", "references": [{"title": "Implement Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/develop-object-oriented-code-finance-operations/4-chain-command"}, {"title": "Class extension - Method wrapping and Chain of Command - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/extensibility/method-wrapping-coc"}]}]}, {"id": "36bcfa236218c3d398952f6176132db5358e45b91b3783752337063fea7d6581", "stem": "Your company is using Dynamics 365 finance and operations apps and wants to leverage Power BI for their reporting needs.\n\nYou need to enable Power BI service features from the Power BI admin portal.\n\nWhat feature should you enable?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Allow XMLA endpoints and Analyze in Excel with on-premise datasets", "correct": true}, {"text": "Allow service principals to use Power BI APIs", "correct": false}, {"text": "Create workspace (new workspace experience)", "correct": false}, {"text": "Enable Power BI data model customization", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "Option A is correct because allowing XMLA endpoints and Analyze in Excel with on-premise datasets enables report authors to build new metrics or bring more data sources. The other options are not directly related to building new metrics or bringing more data sources.\n\nCustomize data models of historical and real-time analytics reports - Training | Microsoft Learn Implement built-in KPIs, charts, and other reporting components - Training | Microsoft Learn", "references": [{"title": "Customize data models of historical and real-time analytics reports - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/customer-service/administer/model-customize-reports"}, {"title": "Implement built-in KPIs, charts, and other reporting components - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/build-workspaces-finance-operations/4-built-in-kpi"}]}]}, {"id": "9c6cd1b7ffed005af945e47e069da6d63fe385718eba2b426c1808d20bea274f", "stem": "You are developing a feature that requires a status field with predefined values to track the progress of an order in Microsoft Dynamics 365 finance and operations apps.\n\nYou need to ensure that the status field can only contain specific values and that these values can be extended in the future.\n\nWhat should you do?", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Create a new EDT with a string type and manually validate the input for the status field.", "correct": false}, {"text": "Add an enumeration to the project and populate it with the required status elements.", "correct": true}, {"text": "Use an existing integer EDT and assign numeric codes to represent different statuses.", "correct": false}, {"text": "Add a new relation to the table for status tracking without using an enumeration.", "correct": false}], "type": "choice", "response_groups": [], "allow_reuse": false, "explanation": "The correct answer is to add an enumeration to the project with the required status elements (Option B), as enumerations are designed to hold a set of named constants which can be extended. Creating a new EDT with a string type (Option A) would not enforce the use of specific values and would require additional validation logic. Using an existing integer EDT (Option C) is not user-friendly and does not provide clear meaning for the statuses. Adding a new relation (Option D) does not address the requirement of having specific values for the status field.\n\nExtension points for frameworks - Training | Microsoft Learn X++ extended data types - Training | Microsoft Learn", "references": [{"title": "Extension points for frameworks - Training | Microsoft Learn", "url": "https://learn.microsoft.com/training/modules/explore-extensions-framework-finance-operations/3-extension-points"}, {"title": "X++ extended data types - Training | Microsoft Learn", "url": "https://learn.microsoft.com/dynamics365/fin-ops-core/dev-itpro/dev-ref/xpp-data-edt"}]}]}, {"id": "1c2d5f990e2189a5726323ef2f92370a96d30208942bc4bc3ee7a71d806b0751", "stem": "You are optimizing the performance of a Microsoft Dynamics 365 finance and operations apps implementation. The application is experiencing slow data retrieval operations when accessing large sets of records from the database.\n\nYou need to enhance the data access layer to improve query performance while minimizing the impact on existing code.\n\nWhat should you do? Each correct answer presents a complete solution. Choose three.", "question_code": "", "question_table": null, "variants": [{"options": [{"text": "Utilize the caching mechanism provided by the framework to reduce database round trips.", "correct": true}, {"text": "Increase the timeout settings for the database connection to allow longer running queries.", "correct": false}, {"text": "Implement query paging to retrieve data in manageable chunks rather than loading all records at once.", "correct": true}, {"text": "Retrieve all records into memory and filter the dataset programmatically.", "correct": false}, {"text": "Use a cursor-based approach to process each record individually for b
